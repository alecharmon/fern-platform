name: Test Containers

on:
  push:
    branches:
      - app
  pull_request:
    paths:
      - ".github/workflows/container-testing.yml"
      - "pnpm-lock.yaml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

jobs:
  fdr:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 10
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Build container
        run: docker build -f servers/fdr/Dockerfile -t fern-definition-registry:local --build-arg DATABASE_URL='postgres://fdr:fdr1!@postgres:5432/postgres' .

      - name: Standup test cluster
        run: docker compose -f servers/fdr/docker-compose.ete.yml up -d --wait

      - name: Run tests
        run: pnpm --filter=@fern-platform/fdr test:ete --run

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: "us-east-1"

      - name: Push to ECR for scanning
        run: |-
          aws sts get-caller-identity
          SANITIZED_BRANCH="${BRANCH_NAME//\//-}"
          docker tag fern-definition-registry:local 985111089818.dkr.ecr.us-east-1.amazonaws.com/dev/fdr-internal:$SANITIZED_BRANCH-${{ github.sha }}
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 985111089818.dkr.ecr.us-east-1.amazonaws.com
          docker push 985111089818.dkr.ecr.us-east-1.amazonaws.com/dev/fdr-internal:$SANITIZED_BRANCH-${{ github.sha }}

    # Cleanup needed locally but not in CI
    # - name: cleanup
    #   run: docker compose -f servers/fdr/docker-compose.ete.yml down -v

  self-hosted:
    runs-on: Seed
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 20
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update Engines
        run: |
          node -e 'const fs = require("fs"); const pkg = require("./package.json"); console.log("Before modification:", JSON.stringify(pkg.engines, null, 2)); pkg.engines.node = ">=20.0.0"; pkg.engines.pnpm = "10.27.0"; pkg.packageManager = "pnpm@10.27.0"; console.log("After modification:", JSON.stringify(pkg.engines, null, 2)); fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));'

      - name: Install
        uses: ./.github/actions/install

      - name: Compile
        run: pnpm compile

      - name: Build FDR CJS
        run: pnpm --filter @fern-platform/fdr build:tsup:cjs

      - name: Build self-hosted bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm docs:self-hosted-bundle:build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Build Docker image
        run: |
          cd servers/self-hosted
          pnpm docker:build
        env:
          DOCKER_BUILDKIT: 1

      #- name: Standup test container
      # Do some testing
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: "us-east-1"

      - name: Push to ECR for scanning
        run: |-
          aws sts get-caller-identity
          SANITIZED_BRANCH="${BRANCH_NAME//\//-}"
          docker tag fern-self-hosted:latest 985111089818.dkr.ecr.us-east-1.amazonaws.com/dev/self-hosted-internal:$SANITIZED_BRANCH-${{ github.sha }}
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 985111089818.dkr.ecr.us-east-1.amazonaws.com
          docker push 985111089818.dkr.ecr.us-east-1.amazonaws.com/dev/self-hosted-internal:$SANITIZED_BRANCH-${{ github.sha }}

  fai:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 15
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Build container
        run: |
          touch servers/fai/.env
          docker build -f servers/fai/Dockerfile -t fai:local servers/

      - name: Test container startup
        run: |
          # Run the container in detached mode and check logs for startup errors
          set +e
          CONTAINER_ID=$(docker run -d --rm fai:local)
          echo "Started container: $CONTAINER_ID"
          
          # Wait a few seconds for the container to start
          sleep 5
          
          # Get container logs
          OUTPUT=$(docker logs "$CONTAINER_ID" 2>&1)
          echo "Container output:"
          echo "$OUTPUT"
          
          # Check if container is still running
          RUNNING=$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null || echo "false")
          echo "Container running: $RUNNING"
          
          # Stop the container
          docker stop "$CONTAINER_ID" 2>/dev/null || true
          
          # Check for module/import errors
          if echo "$OUTPUT" | grep -qE "(ModuleNotFoundError|ImportError|No module named)"; then
            echo "FAILED: Container has Python import errors"
            exit 1
          fi
          
          # If container is running or shows startup messages, it's working
          if [ "$RUNNING" = "true" ] || echo "$OUTPUT" | grep -qiE "(uvicorn|started|running|application startup)"; then
            echo "SUCCESS: Container started successfully"
            exit 0
          fi
          
          # If no import errors found, consider it a pass
          echo "SUCCESS: Container loaded modules successfully"
          exit 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: "us-east-1"

      - name: Push to ECR for scanning
        run: |-
          aws sts get-caller-identity
          SANITIZED_BRANCH="${BRANCH_NAME//\//-}"
          docker tag fai:local 985111089818.dkr.ecr.us-east-1.amazonaws.com/dev/fai-internal:$SANITIZED_BRANCH-${{ github.sha }}
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 985111089818.dkr.ecr.us-east-1.amazonaws.com
          docker push 985111089818.dkr.ecr.us-east-1.amazonaws.com/dev/fai-internal:$SANITIZED_BRANCH-${{ github.sha }}

  fai-chat:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 15
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Build container
        run: |
          docker build -f ./servers/fai-chat/Dockerfile -t fai-chat:local .

      - name: Test container startup
        run: |
          # Run the container in detached mode and check logs for startup errors
          # The container has Lambda Web Adapter which may hang without Lambda runtime
          set +e
          CONTAINER_ID=$(docker run -d --rm -p 8081:8080 fai-chat:local)
          echo "Started container: $CONTAINER_ID"
          
          # Wait a few seconds for the container to start
          sleep 5
          
          # Get container logs
          OUTPUT=$(docker logs "$CONTAINER_ID" 2>&1)
          echo "Container output:"
          echo "$OUTPUT"
          
          # Check if container is still running
          RUNNING=$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null || echo "false")
          echo "Container running: $RUNNING"
          
          # Stop the container
          docker stop "$CONTAINER_ID" 2>/dev/null || true
          
          # Check for module/import errors
          if echo "$OUTPUT" | grep -qE "(ModuleNotFoundError|ImportError|No module named)"; then
            echo "FAILED: Container has Python import errors"
            exit 1
          fi
          
          # If container is running or shows startup messages, it's working
          if [ "$RUNNING" = "true" ] || echo "$OUTPUT" | grep -qiE "(uvicorn|started|running|application startup|FAI Chat)"; then
            echo "SUCCESS: Container started successfully"
            exit 0
          fi
          
          # If no import errors found, consider it a pass
          echo "SUCCESS: Container loaded modules successfully"
          exit 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: "us-east-1"

      - name: Push to ECR for scanning
        run: |-
          aws sts get-caller-identity
          SANITIZED_BRANCH="${BRANCH_NAME//\//-}"
          docker tag fai-chat:local 985111089818.dkr.ecr.us-east-1.amazonaws.com/dev/fai-chat-internal:$SANITIZED_BRANCH-${{ github.sha }}
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 985111089818.dkr.ecr.us-east-1.amazonaws.com
          docker push 985111089818.dkr.ecr.us-east-1.amazonaws.com/dev/fai-chat-internal:$SANITIZED_BRANCH-${{ github.sha }}

  fai-reindexing:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 15
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Build container
        run: |
          docker build -f ./servers/fai-reindexing/Dockerfile -t fai-reindexing:local .

      - name: Test orchestrator startup
        run: |
          # Test the orchestrator entrypoint (dist/index.cjs)
          # Run the container in detached mode with dummy env vars and check logs for startup errors
          set +e
          CONTAINER_ID=$(docker run -d \
            -e SQS_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/123456789/test-queue \
            -e ECS_CLUSTER_NAME=test-cluster \
            -e ECS_EC2_TASK_DEFINITION=test-ec2-task \
            -e ECS_FARGATE_TASK_DEFINITION=test-fargate-task \
            -e ECS_CAPACITY_PROVIDER=test-capacity-provider \
            -e ECS_SUBNETS=subnet-123,subnet-456 \
            -e ECS_SECURITY_GROUPS=sg-123 \
            -e TURBOPUFFER_API_KEY=test-turbopuffer-key \
            -e OPENAI_API_KEY=test-openai-key \
            -e FERN_TOKEN=test-fern-token \
            -e AWS_REGION=us-east-1 \
            -e AWS_ACCESS_KEY_ID=test-access-key \
            -e AWS_SECRET_ACCESS_KEY=test-secret-key \
            fai-reindexing:local)
          echo "Started orchestrator container: $CONTAINER_ID"
          
          # Wait a few seconds for the container to start and potentially fail
          sleep 5
          
          # Get container logs (works even if container has exited)
          OUTPUT=$(docker logs "$CONTAINER_ID" 2>&1)
          echo "Orchestrator output:"
          echo "$OUTPUT"
          
          # Check if container is still running
          RUNNING=$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null || echo "false")
          EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$CONTAINER_ID" 2>/dev/null || echo "unknown")
          echo "Container running: $RUNNING"
          echo "Container exit code: $EXIT_CODE"
          
          # Clean up container
          docker stop "$CONTAINER_ID" 2>/dev/null || true
          docker rm "$CONTAINER_ID" 2>/dev/null || true
          
          # Check for module loading errors (the error from the broken Chainguard image)
          if echo "$OUTPUT" | grep -qE "(Cannot find module|MODULE_NOT_FOUND)"; then
            echo "FAILED: Orchestrator has module loading errors"
            exit 1
          fi
          
          # If container is running or shows startup messages, it's working
          if [ "$RUNNING" = "true" ] || echo "$OUTPUT" | grep -q "Starting FAI Reindexing"; then
            echo "SUCCESS: Orchestrator started successfully"
            exit 0
          fi
          
          # If container exited with non-zero, it failed
          if [ "$RUNNING" = "false" ] && [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "unknown" ]; then
            echo "FAILED: Orchestrator exited with code $EXIT_CODE"
            exit 1
          fi
          
          echo "SUCCESS: Orchestrator loaded modules successfully"

      - name: Test delegated worker startup
        run: |
          # Test the delegated worker entrypoint using the same command format as ECS task definition
          # Chainguard image has entrypoint ["/usr/bin/node"], so we pass just the script path
          # ECS task definition uses command: ["dist/worker.cjs"] which combines with the entrypoint
          # to run "/usr/bin/node dist/worker.cjs"
          set +e
          CONTAINER_ID=$(docker run -d \
            -e REINDEX_DOMAIN=test.docs.buildwithfern.com \
            -e SOURCE_SQS_MESSAGE_ID=test-message-id \
            -e FORCE_FULL_REINDEX=false \
            -e TURBOPUFFER_API_KEY=test-turbopuffer-key \
            -e OPENAI_API_KEY=test-openai-key \
            -e FERN_TOKEN=test-fern-token \
            -e AWS_REGION=us-east-1 \
            -e AWS_ACCESS_KEY_ID=test-access-key \
            -e AWS_SECRET_ACCESS_KEY=test-secret-key \
            fai-reindexing:local dist/worker.cjs)
          echo "Started delegated worker container: $CONTAINER_ID"
          
          # Wait a few seconds for the container to start and potentially fail
          sleep 5
          
          # Get container logs (works even if container has exited)
          OUTPUT=$(docker logs "$CONTAINER_ID" 2>&1)
          echo "Delegated worker output:"
          echo "$OUTPUT"
          
          # Check if container is still running
          RUNNING=$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null || echo "false")
          EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$CONTAINER_ID" 2>/dev/null || echo "unknown")
          echo "Container running: $RUNNING"
          echo "Container exit code: $EXIT_CODE"
          
          # Clean up container
          docker stop "$CONTAINER_ID" 2>/dev/null || true
          docker rm "$CONTAINER_ID" 2>/dev/null || true
          
          # Check for module loading errors (the error from the broken Chainguard image)
          if echo "$OUTPUT" | grep -qE "(Cannot find module|MODULE_NOT_FOUND)"; then
            echo "FAILED: Delegated worker has module loading errors"
            exit 1
          fi
          
          # If container shows startup messages, it's working (will fail later due to fake credentials)
          if echo "$OUTPUT" | grep -q "Starting delegated reindex worker"; then
            echo "SUCCESS: Delegated worker started successfully"
            exit 0
          fi
          
          # If container exited with non-zero and no startup message, it failed to load
          if [ "$RUNNING" = "false" ] && [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "unknown" ]; then
            echo "FAILED: Delegated worker exited with code $EXIT_CODE without starting properly"
            exit 1
          fi
          
          echo "SUCCESS: Delegated worker loaded modules successfully"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: "us-east-1"

      - name: Push to ECR for scanning
        run: |-
          aws sts get-caller-identity
          SANITIZED_BRANCH="${BRANCH_NAME//\//-}"
          docker tag fai-reindexing:local 985111089818.dkr.ecr.us-east-1.amazonaws.com/dev/fai-reindexing-internal:$SANITIZED_BRANCH-${{ github.sha }}
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 985111089818.dkr.ecr.us-east-1.amazonaws.com
          docker push 985111089818.dkr.ecr.us-east-1.amazonaws.com/dev/fai-reindexing-internal:$SANITIZED_BRANCH-${{ github.sha }}
