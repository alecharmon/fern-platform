name: Deploy FAI Reindexing Worker Dev

on:
  push:
    branches:
      - app
    paths:
      - 'servers/fai-reindexing-worker/**'
  workflow_call:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: Fern Dev
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
      FERN_TOKEN: ${{ secrets.DEV_FERN_TOKEN }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
          run_install: false

      - name: Deploy to Dev
        run: |
          git_version="$(git rev-parse --short HEAD)"

          # Build FAI reindexing worker
          cd servers/fai-reindexing-worker
          docker build -t fai-reindexing-worker:${git_version} -f Dockerfile ../../
          docker save fai-reindexing-worker:${git_version} -o fai-reindexing-worker:${git_version}.tar

          # Deploy with CDK
          cd deploy
          pnpm install
          VERSION="${git_version}" pnpm cdk deploy fai-reindexing-worker-dev2 --require-approval never --progress events
