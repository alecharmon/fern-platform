name: Deploy FDR Dev

on:
  workflow_dispatch:
  push:
    branches:
      - "app"
    paths:
      - "fern/apis/fdr/**"
      - "fern/fern.config.json"
      - "servers/fdr-deploy/**"
      - "servers/fdr/**"
      - "servers/docs-pdf-exporter/**"
      - ".github/workflows/deploy-fdr-dev.yml"
      - ".github/workflows/publish-fdr-sdk.yml"
      - "packages/fdr-sdk/**"
      # Remove this once fdr is no longer needed in the generation
      - "packages/fern-docs/search-server/**"
      - "pnpm-lock.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: "@fern-platform/fdr"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.SMOKE_TEST_FERN_TOKEN }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  FERNIE_SLACK_APP_TOKEN: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.FERN_NPM_TOKEN }}
  PDF_EXPORT_JWT_SECRET_KEY: ${{ secrets.PDF_EXPORT_JWT_SECRET_KEY }}
  PDF_EXPORT_FERN_TOKEN: ${{ secrets.VERCEL_DEV_DOCS_FERN_TOKEN }}
  FDR_CRON_SECRET: ${{ secrets.FDR_CRON_SECRET }}

jobs:
  deploy_dev:
    runs-on: Seed
    permissions:
      id-token: write
      contents: read
    environment: Fern Dev
    strategy:
      matrix:
        concurrency: [1]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}/fdr?schema=public&connection_limit=6&pool_timeout=30
      CLOUDFRONT_KEY_PAIR_ID: ${{ secrets.CLOUDFRONT_KEY_PAIR_ID }}
      APPLICATION_ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 🔎 Has changed
        id: has-changed
        # if there are changes, npx turbo-ignore returns a failure exit code
        # which makes steps.has-changed.outputs.RESULT = 'true'
        run: npx turbo-ignore ${{ env.PACKAGE_NAME }} || echo "RESULT=true" >> $GITHUB_OUTPUT

      - name: 🧪 Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          pnpm turbo codegen build --filter=${{ env.PACKAGE_NAME }}

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1

      - name: 🚀 cdk deploy
        id: cdk-deploy
        run: |
          git_version="$(scripts/git-version.sh)"
          pnpm --filter=@fern-platform/fdr run docker:dev "${git_version}"
          pnpm --filter=@fern-api/docs-pdf compile
          pnpm --filter=@fern-platform/docs-pdf-exporter build
          npm install -g aws-cdk
          cd servers/fdr-deploy
          VERSION="${git_version}" pnpm --filter=@fern-platform/fdr-deploy deploy:dev

      - name: 🔍 Dump CloudFormation events on failure
        if: failure() && steps.cdk-deploy.outcome == 'failure'
        run: |
          echo "=== Recent CloudFormation events for fdr-dev2 ==="
          aws cloudformation describe-stack-events \
            --stack-name fdr-dev2 \
            --region us-east-1 \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || contains(ResourceStatusReason || ``, `validation`) || contains(ResourceStatusReason || ``, `hook`) || contains(ResourceStatusReason || ``, `FAILED`)].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
            --output table \
          || true

          echo ""
          echo "=== Last 30 CloudFormation events ==="
          aws cloudformation describe-stack-events \
            --stack-name fdr-dev2 \
            --region us-east-1 \
            --max-items 30 \
            --query 'StackEvents[].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
            --output table \
          || true
        env:
          DATABASE_URL: ${{ secrets.DEV_POSTGRES_URL }}/fdr?schema=public&connection_limit=6&pool_timeout=30
          CLOUDFRONT_KEY_PAIR_ID: ${{ secrets.CLOUDFRONT_KEY_PAIR_ID }}
          # Runtime credentials passed to the Fargate task environment (not used for CI auth)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Clear the OIDC session token so the AWS SDK uses the static credentials above
          AWS_SESSION_TOKEN: ""
          # Required for CDK synthesis (PROD stack) but not used in dev deployment
          CLI_PERMISSION_CHECK_ORG_IDS: ""
          AUTH0_CLIENT_SECRET: ""
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          KV_REST_API_URL: ${{ secrets.MWARE_KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.MWARE_KV_REST_API_TOKEN }}
