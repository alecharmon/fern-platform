name: Deploy Dashboard Dev
env:
  VERCEL_ORG_ID: team_6FKOM5nw037hv8g2mTk3gaH7
  VERCEL_PROJECT_ID: prj_ka9122njnAZrpIWEzatPYzEFL4Ni
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"  
on:
  push:
    tags:
      - "dashboard@*" 
    branches:
      - app
jobs:
  Deploy-Dev:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # This helps turbo resolve changes faster
      - name: Install
        uses: ./.github/actions/install
      - name: Install Vercel CLI
        run: |
          for i in 1 2 3; do
            npm install --global vercel@latest && exit 0
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All attempts failed"
          exit 1
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project to Vercel
        id: deploy
        # Don't pass --prebuilt: it's not compatible with Skew Protection
        # https://vercel.com/docs/cli/deploy#when-not-to-use---prebuilt
        run: |
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "VERCEL_DEPLOYMENT_URL=$url" >> $GITHUB_OUTPUT
