name: Update Snippets Dependencies

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install
        uses: ./.github/actions/install

      - name: Update dynamic snippets dependencies
        id: update
        run: |
          cd packages/snippets
          
          # Update dynamic snippets dependencies within their semver ranges
          pnpm update \
            @fern-api/csharp-dynamic-snippets \
            @fern-api/dynamic-ir-sdk \
            @fern-api/go-dynamic-snippets \
            @fern-api/java-dynamic-snippets \
            @fern-api/php-dynamic-snippets \
            @fern-api/python-dynamic-snippets \
            @fern-api/ruby-dynamic-snippets \
            @fern-api/snippets-core \
            @fern-api/typescript-dynamic-snippets
          
          cd ../..
          
          # Run format on snippets package to fix any linting issues
          pnpm exec biome check --write packages/snippets
          
          # Check if there are any changes to snippets package or lockfile
          if git diff --quiet packages/snippets/package.json pnpm-lock.yaml; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No dependency updates available"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Dependencies updated successfully"
          fi

      - name: Create Pull Request
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(snippets): update dynamic snippets dependencies'
          branch: devin/update-snippets-deps-${{ github.run_number }}
          delete-branch: true
          title: 'chore(snippets): update dynamic snippets dependencies'
          body: |
            This PR updates the dynamic snippets package dependencies to their latest versions.
            
            Updated packages:
            - @fern-api/csharp-dynamic-snippets
            - @fern-api/dynamic-ir-sdk
            - @fern-api/go-dynamic-snippets
            - @fern-api/java-dynamic-snippets
            - @fern-api/php-dynamic-snippets
            - @fern-api/python-dynamic-snippets
            - @fern-api/ruby-dynamic-snippets
            - @fern-api/snippets-core
            - @fern-api/typescript-dynamic-snippets
            
            This PR was automatically generated by the daily dependency update workflow.
          labels: |
            dependencies
            automated
