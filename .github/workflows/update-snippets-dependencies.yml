name: Update Snippets Dependencies

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: app
          fetch-depth: 0

      - name: Install
        uses: ./.github/actions/install

      - name: Capture current versions
        id: before
        run: |
          echo "versions<<EOF" >> $GITHUB_OUTPUT
          node -e "
            const pkg = require('./packages/snippets/package.json');
            const deps = [
              '@fern-api/csharp-dynamic-snippets',
              '@fern-api/dynamic-ir-sdk',
              '@fern-api/go-dynamic-snippets',
              '@fern-api/java-dynamic-snippets',
              '@fern-api/php-dynamic-snippets',
              '@fern-api/python-dynamic-snippets',
              '@fern-api/ruby-dynamic-snippets',
              '@fern-api/snippets-core',
              '@fern-api/typescript-dynamic-snippets',
            ];
            for (const dep of deps) {
              console.log(dep + ':' + (pkg.dependencies[dep] || 'N/A'));
            }
          " >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update dynamic snippets dependencies
        id: update
        run: |
          # Update dynamic snippets dependencies to latest, scoped to the snippets workspace only
          pnpm --filter @fern-api/snippets update \
            @fern-api/csharp-dynamic-snippets \
            @fern-api/dynamic-ir-sdk \
            @fern-api/go-dynamic-snippets \
            @fern-api/java-dynamic-snippets \
            @fern-api/php-dynamic-snippets \
            @fern-api/python-dynamic-snippets \
            @fern-api/ruby-dynamic-snippets \
            @fern-api/snippets-core \
            @fern-api/typescript-dynamic-snippets \
            --latest

          # Dedupe lockfile to avoid duplicate dependency resolutions
          pnpm dedupe

          # Run format on snippets package to fix any linting issues
          pnpm exec biome check --write packages/snippets

          # Check if there are any changes to snippets package or lockfile
          if git diff --quiet packages/snippets/package.json pnpm-lock.yaml; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No dependency updates available"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Dependencies updated successfully"
          fi

      - name: Generate version diff
        if: steps.update.outputs.has_changes == 'true'
        id: diff
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "This PR updates the dynamic snippets package dependencies to their latest versions." >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Version changes" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "| Package | Before | After |" >> $GITHUB_OUTPUT
          echo "| --- | --- | --- |" >> $GITHUB_OUTPUT
          node -e "
            const pkg = require('./packages/snippets/package.json');
            const before = process.env.BEFORE_VERSIONS;
            const lines = before.trim().split('\n');
            for (const line of lines) {
              const [dep, oldVer] = line.split(':');
              const newVer = pkg.dependencies[dep] || 'N/A';
              const changed = oldVer !== newVer ? ' **changed**' : '';
              console.log('| ' + dep + ' | ' + oldVer + ' | ' + newVer + changed + ' |');
            }
          " >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "This PR was automatically generated by the daily dependency update workflow." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          BEFORE_VERSIONS: ${{ steps.before.outputs.versions }}

      - name: Update snapshots if needed
        if: steps.update.outputs.has_changes == 'true'
        run: pnpm --filter @fern-api/snippets test:update

      - name: Verify build
        if: steps.update.outputs.has_changes == 'true'
        run: pnpm --filter @fern-api/snippets build

      - name: Create Pull Request
        id: cpr
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}
          commit-message: 'chore(deps): update dynamic snippets dependencies'
          branch: auto/update-snippets-deps
          base: app
          delete-branch: true
          title: 'chore(deps): update dynamic snippets dependencies'
          body: ${{ steps.diff.outputs.body }}
          labels: |
            dependencies
            automated

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

      - name: Approve PR
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: ./.github/actions/auto-approve
        with:
          approver-gh-token: ${{ secrets.PR_BOT_GH_PAT }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
