name: Deploy @fern-docs/icons-cdn
env:
  VERCEL_ORG_ID: team_6FKOM5nw037hv8g2mTk3gaH7
  VERCEL_PROJECT_ID: prj_MO0ayWSAeIoBYh8Cd13oigkd9knl
on:
  push:
    branches:
      - app
  workflow_dispatch:
  # allow manual run

# cancel previous workflows on previous push so we don't have deploys overwriting each other here
concurrency:
  group: icons.ferndocs.com
  cancel-in-progress: true

jobs:
  ignore:
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.has-changed.outputs.RESULT == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          
      - name: 🔎 Has changed
        id: has-changed
        # if there are changes, npx turbo-ignore returns a failure exit code
        # which makes steps.has-changed.outputs.RESULT = 'true'
        run: npx turbo-ignore @fern-docs/icons-cdn HEAD~1 || echo "RESULT=true" >> $GITHUB_OUTPUT

  deploy:
    needs: ignore
    if: needs.ignore.outputs.continue == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # This helps turbo resolve changes faster
      - name: Install
        uses: ./.github/actions/install
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "VERCEL_DEPLOYMENT_URL=$url" >> $GITHUB_OUTPUT
      - name: Promote Deployment
        run: |
          url="${{ steps.deploy.outputs.VERCEL_DEPLOYMENT_URL }}"
          output=$(vercel promote $url --scope=buildwithfern --token=${{ secrets.VERCEL_TOKEN }} 2>&1) || {
            if echo "$output" | grep -q "(409)"; then
              echo "Deployment is already the current production deployment. Skipping promote."
            else
              echo "$output"
              exit 1
            fi
          }                                                    
