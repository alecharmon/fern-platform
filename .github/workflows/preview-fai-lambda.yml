name: Preview FAI Lambda

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "servers/fai-lambda/fai-chat/**"
      - "servers/fai-lambda-deploy/**"
      - ".github/workflows/preview-fai-lambda.yml"
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}

jobs:
  preview_chat_lambda:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    environment: Fern Dev
    strategy:
      matrix:
        concurrency: [1]
    env:
      APPLICATION_ENVIRONMENT: dev
      PREVIEW: "true"
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 🚀 Deploy Preview Stack
        id: deploy
        run: |
          git_version="$(scripts/git-version.sh)"
          npm install -g aws-cdk
          cd servers/fai-lambda-deploy
          VERSION="${git_version}" PR_NUMBER="${{ github.event.pull_request.number }}" PREVIEW=true pnpm --filter=@fern-platform/fai-lambda-deploy deploy:preview:chat

          # Extract the preview URL from CDK output
          if [ -f preview-output.json ]; then
            PREVIEW_URL=$(jq -r '.["fai-chat-preview-${{ github.event.pull_request.number }}"].PreviewUrl // .["fai-chat-preview-${{ github.event.pull_request.number }}"].ApiUrl' preview-output.json)
            echo "PREVIEW_URL=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Test Preview Lambda
        run: |
          PREVIEW_URL="${{ steps.deploy.outputs.PREVIEW_URL }}"
          echo "Testing Lambda at: ${PREVIEW_URL}"

          # Wait for Lambda to be ready
          sleep 5

          # Test health endpoint
          echo "Testing health endpoint..."
          curl -f "${PREVIEW_URL}/health" || echo "Health endpoint test failed"

          # Test chat endpoint (basic smoke test without auth)
          echo "Testing chat endpoint availability..."
          curl -X POST "${PREVIEW_URL}/chat" \
            -H "Content-Type: application/json" \
            --max-time 10 || echo "Chat endpoint test completed (may require auth)"

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.deploy.outputs.PREVIEW_URL }}';
            const prNumber = context.issue.number;

            const body = `## 🚀 FAI Chat Lambda Preview Deployed

            Your Lambda function has been deployed to a preview environment!

            **🔗 Preview URL:** ${previewUrl}

            **📝 Available Endpoints:**
            - Health: \`GET ${previewUrl}/health\`
            - Chat (streaming): \`POST ${previewUrl}/chat\`

            **📋 Example Usage:**
            \`\`\`bash
            # Test health endpoint
            curl "${previewUrl}/health"

            # Test chat endpoint (currently returns hardcoded response)
            curl -X POST "${previewUrl}/chat"
            \`\`\`

            **🏷️ Stack Name:** \`fai-chat-preview-${prNumber}\`

            **ℹ️ Note:** This preview will be automatically destroyed when the PR is closed or merged.`;

            // Find existing preview comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 FAI Chat Lambda Preview Deployed')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  cleanup_preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    environment: Fern Dev
    env:
      APPLICATION_ENVIRONMENT: dev
      PREVIEW: "true"
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 🗑️ Destroy Preview Stack
        run: |
          git_version="$(scripts/git-version.sh)"
          npm install -g aws-cdk
          cd servers/fai-lambda-deploy
          VERSION="${git_version}" PR_NUMBER="${{ github.event.pull_request.number }}" PREVIEW=true pnpm --filter=@fern-platform/fai-lambda-deploy destroy:preview:chat || echo "Stack may already be destroyed"

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🗑️ Preview Environment Cleaned Up\n\nThe preview Lambda stack \`fai-chat-preview-${prNumber}\` has been destroyed.`
            });
