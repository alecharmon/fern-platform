name: Monitor Docs Health

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm install -g tsx @fern-api/incidentio && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          # Verify installation succeeded
          command -v tsx || { echo "Installation failed after all retries"; exit 1; }
          echo "NODE_PATH=$(npm root -g)" >> $GITHUB_ENV

      - name: Run health check
        env:
          SLACK_WEBHOOK_URL_DOCS_INCIDENTS: ${{ secrets.SLACK_WEBHOOK_URL_DOCS_INCIDENTS }}
          INCIDENT_API_KEY: ${{ secrets.INCIDENT_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          tsx scripts/monitor/check-docs-health.ts
