name: Publish FDR Lambda SDK

on:
  workflow_dispatch:

env:
  PACKAGE_NAME: "@fern-api/fdr-lambda-sdk"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish_fdr_lambda_sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Install
        uses: ./.github/actions/install
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: 🧪 Build and test
        run: pnpm turbo compile test --filter=${{ env.PACKAGE_NAME }}

      - name: Publish FDR Lambda SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FERN_NPM_TOKEN }}
        run: |
          git_version="$(scripts/fdr-version.sh)"
          cd packages/fdr-lambda-sdk
          mv package.json package.json.tmp
          version_replace="s/0.0.0/${git_version}/"
          workspace_replace="s/workspace:*/^${git_version}/"
          cat package.json.tmp | sed "${version_replace}" | sed "${workspace_replace}" > package.json
          rm -rf package.json.tmp
          npm publish --access public --tag latest
