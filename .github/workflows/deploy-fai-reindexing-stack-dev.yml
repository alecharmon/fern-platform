name: Deploy FAI Reindexing Stack Dev

on:
  push:
    branches:
      - app
    tags-ignore:
      - '**'
    paths:
      - 'servers/fai-reindexing/**'
  workflow_dispatch:
  workflow_call:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: Fern Dev
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
      EDGE_CONFIG: ${{ secrets.EDGE_CONFIG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Deploy to Dev
        run: |
          git_version="$(git rev-parse --short HEAD)"

          # Install dependencies
          pnpm install

          # Build FAI SDK (required for lambda bundle)
          pnpm --filter=@fern-api/fai-sdk build

          # Build FAI reindexing stack
          cd servers/fai-reindexing

          # Build Lambda function
          pnpm build:lambda

          # Build Docker container
          docker build -t fai-reindexing-scheduler:${git_version} -f Dockerfile ../../
          docker save fai-reindexing-scheduler:${git_version} -o fai-reindexing-scheduler:${git_version}.tar

          # Deploy with CDK
          cd deploy
          pnpm install
          VERSION="${git_version}" pnpm cdk deploy fai-reindexing-scheduler-dev2 --require-approval never --progress events
