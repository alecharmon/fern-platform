name: Deploy FAI Reindexing Stack Dev

on:
  push:
    branches:
      - app
    tags-ignore:
      - '**'
    paths:
      - 'servers/fai-reindexing/**'
  workflow_dispatch:
  workflow_call:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: Fern Dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      DEV_FERN_TOKEN: ${{ secrets.DEV_FERN_TOKEN }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
      EDGE_CONFIG: ${{ secrets.EDGE_CONFIG }}
      DEV_EDGE_CONFIG: ${{ secrets.DEV_EDGE_CONFIG }}
      DEV2_DB_DOCS_DEFINITION_BUCKET_NAME: ${{ secrets.DEV2_DB_DOCS_DEFINITION_BUCKET_NAME }}
      DEV2_DB_DOCS_DEFINITION_BUCKET_REGION: ${{ secrets.DEV2_DB_DOCS_DEFINITION_BUCKET_REGION }}
      DEPLOY_ENVIRONMENT: dev2
      FAI_SENTRY_DSN: ${{ secrets.FAI_SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1
      - name: Deploy to Dev
        run: |
          git_version="$(git rev-parse --short HEAD)"

          # Install dependencies
          pnpm install

          # Build FAI SDK (required for lambda bundle)
          pnpm --filter=@fern-api/fai-sdk build

          # Build FAI reindexing stack
          cd servers/fai-reindexing

          # Build Lambda function
          pnpm build:lambda

          # Build Docker container
          docker build -t fai-reindexing-scheduler:${git_version} -f Dockerfile ../../
          docker save fai-reindexing-scheduler:${git_version} -o fai-reindexing-scheduler:${git_version}.tar

          # Deploy with CDK
          cd deploy
          pnpm install
          DEPLOY_ENVIRONMENT=dev2 VERSION="${git_version}" pnpm cdk deploy fai-reindexing-scheduler-dev2 --require-approval never --progress events
