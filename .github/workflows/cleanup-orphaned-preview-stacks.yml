name: Cleanup Orphaned Preview Resources

on:
  schedule:
    - cron: "0 6 * * *" # Run daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (only report, don't delete)"
        required: false
        default: "false"
        type: boolean

env:
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}

jobs:
  cleanup_fdr_lambda_previews:
    runs-on: ubuntu-latest
    environment: Fern Dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1
          role-duration-seconds: 5400 # 90 minutes - sufficient with parallel deletions

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Find and cleanup orphaned FDR Lambda preview stacks
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "=== Cleaning up orphaned FDR Lambda preview stacks ==="
          echo "Dry run mode: $DRY_RUN"

          # Get all FDR Lambda preview stacks (including those that previously failed to delete)
          echo "Fetching CloudFormation stacks..."
          STACKS=$(aws cloudformation list-stacks \
            --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE ROLLBACK_COMPLETE DELETE_FAILED \
            --query "StackSummaries[?starts_with(StackName, 'fdr-lambda-preview-')].StackName" \
            --output text)

          if [ -z "$STACKS" ]; then
            echo "No FDR Lambda preview stacks found."
            exit 0
          fi

          echo "Found preview stacks: $STACKS"

          # Get list of open PRs
          echo "Fetching open PRs..."
          OPEN_PRS=$(gh pr list --repo fern-api/fern-platform --state open --json number --jq '.[].number')
          echo "Open PRs: $OPEN_PRS"

          # Phase 1: Identify orphaned stacks and trigger deletions in parallel
          echo ""
          echo "=== Phase 1: Triggering deletions ==="
          ORPHANED_STACKS=""

          for STACK in $STACKS; do
            PR_NUMBER=$(echo "$STACK" | sed 's/fdr-lambda-preview-//')

            if echo "$OPEN_PRS" | grep -q "^${PR_NUMBER}$"; then
              echo "Stack $STACK: PR #$PR_NUMBER is still open, skipping."
              continue
            fi

            echo "Stack $STACK: PR #$PR_NUMBER is closed/merged, marking for cleanup."
            ORPHANED_STACKS="$ORPHANED_STACKS $STACK"

            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY RUN] Would delete stack: $STACK"
            else
              echo "Triggering deletion for stack: $STACK"
              if aws cloudformation delete-stack --stack-name "$STACK"; then
                echo "  Delete initiated for $STACK"
              else
                echo "  WARNING: Failed to initiate deletion for $STACK"
              fi
              sleep 5
            fi
          done

          ORPHANED_COUNT=$(echo $ORPHANED_STACKS | wc -w)
          echo ""
          echo "Orphaned stacks found: $ORPHANED_COUNT"

          if [ "$DRY_RUN" = "true" ] || [ -z "$ORPHANED_STACKS" ]; then
            echo "=== Summary ==="
            echo "Stacks that would be deleted: $ORPHANED_COUNT"
            exit 0
          fi

          # Phase 2: Poll for completion with retries
          echo ""
          echo "=== Phase 2: Waiting for deletions to complete ==="
          MAX_RETRIES=3
          CLEANED_COUNT=0
          FAILED_COUNT=0

          for STACK in $ORPHANED_STACKS; do
            echo "Checking status of $STACK..."
            RETRY_COUNT=0
            DELETE_SUCCESS=false

            while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ] && [ "$DELETE_SUCCESS" = "false" ]; do
              # Check current stack status
              STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" 2>/dev/null \
                | jq -r '.Stacks[0].StackStatus // empty' || echo "")

              if [ -z "$STACK_STATUS" ]; then
                echo "  Stack $STACK has been deleted successfully."
                CLEANED_COUNT=$((CLEANED_COUNT + 1))
                DELETE_SUCCESS=true
              elif [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then
                echo "  Stack $STACK is still deleting, waiting (timeout: 30 min)..."
                if timeout 1800 aws cloudformation wait stack-delete-complete --stack-name "$STACK" 2>/dev/null; then
                  echo "  Stack $STACK deleted successfully."
                  CLEANED_COUNT=$((CLEANED_COUNT + 1))
                  DELETE_SUCCESS=true
                else
                  WAIT_EXIT_CODE=$?
                  if [ "$WAIT_EXIT_CODE" -eq 124 ]; then
                    echo "  WARNING: Timed out after 30 minutes waiting for $STACK."
                  else
                    echo "  WARNING: Wait failed for $STACK (exit code: $WAIT_EXIT_CODE)."
                  fi
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                fi
              elif [ "$STACK_STATUS" = "DELETE_FAILED" ]; then
                echo "  Stack $STACK deletion failed, retrying..."
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
                  aws cloudformation delete-stack --stack-name "$STACK" || true
                  sleep 10
                fi
              else
                echo "  Stack $STACK is in unexpected state: $STACK_STATUS, retrying deletion..."
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
                  aws cloudformation delete-stack --stack-name "$STACK" || true
                  sleep 10
                fi
              fi
            done

            if [ "$DELETE_SUCCESS" = "false" ]; then
              echo "  ERROR: Failed to delete stack $STACK after $MAX_RETRIES retries."
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          done

          echo ""
          echo "=== Summary ==="
          echo "Orphaned stacks found: $ORPHANED_COUNT"
          echo "Stacks deleted: $CLEANED_COUNT"
          echo "Stacks failed: $FAILED_COUNT"
          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "WARNING: $FAILED_COUNT stack deletion(s) failed. These will be retried on the next scheduled run."
          fi

      - name: Cleanup orphaned security group rules
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          RDS_PROXY_SG_ID: sg-0158802587ada8261
        run: |
          echo "=== Cleaning up orphaned security group rules ==="
          echo "RDS Proxy Security Group: $RDS_PROXY_SG_ID"
          echo "Dry run mode: $DRY_RUN"

          # Get all ingress rules for the RDS Proxy security group
          echo "Fetching security group rules..."
          RULES=$(aws ec2 describe-security-group-rules \
            --filters "Name=group-id,Values=$RDS_PROXY_SG_ID" \
            --query "SecurityGroupRules[?IsEgress==\`false\`]" \
            --output json)

          # Get list of existing Lambda security groups (from active preview stacks)
          echo "Fetching active Lambda security groups..."
          ACTIVE_SGS=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=*fdr-lambda-preview*" \
            --query "SecurityGroups[].GroupId" \
            --output text)

          echo "Active Lambda security groups: $ACTIVE_SGS"

          ORPHANED_COUNT=0
          CLEANED_COUNT=0

          # Parse rules and find orphaned ones
          echo "$RULES" | jq -c '.[]' | while read -r RULE; do
            RULE_ID=$(echo "$RULE" | jq -r '.SecurityGroupRuleId')
            REFERENCED_SG=$(echo "$RULE" | jq -r '.ReferencedGroupInfo.GroupId // empty')
            DESCRIPTION=$(echo "$RULE" | jq -r '.Description // "No description"')

            # Skip rules that don't reference another security group
            if [ -z "$REFERENCED_SG" ]; then
              continue
            fi

            # Check if the referenced security group is from a Lambda preview
            if ! echo "$DESCRIPTION" | grep -qi "lambda"; then
              continue
            fi

            # Check if the referenced security group still exists
            if echo "$ACTIVE_SGS" | grep -q "$REFERENCED_SG"; then
              echo "Rule $RULE_ID: References active security group $REFERENCED_SG, skipping."
              continue
            fi

            # Check if the security group exists at all
            SG_EXISTS=$(aws ec2 describe-security-groups --group-ids "$REFERENCED_SG" 2>/dev/null || echo "")
            if [ -n "$SG_EXISTS" ]; then
              echo "Rule $RULE_ID: Referenced security group $REFERENCED_SG exists but is not a preview Lambda SG, skipping."
              continue
            fi

            echo "Rule $RULE_ID: References non-existent security group $REFERENCED_SG (Description: $DESCRIPTION), marking for cleanup."
            ORPHANED_COUNT=$((ORPHANED_COUNT + 1))

            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY RUN] Would delete rule: $RULE_ID"
            else
              echo "Deleting rule: $RULE_ID"
              aws ec2 revoke-security-group-ingress \
                --group-id "$RDS_PROXY_SG_ID" \
                --security-group-rule-ids "$RULE_ID" || echo "Failed to delete rule $RULE_ID"
              CLEANED_COUNT=$((CLEANED_COUNT + 1))
            fi
          done

          echo ""
          echo "=== Security Group Rules Summary ==="
          echo "Note: Orphaned rules referencing non-existent security groups have been cleaned up."

  cleanup_fai_chat_previews:
    runs-on: ubuntu-latest
    environment: Fern Dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1
          role-duration-seconds: 5400 # 90 minutes - sufficient with parallel deletions

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Find and cleanup orphaned FAI Chat preview stacks
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "=== Cleaning up orphaned FAI Chat preview stacks ==="
          echo "Dry run mode: $DRY_RUN"

          # Get all FAI Chat preview stacks (including those that previously failed to delete)
          echo "Fetching CloudFormation stacks..."
          STACKS=$(aws cloudformation list-stacks \
            --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE ROLLBACK_COMPLETE DELETE_FAILED \
            --query "StackSummaries[?starts_with(StackName, 'fai-chat-preview-')].StackName" \
            --output text)

          if [ -z "$STACKS" ]; then
            echo "No FAI Chat preview stacks found."
            exit 0
          fi

          echo "Found preview stacks: $STACKS"

          # Get list of open PRs with deployFaiChat label
          echo "Fetching open PRs with deployFaiChat label..."
          OPEN_PRS=$(gh pr list --repo fern-api/fern-platform --state open --label deployFaiChat --json number --jq '.[].number')
          echo "Open PRs with deployFaiChat label: $OPEN_PRS"

          # Phase 1: Identify orphaned stacks and trigger deletions in parallel
          echo ""
          echo "=== Phase 1: Triggering deletions ==="
          ORPHANED_STACKS=""

          for STACK in $STACKS; do
            PR_NUMBER=$(echo "$STACK" | sed 's/fai-chat-preview-//')

            if echo "$OPEN_PRS" | grep -q "^${PR_NUMBER}$"; then
              echo "Stack $STACK: PR #$PR_NUMBER is still open with deployFaiChat label, skipping."
              continue
            fi

            echo "Stack $STACK: PR #$PR_NUMBER is closed/merged or label removed, marking for cleanup."
            ORPHANED_STACKS="$ORPHANED_STACKS $STACK"

            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY RUN] Would delete stack: $STACK"
            else
              echo "Triggering deletion for stack: $STACK"
              if aws cloudformation delete-stack --stack-name "$STACK"; then
                echo "  Delete initiated for $STACK"
              else
                echo "  WARNING: Failed to initiate deletion for $STACK"
              fi
              sleep 5
            fi
          done

          ORPHANED_COUNT=$(echo $ORPHANED_STACKS | wc -w)
          echo ""
          echo "Orphaned stacks found: $ORPHANED_COUNT"

          if [ "$DRY_RUN" = "true" ] || [ -z "$ORPHANED_STACKS" ]; then
            echo "=== Summary ==="
            echo "Stacks that would be deleted: $ORPHANED_COUNT"
            exit 0
          fi

          # Phase 2: Poll for completion with retries
          echo ""
          echo "=== Phase 2: Waiting for deletions to complete ==="
          MAX_RETRIES=3
          CLEANED_COUNT=0
          FAILED_COUNT=0

          for STACK in $ORPHANED_STACKS; do
            echo "Checking status of $STACK..."
            RETRY_COUNT=0
            DELETE_SUCCESS=false

            while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ] && [ "$DELETE_SUCCESS" = "false" ]; do
              # Check current stack status
              STACK_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" 2>/dev/null \
                | jq -r '.Stacks[0].StackStatus // empty' || echo "")

              if [ -z "$STACK_STATUS" ]; then
                echo "  Stack $STACK has been deleted successfully."
                CLEANED_COUNT=$((CLEANED_COUNT + 1))
                DELETE_SUCCESS=true
              elif [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then
                echo "  Stack $STACK is still deleting, waiting (timeout: 30 min)..."
                if timeout 1800 aws cloudformation wait stack-delete-complete --stack-name "$STACK" 2>/dev/null; then
                  echo "  Stack $STACK deleted successfully."
                  CLEANED_COUNT=$((CLEANED_COUNT + 1))
                  DELETE_SUCCESS=true
                else
                  WAIT_EXIT_CODE=$?
                  if [ "$WAIT_EXIT_CODE" -eq 124 ]; then
                    echo "  WARNING: Timed out after 30 minutes waiting for $STACK."
                  else
                    echo "  WARNING: Wait failed for $STACK (exit code: $WAIT_EXIT_CODE)."
                  fi
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                fi
              elif [ "$STACK_STATUS" = "DELETE_FAILED" ]; then
                echo "  Stack $STACK deletion failed, retrying..."
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
                  aws cloudformation delete-stack --stack-name "$STACK" || true
                  sleep 10
                fi
              else
                echo "  Stack $STACK is in unexpected state: $STACK_STATUS, retrying deletion..."
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
                  aws cloudformation delete-stack --stack-name "$STACK" || true
                  sleep 10
                fi
              fi
            done

            if [ "$DELETE_SUCCESS" = "false" ]; then
              echo "  ERROR: Failed to delete stack $STACK after $MAX_RETRIES retries."
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          done

          echo ""
          echo "=== Summary ==="
          echo "Orphaned stacks found: $ORPHANED_COUNT"
          echo "Stacks deleted: $CLEANED_COUNT"
          echo "Stacks failed: $FAILED_COUNT"
          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "WARNING: $FAILED_COUNT stack deletion(s) failed. These will be retried on the next scheduled run."
          fi

  cleanup_k8s_pr_previews:
    runs-on: ubuntu-latest
    environment: Fern Dev
    permissions:
      id-token: write
      contents: read
    env:
      EKS_CLUSTER_NAME: ${{ vars.EKS_SMOKE_TEST_CLUSTER_NAME || 'self-hosted' }}
      AWS_REGION: ${{ vars.EKS_SMOKE_TEST_AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1
          role-duration-seconds: 5400

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Find and cleanup orphaned k8s PR preview namespaces
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "=== Cleaning up orphaned k8s PR preview namespaces ==="
          echo "Dry run mode: $DRY_RUN"

          # Get all self-hosted-pr-* namespaces
          echo "Fetching k8s namespaces..."
          NAMESPACES=$(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep '^self-hosted-pr-' || true)

          if [ -z "$NAMESPACES" ]; then
            echo "No self-hosted PR preview namespaces found."
            exit 0
          fi

          echo "Found preview namespaces:"
          echo "$NAMESPACES"

          # Get list of open PRs
          echo ""
          echo "Fetching open PRs..."
          OPEN_PRS=$(gh pr list --repo fern-api/fern-platform --state open --json number --jq '.[].number')
          echo "Open PRs: $OPEN_PRS"

          ORPHANED_NAMESPACES=""
          ORPHANED_COUNT=0
          CLEANED_COUNT=0
          FAILED_COUNT=0

          for NS in $NAMESPACES; do
            PR_NUMBER=$(echo "$NS" | sed 's/self-hosted-pr-//')

            if echo "$OPEN_PRS" | grep -q "^${PR_NUMBER}$"; then
              echo "Namespace $NS: PR #$PR_NUMBER is still open, skipping."
              continue
            fi

            echo "Namespace $NS: PR #$PR_NUMBER is closed/merged, marking for cleanup."
            ORPHANED_NAMESPACES="$ORPHANED_NAMESPACES $NS"
            ORPHANED_COUNT=$((ORPHANED_COUNT + 1))

            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY RUN] Would delete namespace: $NS"
            else
              echo "Deleting namespace: $NS"
              if kubectl delete namespace "$NS" --timeout=120s 2>/dev/null; then
                echo "  Namespace $NS deleted successfully."
                CLEANED_COUNT=$((CLEANED_COUNT + 1))
              else
                echo "  WARNING: Failed to delete namespace $NS, it may be cleaned up eventually."
                FAILED_COUNT=$((FAILED_COUNT + 1))
              fi
            fi
          done

          echo ""
          echo "=== k8s Namespace Cleanup Summary ==="
          echo "Orphaned namespaces found: $ORPHANED_COUNT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Namespaces that would be deleted: $ORPHANED_COUNT"
          else
            echo "Namespaces deleted: $CLEANED_COUNT"
            echo "Namespaces failed: $FAILED_COUNT"
            if [ "$FAILED_COUNT" -gt 0 ]; then
              echo "WARNING: $FAILED_COUNT namespace deletion(s) failed. These will be retried on the next scheduled run."
            fi
          fi
