name: Deploy self-hosted PR preview

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EKS_CLUSTER_NAME: ${{ vars.EKS_SMOKE_TEST_CLUSTER_NAME || 'self-hosted' }}
  AWS_REGION: ${{ vars.EKS_SMOKE_TEST_AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: "985111089818"
  DEPLOYMENT_NAME: fern-docs-pr-preview

jobs:
  deploy-pr-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Lookup open PR for branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Looking up open PR for branch: $BRANCH"

          PR_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -G "https://api.github.com/repos/${{ github.repository }}/pulls" \
            --data-urlencode "head=${{ github.repository_owner }}:${BRANCH}" \
            --data-urlencode "state=open")

          PR_COUNT=$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(0,"utf8")||"[]"); process.stdout.write(String(d.length));' <<<"$PR_JSON")
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "::error::No open PR found for branch '$BRANCH'. This workflow requires an open PR so that the preview deployment is cleaned up when the PR is closed."
            exit 1
          fi

          PR_NUMBER=$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(0,"utf8")||"[]"); process.stdout.write(d[0]?String(d[0].number):"");' <<<"$PR_JSON")
          PR_SHA=$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(0,"utf8")||"[]"); process.stdout.write(d[0] && d[0].head && d[0].head.sha ? String(d[0].head.sha) : "");' <<<"$PR_JSON")

          if [ -z "$PR_NUMBER" ] || [ -z "$PR_SHA" ]; then
            echo "::error::Failed to resolve PR number and head SHA for branch '$BRANCH'."
            exit 1
          fi

          echo "Found open PR #$PR_NUMBER at commit $PR_SHA"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_sha=$PR_SHA" >> $GITHUB_OUTPUT

      - name: Set environment variables
        run: |
          echo "PR_NUMBER=${{ steps.pr.outputs.pr_number }}" >> $GITHUB_ENV
          echo "PR_SHA=${{ steps.pr.outputs.pr_sha }}" >> $GITHUB_ENV
          echo "NAMESPACE=self-hosted-pr-${{ steps.pr.outputs.pr_number }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=pr-${{ steps.pr.outputs.pr_number }}-${{ steps.pr.outputs.pr_sha }}" >> $GITHUB_ENV
          echo "PR_IMAGE=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/smoke-test:pr-${{ steps.pr.outputs.pr_number }}-${{ steps.pr.outputs.pr_sha }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Validate VPC subnets for internet-facing LoadBalancer
        run: |
          echo "Checking that EKS VPC subnets are tagged for internet-facing LoadBalancers..."

          VPC_ID=$(aws eks describe-cluster --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }} \
            --query 'cluster.resourcesVpcConfig.vpcId' --output text)
          echo "EKS VPC: $VPC_ID"

          TAGGED_SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:kubernetes.io/role/elb,Values=1" \
            --query 'Subnets[*].SubnetId' --output text --region ${{ env.AWS_REGION }})

          if [ -z "$TAGGED_SUBNETS" ]; then
            echo "::error::No subnets tagged with kubernetes.io/role/elb=1 in VPC $VPC_ID."
            echo "::error::Internet-facing LoadBalancers require at least one public subnet with this tag."
            echo "::error::Tag your public subnets: aws ec2 create-tags --resources <subnet-ids> --tags Key=kubernetes.io/role/elb,Value=1"
            exit 1
          fi

          echo "Found tagged subnets: $TAGGED_SUBNETS"
          echo "VPC is correctly configured for internet-facing LoadBalancers."

      - name: Create namespace if not exists
        run: |
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Delete existing deployment if exists
        run: |
          echo "Checking for existing deployment..."
          if kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n $NAMESPACE 2>/dev/null; then
            echo "Deleting existing deployment to ensure clean rollout..."
            kubectl delete deployment ${{ env.DEPLOYMENT_NAME }} -n $NAMESPACE --timeout=60s || true
            kubectl wait --for=delete pod -l app=${{ env.DEPLOYMENT_NAME }} -n $NAMESPACE --timeout=60s || true
            echo "Existing deployment deleted"
          else
            echo "No existing deployment found"
          fi

      - name: Wait for image to be available in ECR
        run: |
          echo "Waiting up to 5 minutes for ECR image: $PR_IMAGE"

          for i in {1..30}; do
            if aws ecr describe-images \
              --repository-name smoke-test \
              --image-ids imageTag=$IMAGE_TAG \
              --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
              echo "Image is available in ECR"
              exit 0
            fi

            echo "Image not available yet ($i/30), waiting 10s..."
            sleep 10
          done

          echo "::error::Image not found in ECR after 5 minutes: $PR_IMAGE"
          exit 1

      - name: Deploy to EKS
        run: |
          cat <<EOF | kubectl apply -n $NAMESPACE -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ env.DEPLOYMENT_NAME }}
            labels:
              app: ${{ env.DEPLOYMENT_NAME }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ${{ env.DEPLOYMENT_NAME }}
            template:
              metadata:
                labels:
                  app: ${{ env.DEPLOYMENT_NAME }}
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  fsGroup: 65532
                  fsGroupChangePolicy: OnRootMismatch
                containers:
                  - name: fern-docs
                    image: $PR_IMAGE
                    imagePullPolicy: Always
                    ports:
                      - name: docs
                        containerPort: 3000
                        protocol: TCP
                      - name: health
                        containerPort: 8081
                        protocol: TCP
                    env:
                      - name: WARMUP
                        value: "false"
                      - name: FERN_LOG_LEVEL
                        value: "info"
                      - name: TMPDIR
                        value: /tmp
                    resources:
                      requests:
                        memory: "3Gi"
                        cpu: "1000m"
                      limits:
                        memory: "6Gi"
                        cpu: "2000m"
                    livenessProbe:
                      httpGet:
                        path: /liveness
                        port: 8081
                      initialDelaySeconds: 120
                      periodSeconds: 10
                      timeoutSeconds: 15
                      failureThreshold: 3
                    readinessProbe:
                      httpGet:
                        path: /readiness
                        port: 8081
                      initialDelaySeconds: 60
                      periodSeconds: 10
                      timeoutSeconds: 15
                      failureThreshold: 6
                    securityContext:
                      allowPrivilegeEscalation: false
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      privileged: false
                      readOnlyRootFilesystem: false
                      capabilities:
                        drop:
                          - ALL
                terminationGracePeriodSeconds: 30
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${{ env.DEPLOYMENT_NAME }}
            labels:
              app: ${{ env.DEPLOYMENT_NAME }}
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          spec:
            type: LoadBalancer
            ports:
              - name: http
                port: 80
                targetPort: 3000
                protocol: TCP
            selector:
              app: ${{ env.DEPLOYMENT_NAME }}
          EOF

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for deployment to roll out..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n $NAMESPACE \
            --timeout=300s

      - name: Run health checks
        run: |
          echo "Running health checks..."

          POD_NAME=$(kubectl get pods -n $NAMESPACE \
            -l app=${{ env.DEPLOYMENT_NAME }} \
            -o jsonpath='{.items[0].metadata.name}')

          echo "Pod name: $POD_NAME"

          echo "Testing liveness endpoint..."
          for i in {1..5}; do
            if kubectl exec -n $NAMESPACE $POD_NAME -- \
              curl -sf http://localhost:8081/liveness 2>/dev/null; then
              echo "Liveness check passed"
              break
            fi
            echo "Liveness check attempt $i/5 failed, retrying in 10s..."
            sleep 10
            if [ "$i" = "5" ]; then
              echo "ERROR: Liveness check failed after 5 attempts"
              exit 1
            fi
          done

          echo "Testing readiness endpoint..."
          for i in {1..5}; do
            if kubectl exec -n $NAMESPACE $POD_NAME -- \
              curl -sf http://localhost:8081/readiness 2>/dev/null; then
              echo "Readiness check passed"
              break
            fi
            echo "Readiness check attempt $i/5 failed, retrying in 10s..."
            sleep 10
            if [ "$i" = "5" ]; then
              echo "ERROR: Readiness check failed after 5 attempts"
              exit 1
            fi
          done

          echo "All health checks passed!"

      - name: Wait for LoadBalancer URL
        id: loadbalancer
        run: |
          echo "Waiting for LoadBalancer to be provisioned..."

          for i in {1..30}; do
            LB_HOSTNAME=$(kubectl get service ${{ env.DEPLOYMENT_NAME }} -n $NAMESPACE \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")

            if [ -n "$LB_HOSTNAME" ]; then
              PREVIEW_URL="http://${LB_HOSTNAME}"
              echo "LoadBalancer URL: $PREVIEW_URL"
              echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
              break
            fi

            echo "Waiting for LoadBalancer hostname... ($i/30)"
            sleep 10
          done

          if [ -z "$LB_HOSTNAME" ]; then
            echo "WARNING: LoadBalancer hostname not available yet. Checking service status..."
            kubectl describe service ${{ env.DEPLOYMENT_NAME }} -n $NAMESPACE || true
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.loadbalancer.outputs.preview_url }}';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const namespace = process.env.NAMESPACE;
            const imageTag = process.env.IMAGE_TAG;
            const prSha = process.env.PR_SHA;

            let body;
            if (previewUrl) {
              body = `## Self-Hosted PR Preview Deployed\n\n**Preview URL:** ${previewUrl}\n\n**Namespace:** \`${namespace}\`\n\n**Image tag:** \`${imageTag}\`\n\n**Commit:** \`${prSha}\`\n\n**Note:** This preview will be automatically destroyed when the PR is closed or merged.`;
            } else {
              body = `## Self-Hosted PR Preview Deployed\n\n**Warning:** LoadBalancer URL not available yet. The deployment may still be accessible via kubectl port-forward.\n\n**Namespace:** \`${namespace}\`\n\n**Image tag:** \`${imageTag}\`\n\n**Commit:** \`${prSha}\`\n\n**Note:** This preview will be automatically destroyed when the PR is closed or merged.`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Self-Hosted PR Preview Deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Get deployment info
        if: always()
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n $NAMESPACE -o wide || true

          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n $NAMESPACE -l app=${{ env.DEPLOYMENT_NAME }} -o wide || true

          echo ""
          echo "=== Service Status ==="
          kubectl get service ${{ env.DEPLOYMENT_NAME }} -n $NAMESPACE -o wide || true
