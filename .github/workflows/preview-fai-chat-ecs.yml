name: Preview FAI Chat ECS

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

jobs:
  check_label:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      should_cleanup: ${{ steps.check.outputs.should_cleanup }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event.action }}" == "closed" ]]; then
            # Check if the label was present before closing
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'deployFaiChat') }}" == "true" ]]; then
              echo "should_cleanup=true" >> $GITHUB_OUTPUT
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            else
              echo "should_cleanup=false" >> $GITHUB_OUTPUT
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event.action }}" == "unlabeled" && "${{ github.event.label.name }}" == "deployFaiChat" ]]; then
            echo "should_cleanup=true" >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'deployFaiChat') }}" == "true" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "should_cleanup=false" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "should_cleanup=false" >> $GITHUB_OUTPUT
          fi

  preview_deploy:
    needs: check_label
    if: needs.check_label.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: Fern Dev
    env:
      APPLICATION_ENVIRONMENT: dev
      PREVIEW: "true"
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 📦 Compile CDK
        run: |
          cd servers/fai-chat-deploy
          pnpm install
          pnpm compile

      - name: 🚀 Deploy Preview Stack
        id: deploy
        run: |
          git_version="$(scripts/git-version.sh)"
          npm install -g aws-cdk
          cd servers/fai-chat-deploy
          VERSION="${git_version}" PR_NUMBER="${{ github.event.pull_request.number }}" PREVIEW=true pnpm deploy:preview

          # Extract the preview URL from CDK output
          if [ -f preview-output.json ]; then
            PREVIEW_URL=$(jq -r '.["fai-chat-preview-${{ github.event.pull_request.number }}"].PreviewUrl // .["fai-chat-preview-${{ github.event.pull_request.number }}"].LoadBalancerDns' preview-output.json)
            if [[ "$PREVIEW_URL" != "https://"* ]]; then
              PREVIEW_URL="https://${PREVIEW_URL}"
            fi
            echo "PREVIEW_URL=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Test Preview Service
        run: |
          PREVIEW_URL="${{ steps.deploy.outputs.PREVIEW_URL }}"
          echo "Testing ECS service at: ${PREVIEW_URL}"

          # Wait for ECS service to be ready (longer than Lambda)
          echo "Waiting for service to be ready..."
          sleep 60

          # Test health endpoint with retries
          for i in {1..5}; do
            echo "Attempt $i: Testing health endpoint..."
            if curl -f -s "${PREVIEW_URL}/health" --max-time 30; then
              echo "Health check passed!"
              break
            fi
            echo "Retrying in 20 seconds..."
            sleep 20
          done

          # Test readiness endpoint
          echo "Testing readiness endpoint..."
          curl -f -s "${PREVIEW_URL}/health/ready" --max-time 30 || echo "Readiness endpoint test completed"

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.deploy.outputs.PREVIEW_URL }}';
            const prNumber = context.issue.number;

            const body = `## 🚀 FAI Chat ECS Preview Deployed

            Your ECS Fargate service has been deployed to a preview environment!

            **🔗 Preview URL:** ${previewUrl}

            **📝 Available Endpoints:**
            - Health (liveness): \`GET ${previewUrl}/health\`
            - Ready (readiness): \`GET ${previewUrl}/health/ready\`
            - Chat (streaming): \`POST ${previewUrl}/chat\`

            **📋 Example Usage:**
            \`\`\`bash
            # Test health endpoint
            curl "${previewUrl}/health"

            # Test readiness endpoint
            curl "${previewUrl}/health/ready"
            \`\`\`

            **🏷️ Stack Name:** \`fai-chat-preview-${prNumber}\`

            **⚙️ Resources:**
            - CPU: 512 units (0.5 vCPU)
            - Memory: 1024 MB

            **ℹ️ Note:** This preview will be automatically destroyed when the PR is closed or the \`deployFaiChat\` label is removed.`;

            // Find existing preview comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 FAI Chat ECS Preview Deployed')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  cleanup_preview:
    needs: check_label
    if: needs.check_label.outputs.should_cleanup == 'true'
    runs-on: ubuntu-latest
    environment: Fern Dev
    env:
      APPLICATION_ENVIRONMENT: dev
      PREVIEW: "true"
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 📦 Compile CDK
        run: |
          cd servers/fai-chat-deploy
          pnpm install
          pnpm compile

      - name: 🗑️ Destroy Preview Stack
        run: |
          git_version="$(scripts/git-version.sh)"
          npm install -g aws-cdk
          cd servers/fai-chat-deploy
          VERSION="${git_version}" PR_NUMBER="${{ github.event.pull_request.number }}" PREVIEW=true pnpm destroy:preview || echo "Stack may already be destroyed"

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🗑️ Preview Environment Cleaned Up\n\nThe ECS preview stack \`fai-chat-preview-${prNumber}\` has been destroyed.`
            });
