name: Deploy FDR

on:
  push:
    tags: ["*"]

env:
  PACKAGE_NAME: "@fern-platform/fdr"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.SMOKE_TEST_FERN_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  FERNIE_SLACK_APP_TOKEN: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.FERN_NPM_TOKEN }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  CLI_PERMISSION_CHECK_ORG_IDS: ${{ secrets.CLI_PERMISSION_CHECK_ORG_IDS }}
  AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  KV_REST_API_URL: ${{ secrets.MWARE_KV_REST_API_URL }}
  KV_REST_API_TOKEN: ${{ secrets.MWARE_KV_REST_API_TOKEN }}
  PDF_EXPORT_JWT_SECRET_KEY: ${{ secrets.PDF_EXPORT_JWT_SECRET_KEY }}
  PDF_EXPORT_FERN_TOKEN: ${{ secrets.VERCEL_DOCS_FERN_TOKEN }}

jobs:
  sdk:
    if: github.ref_type == 'tag' && github.event_name == 'push'  && startsWith(github.ref, 'refs/tags/fdr@')
    uses: ./.github/workflows/publish-fdr-sdk.yml
    secrets: inherit

  deploy_prod:
    strategy:
      matrix:
        concurrency: [1]
    runs-on: seed
    if: github.ref_type == 'tag' && github.event_name == 'push'  && startsWith(github.ref, 'refs/tags/fdr@')
    environment: Fern Prod
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}/fdr?schema=public&connection_limit=6&pool_timeout=30
      APPLICATION_ENVIRONMENT: prod
    steps:
      - uses: actions/checkout@v4
      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 🧪 Build and test
        run: pnpm turbo build test --filter=${{ env.PACKAGE_NAME }}

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Currently we migrate in the Docker container
      # - name: 🔄 DB Migration
      #   run: pnpm run --filter=@fern-platform/fdr db:migrate:prod
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}/fdr?schema=public

      - name: 🚀 cdk deploy
        run: |
          git_version="$(scripts/git-version.sh)"
          pnpm run --filter=@fern-platform/fdr docker:prod "${git_version}"
          pnpm --filter=@fern-platform/mdx-bundler build:tsup:cjs
          pnpm --filter=@fern-platform/mdx-bundler docker "${git_version}"
          pnpm --filter=@fern-api/docs-pdf compile
          pnpm --filter=@fern-platform/docs-pdf-exporter-lambda build
          npm install -g aws-cdk
          cd servers/fdr-deploy
          VERSION="${git_version}" pnpm --filter=@fern-platform/fdr-deploy deploy:prod

  smoke-test:
    needs: deploy_prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke Test Dev Docs
        env:
          NPM_TOKEN: ${{ secrets.FERN_NPM_TOKEN }}
          FERN_TOKEN: ${{ secrets.SMOKE_TEST_FERN_TOKEN }}
        run: |
          cd smoke-test
          npm install -g fern-api
          fern generate --docs --instance https://fern-platform-test.docs.buildwithfern.com --log-level debug
          VALUE=$(curl https://fern-platform-test.docs.buildwithfern.com/api-reference/imdb/create-movie)
          length=${#VALUE}
          # Assert that length is over 1000
          if [ $length -gt 1000 ]; then
              echo "Length is greater than 1000"
          else
              exit 1
          fi

  notify:
    needs: deploy_prod
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/fdr@')
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "FDR Deploy ${{ needs.deploy_prod.result }}: ${{ github.ref_name }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
