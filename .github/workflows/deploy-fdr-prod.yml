name: Deploy FDR

on:
  push:
    tags: ["*"]

env:
  PACKAGE_NAME: "@fern-platform/fdr"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.SMOKE_TEST_FERN_TOKEN }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  FERNIE_SLACK_APP_TOKEN: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  CLI_PERMISSION_CHECK_ORG_IDS: ${{ secrets.CLI_PERMISSION_CHECK_ORG_IDS }}
  AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  KV_REST_API_URL: ${{ secrets.MWARE_KV_REST_API_URL }}
  KV_REST_API_TOKEN: ${{ secrets.MWARE_KV_REST_API_TOKEN }}
  PDF_EXPORT_JWT_SECRET_KEY: ${{ secrets.PDF_EXPORT_JWT_SECRET_KEY }}
  PDF_EXPORT_FERN_TOKEN: ${{ secrets.VERCEL_DOCS_FERN_TOKEN }}

jobs:
  deploy_prod:
    strategy:
      matrix:
        concurrency: [1]
    runs-on: seed
    permissions:
      id-token: write
      contents: read
    if: github.ref_type == 'tag' && github.event_name == 'push'  && startsWith(github.ref, 'refs/tags/fdr@')
    environment: Fern Prod
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}/fdr?schema=public&connection_limit=6&pool_timeout=30
      APPLICATION_ENVIRONMENT: prod
    steps:
      - uses: actions/checkout@v4
      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 🧪 Build and test
        run: pnpm turbo build test --filter=${{ env.PACKAGE_NAME }}

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1

      # Currently we migrate in the Docker container
      # - name: 🔄 DB Migration
      #   run: pnpm run --filter=@fern-platform/fdr db:migrate:prod
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}/fdr?schema=public

      - name: 🚀 cdk deploy
        id: cdk-deploy
        run: |
          git_version="$(scripts/git-version.sh)"
          pnpm run --filter=@fern-platform/fdr docker:prod "${git_version}"
          pnpm --filter=@fern-api/docs-pdf compile
          pnpm --filter=@fern-platform/docs-pdf-exporter build
          npm install -g aws-cdk
          cd servers/fdr-deploy
          VERSION="${git_version}" pnpm --filter=@fern-platform/fdr-deploy deploy:prod
        env:
          # Runtime credentials passed to the Fargate task environment (not used for CI auth)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Clear the OIDC session token so the AWS SDK uses the static credentials above
          AWS_SESSION_TOKEN: ""
          FDR_CRON_SECRET: ${{ secrets.FDR_CRON_SECRET }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: 🔍 Dump CloudFormation failure details
        if: failure() && steps.cdk-deploy.outcome == 'failure'
        run: |
          STACK_NAME="fdr-prod"
          CHANGESET_NAME="cdk-deploy-change-set"

          echo "=== ChangeSet status and reason ==="
          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME" \
            --region us-east-1 \
            --query '{Status:Status,StatusReason:StatusReason,ExecutionStatus:ExecutionStatus}' \
            --output json \
          || true

          echo ""
          echo "=== EarlyValidation failure details (describe-events) ==="
          aws cloudformation describe-events \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGESET_NAME" \
            --output json \
          || true

          echo ""
          echo "=== Last 30 CloudFormation stack events ==="
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region us-east-1 \
            --max-items 30 \
            --query 'StackEvents[].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
            --output table \
          || true

  notify:
    needs: deploy_prod
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/fdr@')
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "FDR Deploy ${{ needs.deploy_prod.result }}: ${{ github.ref_name }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
