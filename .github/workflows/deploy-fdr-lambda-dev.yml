name: Deploy FDR Lambda Dev

on:
  workflow_dispatch:
  push:
    branches:
      - app
    paths:
      - "servers/fdr-lambda/**"
      - "servers/fdr-lambda-deploy/**"
      - ".github/workflows/deploy-fdr-lambda-dev.yml"

env:
  PACKAGE_NAME: "@fern-platform/fdr-lambda"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  GITHUB_TOKEN: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}
  DATABASE_URL: ${{ secrets.DEV2_RDS_PROXY_URL }}
  VENUS_URL: ${{ secrets.DEV2_VENUS_URL }}
  PUBLIC_DOCS_CDN_URL: ${{ secrets.DEV2_PUBLIC_DOCS_CDN_URL }}
  PUBLIC_DOCS_S3_BUCKET_NAME: ${{ secrets.DEV2_PUBLIC_DOCS_S3_BUCKET_NAME }}
  PUBLIC_DOCS_S3_BUCKET_REGION: ${{ secrets.DEV2_PUBLIC_DOCS_S3_BUCKET_REGION }}
  PRIVATE_DOCS_S3_BUCKET_NAME: ${{ secrets.DEV2_PRIVATE_DOCS_S3_BUCKET_NAME }}
  PRIVATE_DOCS_S3_BUCKET_REGION: ${{ secrets.DEV2_PRIVATE_DOCS_S3_BUCKET_REGION }}
  DB_DOCS_DEFINITION_BUCKET_NAME: ${{ secrets.DEV2_DB_DOCS_DEFINITION_BUCKET_NAME }}
  DB_DOCS_DEFINITION_BUCKET_REGION: ${{ secrets.DEV2_DB_DOCS_DEFINITION_BUCKET_REGION }}
  JWT_SECRET_KEY: ${{ secrets.DEV_JWT_SECRET_KEY }}

jobs:
  deploy_dev:
    runs-on: Seed
    permissions:
      id-token: write
      contents: read
    environment: Fern Dev
    strategy:
      matrix:
        concurrency: [1]
    env:
      APPLICATION_ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 🔎 Has changed
        id: has-changed
        # if there are changes, npx turbo-ignore returns a failure exit code
        # which makes steps.has-changed.outputs.RESULT = 'true'
        run: npx turbo-ignore ${{ env.PACKAGE_NAME }} || echo "RESULT=true" >> $GITHUB_OUTPUT

      - name: 🧪 Build
        run: |
          pnpm turbo build --filter=${{ env.PACKAGE_NAME }}

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1

      - name: 🚀 cdk deploy
        run: |
          git_version="$(scripts/git-version.sh)"
          npm install -g aws-cdk
          cd servers/fdr-lambda-deploy
          VERSION="${git_version}" pnpm --filter=@fern-platform/fdr-lambda-deploy deploy:dev
