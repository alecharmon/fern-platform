name: Docs Bundle Smoke Test

on:
  push:
    branches:
      - app
  pull_request:
    paths:
      - ".github/workflows/docs-bundle-smoke-test.yml"
      - "smoke-test/playwright/rsc-payload.spec.ts"
      - "packages/fern-docs/bundle/**"
      - "smoke-test/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"

jobs:
  build:
    runs-on: Seed
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Compile packages
        run: pnpm compile

      - name: Cache docs bundle build
        uses: actions/cache@v5
        with:
          path: |
            packages/fern-docs/bundle/.next/cache
          key: ${{ runner.os }}-nextjs-bundle-smoke-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/fern-docs/bundle/**/*.ts', 'packages/fern-docs/bundle/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-bundle-smoke-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-bundle-smoke-

      - name: Build local docs bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm docs:local-bundle:build

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-bundle
          path: docs_bundle.tar.gz
          retention-days: 1

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.27.0
          standalone: true
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Go for protoc-gen-openapi
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Download bundle artifact
        uses: actions/download-artifact@v7
        with:
          name: docs-bundle

      - name: Deploy bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf ~/.fern/app-preview-local
          mkdir -p ~/.fern/app-preview-local/.next
          tar -xzf docs_bundle.tar.gz -C ~/.fern/app-preview-local/.next

      - name: Install esbuild and run install-esbuild.js
        if: runner.os != 'Windows'
        run: |
          cd ~/.fern/app-preview-local/.next
          echo "=== Installing esbuild for current platform ==="
          pnpm install esbuild@0.27.3
          echo "=== Running install-esbuild.js ==="
          node install-esbuild.js
          echo "=== install-esbuild.js completed ==="

      # TODO: re-enable Windows bundle deploy once Windows smoke test is enabled
      # - name: Deploy bundle (Windows)
      #   if: runner.os == 'Windows'
      #   shell: bash
      #   run: |
      #     BUNDLE_DIR="$HOME/.fern/app-preview-local"
      #     rm -rf "$BUNDLE_DIR"
      #     mkdir -p "$BUNDLE_DIR/.next"
      #     # Windows cannot create Unix symlinks from tar; ignore symlink errors
      #     tar -xzf docs_bundle.tar.gz -C "$BUNDLE_DIR/.next" || echo "Warning: tar had errors (expected symlink issues on Windows)"

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          (
            npm install -g fern-api
            echo "Fern CLI installed"
          ) &
          FERN_PID=$!

          (
            cd smoke-test/playwright && npm install && npx playwright install chromium
            echo "Playwright installed"
          ) &
          PW_PID=$!

          (
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
            BUF_VERSION=1.35.1
            curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64.tar.gz" | sudo tar -xzC /usr/local --strip-components=1
            go install github.com/fern-api/protoc-gen-openapi/cmd/protoc-gen-openapi@v0.1.12
            echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
            echo "Proto toolchain installed"
          ) &
          PROTO_PID=$!

          wait $FERN_PID
          wait $PW_PID
          wait $PROTO_PID

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          (
            npm install -g fern-api
            echo "Fern CLI installed"
          ) &
          FERN_PID=$!

          (
            cd smoke-test/playwright && npm install && npx playwright install chromium
            echo "Playwright installed"
          ) &
          PW_PID=$!

          (
            brew install protobuf buf
            go install github.com/fern-api/protoc-gen-openapi/cmd/protoc-gen-openapi@v0.1.12
            echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
            echo "Proto toolchain installed"
          ) &
          PROTO_PID=$!

          wait $FERN_PID
          wait $PW_PID
          wait $PROTO_PID

      # TODO: re-enable Windows tools install once Windows smoke test is enabled
      # - name: Install tools (Windows)
      #   if: runner.os == 'Windows'
      #   shell: bash
      #   run: |
      #     npm install -g fern-api
      #     cd smoke-test/playwright && npm install && npx playwright install chromium
      #     cd $GITHUB_WORKSPACE
      #     choco install protoc -y
      #     # Install buf manually on Windows (not available via chocolatey)
      #     BUF_VERSION=1.35.1
      #     TOOLS_DIR="$RUNNER_TEMP/tools"
      #     mkdir -p "$TOOLS_DIR"
      #     curl -sSL -o "$TOOLS_DIR/buf.exe" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Windows-x86_64.exe"
      #     echo "$TOOLS_DIR" >> $GITHUB_PATH
      #     go install github.com/fern-api/protoc-gen-openapi/cmd/protoc-gen-openapi@v0.1.12
      #     echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Start fern docs dev server (Unix)
        if: runner.os != 'Windows'
        env:
          FERN_TOKEN: ${{ secrets.FERN_SMOKE_TEST_API_KEY }}
        run: |
          cd smoke-test/fern
          fern docs dev --bundle-path ~/.fern/app-preview-local/.next > /tmp/fern-docs-dev.log 2>&1 &
          FERN_PID=$!
          echo "FERN_PID=$FERN_PID" >> $GITHUB_ENV

          echo "Waiting for fern docs dev server to start (PID: $FERN_PID)..."
          for i in $(seq 1 120); do
            if grep -q "Docs preview server ready" /tmp/fern-docs-dev.log 2>/dev/null; then
              echo "Server is ready after ${i}s!"
              echo "--- Dev server logs ---"
              cat /tmp/fern-docs-dev.log
              echo "--- End dev server logs ---"
              break
            fi

            if ! kill -0 $FERN_PID 2>/dev/null; then
              echo "fern docs dev process (PID: $FERN_PID) exited unexpectedly"
              echo "--- Dev server logs ---"
              cat /tmp/fern-docs-dev.log
              echo "--- End dev server logs ---"
              exit 1
            fi

            if [ $i -eq 120 ]; then
              echo "Timeout waiting for server to start after 120s"
              echo "--- Dev server logs ---"
              cat /tmp/fern-docs-dev.log
              echo "--- End dev server logs ---"
              exit 1
            fi

            if [ $((i % 10)) -eq 0 ]; then
              echo "--- Dev server logs at attempt $i ---"
              tail -20 /tmp/fern-docs-dev.log
              echo "--- End dev server logs ---"
            fi

            sleep 1
          done

      # TODO: re-enable Windows server start once Windows smoke test is enabled
      # - name: Start fern docs dev server (Windows)
      #   if: runner.os == 'Windows'
      #   shell: bash
      #   env:
      #     FERN_TOKEN: ${{ secrets.FERN_SMOKE_TEST_API_KEY }}
      #   run: |
      #     cd smoke-test/fern
      #     fern docs dev --bundle-path "$HOME/.fern/app-preview-local/.next" > /tmp/fern-docs-dev.log 2>&1 &
      #     FERN_PID=$!
      #     echo "FERN_PID=$FERN_PID" >> $GITHUB_ENV
      #     echo "Waiting for fern docs dev server to start (PID: $FERN_PID)..."
      #     for i in $(seq 1 120); do
      #       if grep -q "Docs preview server ready" /tmp/fern-docs-dev.log 2>/dev/null; then
      #         echo "Server is ready after ${i}s!"
      #         cat /tmp/fern-docs-dev.log
      #         break
      #       fi
      #       if ! kill -0 $FERN_PID 2>/dev/null; then
      #         echo "fern docs dev process exited unexpectedly"
      #         cat /tmp/fern-docs-dev.log
      #         exit 1
      #       fi
      #       if [ $i -eq 120 ]; then
      #         echo "Timeout waiting for server to start after 120s"
      #         cat /tmp/fern-docs-dev.log
      #         exit 1
      #       fi
      #       if [ $((i % 10)) -eq 0 ]; then
      #         tail -20 /tmp/fern-docs-dev.log
      #       fi
      #       sleep 1
      #     done

      # ── RSC Payload Baseline (restore before tests, Linux only) ──
      - name: Restore RSC payload baseline from cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/rsc-payload-baseline.json
          key: rsc-payload-baseline-never-match
          restore-keys: |
            rsc-payload-baseline-

      - name: Run Playwright smoke tests (non-Linux)
        if: runner.os != 'Linux'
        working-directory: smoke-test/playwright
        run: npx playwright test smoke.spec.ts --config playwright.config.ts

      - name: Run Playwright smoke tests + RSC payload analysis (Linux, parallel)
        if: runner.os == 'Linux'
        working-directory: smoke-test/playwright
        env:
          RSC_BASELINE_PATH: /tmp/rsc-payload-baseline.json
        run: |
          PLAYWRIGHT_HTML_REPORT=playwright-report/smoke npx playwright test smoke.spec.ts --config playwright.config.ts &
          SMOKE_PID=$!
          PLAYWRIGHT_HTML_REPORT=playwright-report/rsc npx playwright test rsc-payload.spec.ts --config playwright.config.ts --timeout 300000 &
          RSC_PID=$!
          FAIL=0
          wait $SMOKE_PID || FAIL=1
          wait $RSC_PID || FAIL=1
          exit $FAIL

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-test-playwright-report-${{ matrix.os }}
          path: smoke-test/playwright/playwright-report/
          retention-days: 7

      - name: Post RSC payload report to step summary
        if: runner.os == 'Linux' && always()
        run: |
          if [ -f smoke-test/rsc-payload-summary.md ]; then
            cat smoke-test/rsc-payload-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post RSC payload report as PR comment (only if warnings exist)
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rsc-payload-report -->';
            const reportPath = 'smoke-test/rsc-payload-summary.md';
            const flagPath = 'smoke-test/rsc-payload-has-warnings';

            const hasWarnings = fs.existsSync(flagPath) && fs.readFileSync(flagPath, 'utf-8').trim() === 'true';
            const hasReport = fs.existsSync(reportPath);

            // Find any existing RSC report comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (!hasWarnings) {
              // All pages are clean — remove stale comment if one exists
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
                console.log(`Deleted stale RSC report comment #${existing.id} (no warnings)`);
              } else {
                console.log('No warnings and no existing comment — nothing to do');
              }
              return;
            }

            if (!hasReport) {
              console.log('Warnings flagged but no report file found — skipping');
              return;
            }

            const body = fs.readFileSync(reportPath, 'utf-8');
            const fullBody = `${marker}\n${body}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
              console.log(`Updated existing RSC report comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
              console.log('Created new RSC report comment');
            }

      - name: Upload RSC payload results
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: rsc-payload-results
          path: |
            smoke-test/rsc-payload-results.json
            smoke-test/rsc-payload-summary.md
          retention-days: 30

      - name: Save RSC payload baseline
        if: runner.os == 'Linux' && github.ref == 'refs/heads/app'
        run: |
          if [ -f smoke-test/rsc-payload-results.json ]; then
            cp smoke-test/rsc-payload-results.json /tmp/rsc-payload-baseline.json
          fi

      - name: Cache RSC payload baseline
        if: runner.os == 'Linux' && github.ref == 'refs/heads/app'
        uses: actions/cache/save@v4
        with:
          path: /tmp/rsc-payload-baseline.json
          key: rsc-payload-baseline-${{ github.sha }}

      - name: Print fern docs dev logs
        if: always()
        shell: bash
        run: cat /tmp/fern-docs-dev.log || true

      - name: Stop fern docs dev server
        if: always()
        shell: bash
        run: |
          if [ -n "$FERN_PID" ]; then
            kill $FERN_PID 2>/dev/null || true
          fi

  notify:
    name: Notify on failure
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    if: failure() && github.event_name != 'pull_request'
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "*Docs Bundle Smoke Test Failed* :warning:\n\nWorkflow: `${{ github.workflow }}`\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
