name: Deploy FAI

on:
  workflow_dispatch:
  push:
    tags:
      - "fai@*" 

jobs:
  deploy-prod:
    if: contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: Fern Prod
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
      POSTGRES_DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
      ASK_FERN_SLACK_CLIENT_ID: ${{ secrets.ASK_FERN_SLACK_CLIENT_ID }}
      ASK_FERN_SLACK_CLIENT_SECRET: ${{ secrets.ASK_FERN_SLACK_CLIENT_SECRET }}
      ASK_FERN_SLACK_SIGNING_SECRET: ${{ secrets.ASK_FERN_SLACK_SIGNING_SECRET }}
      SCRIBE_SLACK_CLIENT_ID: ${{ secrets.SCRIBE_SLACK_CLIENT_ID }}
      SCRIBE_SLACK_CLIENT_SECRET: ${{ secrets.SCRIBE_SLACK_CLIENT_SECRET }}
      SCRIBE_SLACK_SIGNING_SECRET: ${{ secrets.SCRIBE_SLACK_SIGNING_SECRET }}
      SCRIBE_DEVIN_API_KEY: ${{ secrets.SCRIBE_DEVIN_API_KEY }}
      SCRIBE_SLACK_BOT_TOKEN: ${{ secrets.SCRIBE_SLACK_BOT_TOKEN }}
      FERN_GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
      FERN_BOT_APP_ID: ${{ secrets.FERN_BOT_APP_ID }}
      FERN_BOT_PRIVATE_KEY: ${{ secrets.FERN_BOT_PRIVATE_KEY }}
      ASK_FERN_SLACK_BOT_TOKEN: ${{ secrets.ASK_FERN_SLACK_BOT_TOKEN }}
      FERNIE_SLACK_BOT_TOKEN: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
      FAI_LAMBDA_FUNCTION_NAME: ${{ secrets.FAI_LAMBDA_FUNCTION_NAME }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_OAUTH_URL: ${{ secrets.DISCORD_OAUTH_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      VENUS_URL: ${{ secrets.VENUS_URL }}
      FAI_REINDEXING_SQS_URL: ${{ secrets.FAI_REINDEXING_SQS_URL }}
      EDGE_CONFIG: ${{ secrets.EDGE_CONFIG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - name: Create .env file
        run: |
          cd servers/fai
          echo "TURBOPUFFER_API_KEY=${{ env.TURBOPUFFER_API_KEY }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ env.ANTHROPIC_API_KEY }}" >> .env
          echo "COHERE_API_KEY=${{ env.COHERE_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ env.OPENAI_API_KEY }}" >> .env
          echo "POSTGRES_DATABASE_URL=${{ env.POSTGRES_DATABASE_URL }}" >> .env
          echo "FERN_TOKEN=${{ env.FERN_TOKEN }}" >> .env
          echo "ASK_FERN_SLACK_CLIENT_ID=${{ env.ASK_FERN_SLACK_CLIENT_ID }}" >> .env
          echo "ASK_FERN_SLACK_CLIENT_SECRET=${{ env.ASK_FERN_SLACK_CLIENT_SECRET }}" >> .env
          echo "ASK_FERN_SLACK_SIGNING_SECRET=${{ env.ASK_FERN_SLACK_SIGNING_SECRET }}" >> .env
          echo "SCRIBE_SLACK_CLIENT_ID=${{ env.SCRIBE_SLACK_CLIENT_ID }}" >> .env
          echo "SCRIBE_SLACK_CLIENT_SECRET=${{ env.SCRIBE_SLACK_CLIENT_SECRET }}" >> .env
          echo "SCRIBE_SLACK_SIGNING_SECRET=${{ env.SCRIBE_SLACK_SIGNING_SECRET }}" >> .env
          echo "SCRIBE_DEVIN_API_KEY=${{ env.SCRIBE_DEVIN_API_KEY }}" >> .env
          echo "SCRIBE_SLACK_BOT_TOKEN=${{ env.SCRIBE_SLACK_BOT_TOKEN }}" >> .env
          echo "FERN_BOT_GITHUB_TOKEN=${{ env.FERN_BOT_GITHUB_TOKEN }}" >> .env
          echo "FERN_BOT_APP_ID=${{ env.FERN_BOT_APP_ID }}" >> .env
          echo "FERN_BOT_PRIVATE_KEY=${{ env.FERN_BOT_PRIVATE_KEY }}" >> .env
          echo "ASK_FERN_SLACK_BOT_TOKEN=${{ env.ASK_FERN_SLACK_BOT_TOKEN }}" >> .env
          echo "FERNIE_SLACK_BOT_TOKEN=${{ env.FERNIE_SLACK_BOT_TOKEN }}" >> .env
          echo "DISCORD_BOT_TOKEN=${{ env.DISCORD_BOT_TOKEN }}" >> .env
          echo "DISCORD_OAUTH_URL=${{ env.DISCORD_OAUTH_URL }}" >> .env
          echo "KV_REST_API_TOKEN=${{ env.KV_REST_API_TOKEN }}" >> .env
          echo "KV_REST_API_READ_ONLY_TOKEN=${{ env.KV_REST_API_READ_ONLY_TOKEN }}" >> .env
          echo "KV_REST_API_URL=${{ env.KV_REST_API_URL }}" >> .env
          echo "VENUS_URL=${{ env.VENUS_URL }}" >> .env
          echo "FAI_LAMBDA_FUNCTION_NAME=${{ env.FAI_LAMBDA_FUNCTION_NAME }}" >> .env
          echo "FAI_REINDEXING_SQS_URL=${{ env.FAI_REINDEXING_SQS_URL }}" >> .env
          echo "EDGE_CONFIG=${{ env.EDGE_CONFIG }}" >> .env
      - name: Deploy to prod
        run: |
          git_version="$(scripts/fai-version.sh)"
          cd servers/fai
          ./scripts/create_docker.sh "${git_version}"
          cd deploy
          pnpm install
          VERSION="${git_version}" npm run cdk deploy fai-prod --require-approval never --progress events
