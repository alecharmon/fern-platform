name: Deploy FAI Lambda Dev

on:
  push:
    branches:
      - app
    paths:
      - "servers/fai-lambda/**"
      - "servers/fai-lambda-deploy/**"
      - ".github/workflows/deploy-fai-lambda-dev.yml"
  pull_request:
    branches:
      - app
    paths:
      - "servers/fai-lambda/**"
      - "servers/fai-lambda-deploy/**"
      - ".github/workflows/deploy-fai-lambda-dev.yml"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  deploy_dev:
    runs-on: Seed
    environment: Fern Dev
    strategy:
      matrix:
        concurrency: [1]
    env:
      APPLICATION_ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 🚀 cdk deploy
        run: |
          git_version="$(scripts/git-version.sh)"
          npm install -g aws-cdk
          cd servers/fai-lambda-deploy
          VERSION="${git_version}" pnpm --filter=@fern-platform/fai-lambda-deploy deploy:dev
