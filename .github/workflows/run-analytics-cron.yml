name: Run Analytics Cron

on:
  schedule:
    # Run daily at 5:00 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/actions/install

      - name: Run analytics cron script
        env:
          # Docs KV credentials (for domain list - fast!)
          DOCS_KV_REST_API_URL: ${{ secrets.DOCS_KV_REST_API_URL }}
          DOCS_KV_REST_API_TOKEN: ${{ secrets.DOCS_KV_REST_API_TOKEN }}
          NEXT_PUBLIC_CDN_URI: ${{ secrets.NEXT_PUBLIC_CDN_URI }}
          # Supabase credentials (for storing analytics)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # PostHog Redshift credentials (for querying analytics)
          POSTHOG_REDSHIFT_DB_HOST: ${{ secrets.POSTHOG_REDSHIFT_DB_HOST }}
          POSTHOG_REDSHIFT_DB_NAME: ${{ secrets.POSTHOG_REDSHIFT_DB_NAME }}
          POSTHOG_REDSHIFT_DB_USER: ${{ secrets.POSTHOG_REDSHIFT_DB_USER }}
          POSTHOG_REDSHIFT_DB_PASSWORD: ${{ secrets.POSTHOG_REDSHIFT_DB_PASSWORD }}
          # FDR credentials (fallback only if KV unavailable)
          FDR_SERVER_URL: ${{ secrets.FDR_SERVER_URL }}
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          npx tsx packages/fern-dashboard/scripts/run-analytics-cron.ts
