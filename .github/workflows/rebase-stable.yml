name: 'Rebase stable from app'
on:
  schedule:
    - cron: '0 12 * * MON'
  workflow_dispatch:

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Rebase
        run: |
          git fetch origin app
          git rebase origin/app

      - name: Push
        env:
          GIT_AUTH_TOKEN: ${{ secrets.PR_BOT_GH_PAT }}
        run: git push --force-with-lease https://x-access-token:${GIT_AUTH_TOKEN}@github.com/fern-api/fern-platform stable
