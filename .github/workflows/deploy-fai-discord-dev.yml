name: Deploy FAI Discord Dev

on:
  push:
    branches:
      - app
    paths:
      - 'servers/fai/src/discord_bot/**'
      - 'servers/fai/Dockerfile.discord'
      - '.github/workflows/deploy-fai-discord-dev.yml'

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: Fern Dev
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
      POSTGRES_DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_OAUTH_URL: ${{ secrets.DISCORD_OAUTH_URL }}
      ORG_AI_CREDIT_CHECK_ORG_IDS: alecharmonspot
      DASHBOARD_API_URL: https://dashboard-dev.buildwithfern.com
      JWT_SECRET_KEY: ${{ secrets.DEV_JWT_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - name: Create .env.discord file
        run: |
          cd servers/fai
          echo "ANTHROPIC_API_KEY=${{ env.ANTHROPIC_API_KEY }}" >> .env.discord
          echo "OPENAI_API_KEY=${{ env.OPENAI_API_KEY }}" >> .env.discord
          echo "TURBOPUFFER_API_KEY=${{ env.TURBOPUFFER_API_KEY }}" >> .env.discord
          echo "POSTGRES_DATABASE_URL=${{ env.POSTGRES_DATABASE_URL }}" >> .env.discord
          echo "DISCORD_BOT_TOKEN=${{ env.DISCORD_BOT_TOKEN }}" >> .env.discord
          echo "DISCORD_OAUTH_URL=${{ env.DISCORD_OAUTH_URL }}" >> .env.discord
          echo "ORG_AI_CREDIT_CHECK_ORG_IDS=${{ env.ORG_AI_CREDIT_CHECK_ORG_IDS }}" >> .env.discord
          echo "DASHBOARD_API_URL=${{ env.DASHBOARD_API_URL }}" >> .env.discord
          echo "JWT_SECRET_KEY=${{ env.JWT_SECRET_KEY }}" >> .env.discord
      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1
      - name: Deploy to Dev
        run: |
          git_version="$(scripts/fai-discord-version.sh)"
          cd servers
          docker build -f fai/Dockerfile.discord -t fai:"${git_version}" .
          docker save fai:"${git_version}" -o fai:"${git_version}".tar
          cd fai/deploy
          pnpm install
          VERSION="${git_version}" npm run deploy:discord-dev
