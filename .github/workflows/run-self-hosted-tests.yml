name: Run self-hosted tests

on:
  push:
    branches:
      - app
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

jobs:
  run-self-hosted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # This helps turbo resolve changes faster

      - name: Update Engines
        run: |
          node -e 'const fs = require("fs"); const pkg = require("./package.json"); console.log("Before modification:", JSON.stringify(pkg.engines, null, 2)); pkg.engines.node = ">=20.0.0"; pkg.engines.pnpm = "9.15.9"; pkg.packageManager = "pnpm@9.15.9"; console.log("After modification:", JSON.stringify(pkg.engines, null, 2)); fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));'
             
      - name: Replace esbuild version
        run: |
          sed -i 's/"esbuild": "0\.25\.[0-9]\+"/"esbuild": "0.25.9"/g' pnpm-workspace.yaml
          echo "Updated esbuild version in pnpm-workspace.yaml"
          grep -A1 'esbuild' pnpm-workspace.yaml | head -n 3

      - name: Install
        uses: ./.github/actions/legacy-install

      - name: Compile and build
        run: pnpm turbo compile codegen build
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}

      - name: Build FDR CJS
        run: pnpm --filter @fern-platform/fdr build:tsup:cjs

      - name: Build docs bundle
        run: pnpm docs:self-hosted-bundle:build

      - name: Run self-hosted tests
        run: pnpm turbo build test:self-hosted --filter=@fern-platform/self-hosted
