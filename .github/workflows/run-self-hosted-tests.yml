name: Run self-hosted tests

on:
  push:
    branches:
      - app
    paths:
      - "servers/self-hosted/**"
      - ".github/workflows/run-self-hosted-tests.yml"
  pull_request:
    paths:
      - "servers/self-hosted/**"
      - ".github/workflows/run-self-hosted-tests.yml"
  workflow_call:
    inputs:
      upload_artifact:
        description: "Whether to upload the JS bundle artifact for downstream jobs"
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

jobs:
  # Combined job: build + self-hosted tests + K8s tests
  # This eliminates Docker image save/upload/download overhead
  test:
    runs-on: Seed
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # START BACKGROUND TASKS (run in parallel with build steps)
      # ============================================================
      - name: Start background setup tasks
        env:
          DOCKERHUB_USERNAME: fernapi
          DOCKERHUB_PASSWORD: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}
        run: |
          # Create a directory to store task status
          mkdir -p /tmp/bg-tasks
          
          # Start Docker Hub login + base image pull in background (pull must wait for login)
          echo "Starting Docker Hub login + base image pull in background..."
          (
            echo "Logging into Docker Hub..."
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            echo "Docker Hub login completed, pulling base image..."
            docker pull docker.io/fernapi/fern-self-hosted-base:latest
            echo "Base image pull completed!"
            # Write success marker
            echo "success" > /tmp/bg-tasks/docker-setup.done
          ) > /tmp/bg-tasks/docker-setup.log 2>&1 &
          
          # Start KIND cluster setup in background (download, install, create cluster, install Calico)
          echo "Starting KIND cluster setup in background..."
          (
            # Download kind
            curl -Lo /tmp/bg-tasks/kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
            chmod +x /tmp/bg-tasks/kind
            sudo mv /tmp/bg-tasks/kind /usr/local/bin/kind
            
            # Create KIND cluster with default CNI disabled for Calico
            cat <<EOF | kind create cluster --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: 192.168.0.0/16
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 30080
              hostPort: 30080
              protocol: TCP
          EOF
            
            # Install Calico for NetworkPolicy support
            echo "Installing Calico CNI..."
            kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml
            
            # Wait for Calico pods to be created
            echo "Waiting for Calico pods to be created..."
            for i in {1..30}; do
              POD_COUNT=$(kubectl get pods -n kube-system -l k8s-app=calico-node --no-headers 2>/dev/null | wc -l)
              if [ "$POD_COUNT" -gt 0 ]; then
                echo "Calico pods found ($POD_COUNT pods)"
                break
              fi
              echo "Waiting for Calico pods to be scheduled... ($i/30)"
              sleep 5
            done
            
            # Wait for Calico to be ready
            echo "Waiting for Calico to be ready..."
            kubectl wait --for=condition=ready pod -l k8s-app=calico-node -n kube-system --timeout=180s
            echo "KIND cluster with Calico is ready!"
            # Write success marker
            echo "success" > /tmp/bg-tasks/kind-setup.done
          ) > /tmp/bg-tasks/kind-setup.log 2>&1 &
          
          echo "All background tasks started!"

      # ============================================================
      # BUILD PHASE
      # ============================================================
      - name: Update Engines
        run: |
          node -e 'const fs = require("fs"); const pkg = require("./package.json"); pkg.engines.node = ">=20.0.0"; pkg.engines.pnpm = "10.27.0"; pkg.packageManager = "pnpm@10.27.0"; fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));'

      - name: Install
        uses: ./.github/actions/install

      - name: Cache Turbo build
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-self-hosted-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-self-hosted-

      - name: Compile and build
        run: pnpm turbo compile codegen build
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}

      - name: Build FDR CJS
        run: pnpm --filter @fern-platform/fdr build:tsup:cjs

      - name: Cache docs bundle build
        uses: actions/cache@v4
        with:
          path: |
            packages/fern-docs/bundle/.next/cache
          key: ${{ runner.os }}-nextjs-bundle-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/fern-docs/bundle/**/*.ts', 'packages/fern-docs/bundle/**/*.tsx', 'packages/fern-docs/bundle/**/*.js', 'packages/fern-docs/bundle/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-bundle-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-bundle-

      - name: Build docs bundle
        run: pnpm docs:self-hosted-bundle:build

      - name: Upload JS bundle artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-bundle
          path: |
            docs_bundle.tar.gz
            servers/fdr/cjs
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base Docker image
        run: |
          cd servers/self-hosted
          pnpm docker:build
        env:
          DOCKER_BUILDKIT: 1

      - name: Build test Docker images in parallel
        run: |
          echo "Building all test Docker images in parallel from base image..."
          
          # Build all three test images in parallel
          docker build \
            --build-arg BASE_IMAGE=fern-self-hosted:latest \
            -f servers/self-hosted/kubernetes-example/dockerfiles/Dockerfile.full-gen \
            -t fern-test-full-gen:latest \
            servers/self-hosted/ &
          PID1=$!
          
          docker build \
            --build-arg BASE_IMAGE=fern-self-hosted:latest \
            -f servers/self-hosted/kubernetes-example/dockerfiles/Dockerfile.only-deps \
            -t fern-test-only-deps:latest \
            servers/self-hosted/ &
          PID2=$!
          
          docker build \
            --build-arg BASE_IMAGE=fern-self-hosted:latest \
            -f servers/self-hosted/kubernetes-example/dockerfiles/Dockerfile.no-gen \
            -t fern-test-no-gen:latest \
            servers/self-hosted/ &
          PID3=$!
          
          wait $PID1 && echo "fern-test-full-gen built successfully" || { echo "fern-test-full-gen build failed"; exit 1; }
          wait $PID2 && echo "fern-test-only-deps built successfully" || { echo "fern-test-only-deps build failed"; exit 1; }
          wait $PID3 && echo "fern-test-no-gen built successfully" || { echo "fern-test-no-gen build failed"; exit 1; }
          
          echo "All test images built successfully!"
          docker images | grep fern

      # ============================================================
      # K8S TESTS PHASE
      # Self-hosted tests are now run in K8s cluster instead of Docker directly
      # This saves time by reusing the same cluster for all tests
      # ============================================================
      - name: Wait for background tasks to complete
        run: |
          echo "Waiting for background tasks to complete..."
          
          # Wait for Docker Hub login + base image pull (poll for completion marker)
          echo "Waiting for Docker setup (login + base image pull)..."
          for i in {1..120}; do
            if [ -f /tmp/bg-tasks/docker-setup.done ]; then
              echo "Docker setup completed!"
              cat /tmp/bg-tasks/docker-setup.log || true
              break
            fi
            if [ $i -eq 120 ]; then
              echo "Docker setup timed out! Logs:"
              cat /tmp/bg-tasks/docker-setup.log || true
              exit 1
            fi
            sleep 2
          done
          
          # Wait for KIND cluster setup (poll for completion marker)
          echo "Waiting for KIND cluster setup..."
          for i in {1..180}; do
            if [ -f /tmp/bg-tasks/kind-setup.done ]; then
              echo "KIND cluster setup completed!"
              cat /tmp/bg-tasks/kind-setup.log || true
              break
            fi
            if [ $i -eq 180 ]; then
              echo "KIND setup timed out! Logs:"
              cat /tmp/bg-tasks/kind-setup.log || true
              exit 1
            fi
            sleep 2
          done
          
          echo "All background tasks completed!"

      - name: Load Docker images into kind in parallel
        run: |
          echo "Loading test images into KIND cluster in parallel..."
          kind load docker-image fern-test-full-gen:latest &
          PID1=$!
          kind load docker-image fern-test-only-deps:latest &
          PID2=$!
          kind load docker-image fern-test-no-gen:latest &
          PID3=$!
          
          wait $PID1 && echo "fern-test-full-gen loaded" || { echo "fern-test-full-gen load failed"; exit 1; }
          wait $PID2 && echo "fern-test-only-deps loaded" || { echo "fern-test-only-deps load failed"; exit 1; }
          wait $PID3 && echo "fern-test-no-gen loaded" || { echo "fern-test-no-gen load failed"; exit 1; }
          echo "All images loaded into KIND!"

      - name: Deploy to Kubernetes and create test namespaces
        run: |
          # Create namespaces for buf cache tests in parallel with main deployment
          echo "Creating namespaces for parallel test execution..."
          NAMESPACES=(
            "runtime-gen-network-ok"      # Test 1: Runtime generation with network access
            "cached-deps-network-ok"      # Test 2: Cached deps with network access
            "cached-deps-airgapped"       # Test 3: Cached deps in air-gapped mode
            "full-gen-airgapped"          # Test 4: Full pre-generation in air-gapped mode
            "no-cache-airgapped-fail"     # Test 5: No cache in air-gapped mode (should fail)
            "runtime-gen-airgapped-fail"  # Test 6: Runtime generation in air-gapped mode (should fail)
          )
          for ns in "${NAMESPACES[@]}"; do
            kubectl create namespace $ns || true
          done
          
          # Use the full-gen image for the initial deployment test
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: fern-docs
            labels:
              app: fern-docs
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: fern-docs
            template:
              metadata:
                labels:
                  app: fern-docs
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  fsGroup: 65532
                  fsGroupChangePolicy: OnRootMismatch
                containers:
                  - name: fern-docs
                    image: fern-test-full-gen:latest
                    imagePullPolicy: Never
                    ports:
                      - name: docs
                        containerPort: 3000
                        protocol: TCP
                      - name: health
                        containerPort: 8081
                        protocol: TCP
                    env:
                      - name: WARMUP
                        value: "false"
                      - name: FERN_LOG_LEVEL
                        value: "info"
                      - name: TMPDIR
                        value: /tmp
                    resources:
                      requests:
                        memory: "2Gi"
                        cpu: "1000m"
                      limits:
                        memory: "4Gi"
                        cpu: "2000m"
                    livenessProbe:
                      httpGet:
                        path: /liveness
                        port: 8081
                      initialDelaySeconds: 120
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                    readinessProbe:
                      httpGet:
                        path: /readiness
                        port: 8081
                      initialDelaySeconds: 60
                      periodSeconds: 5
                      timeoutSeconds: 5
                      failureThreshold: 6
                    securityContext:
                      allowPrivilegeEscalation: false
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      privileged: false
                      readOnlyRootFilesystem: false
                      capabilities:
                        drop:
                          - ALL
                terminationGracePeriodSeconds: 30
          EOF
          kubectl apply -f servers/self-hosted/kubernetes-example/service.yaml
          
          # Deploy all buf cache tests in parallel (so they start warming up while main pod is being tested)
          echo "Deploying all 6 buf cache tests in parallel..."
          
          # Test 1: Runtime generation with network access - SHOULD PASS
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test1-deployment.yaml
          
          # Test 2: Cached deps with network access - SHOULD PASS
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test2-deployment.yaml
          
          # Test 3: Cached deps in air-gapped mode - SHOULD PASS
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test3-networkpolicy.yaml
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test3-deployment.yaml
          
          # Test 4: Full pre-generation in air-gapped mode - SHOULD PASS
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test4-networkpolicy.yaml
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test4-deployment.yaml
          
          # Test 5: No cache in air-gapped mode - SHOULD FAIL
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test5-networkpolicy.yaml
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test5-deployment.yaml
          
          # Test 6: Runtime generation in air-gapped mode - SHOULD FAIL
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test6-networkpolicy.yaml
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test6-deployment.yaml

      - name: Wait for pod to be ready
        run: |
          echo "Waiting for pod to be scheduled..."
          kubectl wait --for=condition=PodScheduled pod -l app=fern-docs --timeout=120s || true
          
          echo "Waiting for pod to be ready (this may take 3-5 minutes)..."
          for i in {1..15}; do
            POD_STATUS=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
            READY=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
            echo "Attempt $i/15: Pod status=$POD_STATUS, Ready=$READY"
            
            if [ "$READY" = "true" ]; then
              echo "Pod is ready!"
              break
            fi
            
            if [ "$POD_STATUS" = "Failed" ] || [ "$POD_STATUS" = "Error" ]; then
              echo "Pod failed to start. Checking logs..."
              kubectl logs -l app=fern-docs --tail=100 || true
              kubectl describe pod -l app=fern-docs || true
              exit 1
            fi
            
            sleep 10
          done
          
          READY=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
          if [ "$READY" != "true" ]; then
            echo "Pod failed to become ready within timeout"
            kubectl logs -l app=fern-docs --tail=200 || true
            kubectl describe pod -l app=fern-docs || true
            exit 1
          fi

      - name: Test health endpoints
        run: |
          echo "Testing liveness endpoint..."
          LIVENESS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:30080/liveness 2>/dev/null || echo "000")
          echo "Liveness status: $LIVENESS"
          
          POD_NAME=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].metadata.name}')
          
          echo "Testing internal liveness endpoint..."
          kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/liveness
          
          echo "Testing internal readiness endpoint..."
          kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/readiness
          
          echo "Testing internal FDR health..."
          kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health
          
          echo "Testing internal MinIO health..."
          kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/minio/health/live

      - name: Test PostgreSQL
        run: |
          POD_NAME=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].metadata.name}')
          
          echo "Testing PostgreSQL connection..."
          kubectl exec $POD_NAME -- pg_isready -h localhost -p 5432 -U postgres -d postgres
          
          echo "Checking fdr database exists..."
          DB_EXISTS=$(kubectl exec $POD_NAME -- psql -h localhost -p 5432 -U postgres -d postgres -t -c "SELECT 1 FROM pg_database WHERE datname='fdr'" 2>/dev/null | tr -d ' ')
          if [ "$DB_EXISTS" != "1" ]; then
            echo "ERROR: fdr database does not exist"
            exit 1
          fi
          echo "fdr database exists"
          
          echo "Checking fdr database has tables..."
          TABLE_COUNT=$(kubectl exec $POD_NAME -- psql -h localhost -p 5432 -U postgres -d fdr -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public'" 2>/dev/null | tr -d ' ')
          if [ "$TABLE_COUNT" -le 0 ]; then
            echo "ERROR: fdr database has no tables"
            exit 1
          fi
          echo "fdr database has $TABLE_COUNT tables"

      - name: Test docs UI via NodePort
        run: |
          echo "Testing docs UI via NodePort (localhost:30080)..."
          
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:30080 2>/dev/null || echo "000")
            echo "Attempt $i/30: HTTP status=$HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Docs UI is accessible!"
              break
            fi
            sleep 5
          done
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:30080 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Docs UI not accessible (HTTP $HTTP_CODE)"
            kubectl logs -l app=fern-docs --tail=100 || true
            exit 1
          fi
          
          CONTENT=$(curl -s http://localhost:30080 2>/dev/null | head -20)
          if ! echo "$CONTENT" | grep -q "<!DOCTYPE html>\|<html"; then
            echo "ERROR: Docs UI did not return HTML"
            echo "Content received:"
            echo "$CONTENT"
            exit 1
          fi
          echo "Docs UI returned valid HTML"

      - name: Test CORS proxy endpoint
        run: |
          echo "Testing CORS proxy endpoint (/__proxy/)..."
          
          # Test GET request through the proxy
          echo "Testing GET request through proxy..."
          PROXY_GET_CODE=$(curl -s -o /tmp/proxy-get-response.json -w "%{http_code}" "http://localhost:30080/__proxy/https://httpbin.org/get" 2>/dev/null || echo "000")
          echo "GET proxy status: $PROXY_GET_CODE"
          
          if [ "$PROXY_GET_CODE" != "200" ]; then
            echo "ERROR: CORS proxy GET request failed (HTTP $PROXY_GET_CODE)"
            cat /tmp/proxy-get-response.json 2>/dev/null || true
            exit 1
          fi
          
          # Verify the response contains expected httpbin data
          if ! grep -q '"url": "https://httpbin.org/get"' /tmp/proxy-get-response.json; then
            echo "ERROR: CORS proxy response does not contain expected httpbin data"
            cat /tmp/proxy-get-response.json
            exit 1
          fi
          echo "GET request through proxy successful"
          
          # Test POST request through the proxy
          echo "Testing POST request through proxy..."
          PROXY_POST_CODE=$(curl -s -o /tmp/proxy-post-response.json -w "%{http_code}" \
            -X POST "http://localhost:30080/__proxy/https://httpbin.org/post" \
            -H "Content-Type: application/json" \
            -d '{"test": "data"}' 2>/dev/null || echo "000")
          echo "POST proxy status: $PROXY_POST_CODE"
          
          if [ "$PROXY_POST_CODE" != "200" ]; then
            echo "ERROR: CORS proxy POST request failed (HTTP $PROXY_POST_CODE)"
            cat /tmp/proxy-post-response.json 2>/dev/null || true
            exit 1
          fi
          
          # Verify the response contains the posted data
          if ! grep -q '"test": "data"' /tmp/proxy-post-response.json; then
            echo "ERROR: CORS proxy POST response does not contain posted data"
            cat /tmp/proxy-post-response.json
            exit 1
          fi
          echo "POST request through proxy successful"
          
          # Test OPTIONS preflight request (CORS)
          echo "Testing OPTIONS preflight request..."
          CORS_HEADERS=$(curl -s -I -X OPTIONS "http://localhost:30080/__proxy/https://httpbin.org/post" 2>/dev/null)
          
          if ! echo "$CORS_HEADERS" | grep -qi "Access-Control-Allow-Origin"; then
            echo "ERROR: CORS proxy missing Access-Control-Allow-Origin header"
            echo "$CORS_HEADERS"
            exit 1
          fi
          
          if ! echo "$CORS_HEADERS" | grep -qi "Access-Control-Allow-Methods"; then
            echo "ERROR: CORS proxy missing Access-Control-Allow-Methods header"
            echo "$CORS_HEADERS"
            exit 1
          fi
          echo "OPTIONS preflight request successful with CORS headers"
          
          echo "All CORS proxy tests passed!"

      # Cleanup the main deployment before running buf cache tests
      - name: Cleanup main deployment
        run: |
          echo "Cleaning up main deployment before buf cache tests..."
          kubectl delete deployment fern-docs || true
          kubectl delete service fern-docs || true
          sleep 5

      # ============================================================
      # Buf Cache Tests - Testing air-gapped deployment scenarios
      # Using namespaces to run all tests in parallel
      # See servers/self-hosted/kubernetes-example/tests/ for YAML definitions
      # Tests were already deployed during the deploy phase (before main pod wait)
      # ============================================================

      - name: "Wait for buf cache tests and check results"
        run: |
          echo "Checking buf cache test results..."
          
          # Track results
          TEST_RESULTS=""
          FAILED=false
          
          # ============================================================
          # NETWORK POLICY VERIFICATION
          # Verify that air-gapped namespaces actually block external traffic
          # This ensures our tests are meaningful and catch real issues
          # ============================================================
          echo ""
          echo "=========================================="
          echo "Verifying NetworkPolicy blocks external traffic"
          echo "=========================================="
          
          # Test external connectivity from an air-gapped namespace
          # We use cached-deps-airgapped as it should have NetworkPolicy applied
          AIRGAPPED_NS="cached-deps-airgapped"
          AIRGAPPED_POD=$(kubectl get pods -n $AIRGAPPED_NS -l app=fern-docs -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          
          if [ -n "$AIRGAPPED_POD" ]; then
            echo "Testing external connectivity from $AIRGAPPED_NS/$AIRGAPPED_POD..."
            
            # Test Venus (Fern's auth service) - should be blocked
            echo "Testing Venus (api.buildwithfern.com)..."
            VENUS_RESULT=$(kubectl exec -n $AIRGAPPED_NS $AIRGAPPED_POD -- curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://api.buildwithfern.com/health 2>&1 || echo "blocked")
            echo "Venus result: $VENUS_RESULT"
            
            # Test buf.build - should be blocked
            echo "Testing buf.build..."
            BUF_RESULT=$(kubectl exec -n $AIRGAPPED_NS $AIRGAPPED_POD -- curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://buf.build 2>&1 || echo "blocked")
            echo "buf.build result: $BUF_RESULT"
            
            # Test google.com - should be blocked
            echo "Testing google.com..."
            GOOGLE_RESULT=$(kubectl exec -n $AIRGAPPED_NS $AIRGAPPED_POD -- curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://google.com 2>&1 || echo "blocked")
            echo "google.com result: $GOOGLE_RESULT"
            
            # Check if any external calls succeeded (they shouldn't in air-gapped mode)
            NETWORK_BLOCKED=true
            if [[ "$VENUS_RESULT" =~ ^[0-9]+$ ]] && [ "$VENUS_RESULT" != "000" ]; then
              echo "WARNING: Venus call succeeded with HTTP $VENUS_RESULT - NetworkPolicy may not be enforced!"
              NETWORK_BLOCKED=false
            fi
            if [[ "$BUF_RESULT" =~ ^[0-9]+$ ]] && [ "$BUF_RESULT" != "000" ]; then
              echo "WARNING: buf.build call succeeded with HTTP $BUF_RESULT - NetworkPolicy may not be enforced!"
              NETWORK_BLOCKED=false
            fi
            if [[ "$GOOGLE_RESULT" =~ ^[0-9]+$ ]] && [ "$GOOGLE_RESULT" != "000" ]; then
              echo "WARNING: google.com call succeeded with HTTP $GOOGLE_RESULT - NetworkPolicy may not be enforced!"
              NETWORK_BLOCKED=false
            fi
            
            if [ "$NETWORK_BLOCKED" = "true" ]; then
              echo "SUCCESS: NetworkPolicy is correctly blocking external traffic"
              TEST_RESULTS="${TEST_RESULTS}network-policy-verification: PASS (external traffic blocked)\n"
            else
              echo "WARNING: NetworkPolicy may not be fully enforced - some external calls succeeded"
              echo "This may affect the reliability of air-gapped tests"
              TEST_RESULTS="${TEST_RESULTS}network-policy-verification: WARNING (some external traffic allowed)\n"
            fi
          else
            echo "WARNING: Could not find pod in $AIRGAPPED_NS to test NetworkPolicy"
            TEST_RESULTS="${TEST_RESULTS}network-policy-verification: SKIPPED (no pod found)\n"
          fi
          
          echo ""
          
          # Define test namespaces and descriptions
          declare -A PASS_TESTS=(
            ["runtime-gen-network-ok"]="Runtime generation with network access"
            ["cached-deps-network-ok"]="Cached deps with network access"
            ["cached-deps-airgapped"]="Cached deps in air-gapped mode"
            ["full-gen-airgapped"]="Full pre-generation in air-gapped mode"
          )
          
          declare -A FAIL_TESTS=(
            ["no-cache-airgapped-fail"]="No cache in air-gapped mode"
            ["runtime-gen-airgapped-fail"]="Runtime generation in air-gapped mode"
          )
          
          # Check tests that should pass
          for ns in runtime-gen-network-ok cached-deps-network-ok cached-deps-airgapped full-gen-airgapped; do
            desc="${PASS_TESTS[$ns]}"
            echo ""
            echo "=========================================="
            echo "Checking $ns ($desc) - SHOULD PASS"
            echo "=========================================="
            
            READY=false
            for i in {1..5}; do
              POD_READY=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
              POD_STATUS=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
              echo "$ns - Attempt $i/5: Ready=$POD_READY, Status=$POD_STATUS"
              
              if [ "$POD_READY" = "true" ]; then
                # Pod reports ready - verify by checking liveness endpoint directly
                POD_NAME=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                echo "$ns - Pod $POD_NAME reports ready, verifying liveness endpoint..."
                
                LIVENESS_OK=false
                for j in {1..3}; do
                  LIVENESS_STATUS=$(kubectl exec -n $ns $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/liveness 2>/dev/null || echo "000")
                  echo "$ns - Liveness check $j/3: HTTP $LIVENESS_STATUS"
                  if [ "$LIVENESS_STATUS" = "200" ]; then
                    LIVENESS_OK=true
                    break
                  fi
                  sleep 2
                done
                
                if [ "$LIVENESS_OK" = "true" ]; then
                  # Also verify docs page actually loads at port 3000
                  echo "$ns - Liveness OK, verifying docs page loads at port 3000..."
                  DOCS_OK=false
                  for k in {1..3}; do
                    DOCS_STATUS=$(kubectl exec -n $ns $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo "000")
                    echo "$ns - Docs page check $k/3: HTTP $DOCS_STATUS"
                    if [ "$DOCS_STATUS" = "200" ]; then
                      DOCS_OK=true
                      break
                    fi
                    sleep 2
                  done
                  
                  if [ "$DOCS_OK" = "true" ]; then
                    READY=true
                    break
                  else
                    echo "$ns - WARNING: Liveness OK but docs page failed to load!"
                    echo "$ns - Checking logs for errors..."
                    kubectl logs -n $ns -l app=fern-docs --tail=50 2>/dev/null | grep -E "ERROR|FATAL|failed|fetch failed" || true
                  fi
                else
                  echo "$ns - WARNING: Pod reports ready but liveness check failed!"
                  echo "$ns - This may indicate docs generation failed. Checking logs..."
                  kubectl logs -n $ns -l app=fern-docs --tail=50 2>/dev/null | grep -E "ERROR|FATAL|failed|fetch failed" || true
                fi
              fi
              sleep 10
            done
            
            if [ "$READY" = "true" ]; then
              echo "SUCCESS: $ns passed - pod is ready, liveness check passed, and docs page loads"
              TEST_RESULTS="${TEST_RESULTS}$ns: PASS\n"
            else
              echo "FAILURE: $ns failed - pod did not become ready, liveness check failed, or docs page did not load"
              kubectl logs -n $ns -l app=fern-docs --tail=100 || true
              TEST_RESULTS="${TEST_RESULTS}$ns: FAIL (should have passed)\n"
              FAILED=true
            fi
          done
          
          # Check tests that should fail (network blocked, no cache)
          for ns in no-cache-airgapped-fail runtime-gen-airgapped-fail; do
            desc="${FAIL_TESTS[$ns]}"
            echo ""
            echo "=========================================="
            echo "Checking $ns ($desc) - SHOULD FAIL"
            echo "=========================================="
            
            BECAME_READY=false
            FOUND_EXPECTED_ERROR=false
            for i in {1..5}; do
              POD_READY=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
              POD_STATUS=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
              RESTART_COUNT=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}' 2>/dev/null || echo "0")
              echo "$ns - Attempt $i/5: Ready=$POD_READY, Status=$POD_STATUS, Restarts=$RESTART_COUNT"
              
              if [ "$POD_READY" = "true" ]; then
                BECAME_READY=true
                break
              fi
              
              # Check for errors in logs indicating buf fetch failure or container crash
              if kubectl logs -n $ns -l app=fern-docs --tail=50 2>/dev/null | grep -qE "buf.build|network|timeout|connection|ENOTFOUND|unavailable"; then
                echo "Found expected network/buf errors in logs - test correctly failed!"
                FOUND_EXPECTED_ERROR=true
                break
              fi
              
              # Also check if container has crashed/restarted (indicates failure as expected)
              if [ "$RESTART_COUNT" -gt 0 ]; then
                echo "Container has restarted $RESTART_COUNT times - test correctly failed!"
                FOUND_EXPECTED_ERROR=true
                break
              fi
              
              sleep 10
            done
            
            if [ "$BECAME_READY" = "true" ]; then
              echo "WARNING: $ns - pod became ready when it should have failed"
              echo "This may indicate NetworkPolicy is not being enforced or docs were pre-cached"
              kubectl logs -n $ns -l app=fern-docs --tail=50 || true
              TEST_RESULTS="${TEST_RESULTS}$ns: UNEXPECTED PASS (should have failed)\n"
              # Don't fail the overall test as this depends on NetworkPolicy enforcement
            elif [ "$FOUND_EXPECTED_ERROR" = "true" ]; then
              echo "SUCCESS: $ns passed - found expected network/buf errors (test correctly failed)"
              TEST_RESULTS="${TEST_RESULTS}$ns: PASS (correctly failed with expected errors)\n"
            else
              echo "SUCCESS: $ns passed - pod correctly failed to become ready (network blocked)"
              TEST_RESULTS="${TEST_RESULTS}$ns: PASS (correctly failed)\n"
            fi
          done
          
          echo ""
          echo "=========================================="
          echo "TEST RESULTS SUMMARY"
          echo "=========================================="
          echo -e "$TEST_RESULTS"
          
          if [ "$FAILED" = "true" ]; then
            echo "Some tests that should have passed did not pass!"
            exit 1
          fi
          
          echo "All expected-to-pass tests passed!"

      - name: Cleanup
        if: always()
        run: |
          # Fast cleanup - just delete the cluster, no need to gracefully delete namespaces
          kind delete cluster || true
