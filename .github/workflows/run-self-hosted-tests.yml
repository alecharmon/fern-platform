name: Run self-hosted tests

on:
  push:
    branches:
      - app
    paths:
      - "servers/fdr/**"
      - "servers/self-hosted/**"
      - ".github/workflows/run-self-hosted-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "servers/fdr/**"
      - "servers/self-hosted/**"
      - ".github/workflows/run-self-hosted-tests.yml"
  workflow_call:
    inputs:
      upload_artifact:
        description: "Whether to upload the JS bundle artifact for downstream jobs"
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

env:
  EKS_CLUSTER_NAME: ${{ vars.EKS_SMOKE_TEST_CLUSTER_NAME || 'self-hosted' }}
  AWS_REGION: ${{ vars.EKS_SMOKE_TEST_AWS_REGION || 'us-east-1' }}

jobs:
  # Combined job: build + self-hosted tests + K8s tests
  # This eliminates Docker image save/upload/download overhead
  test:
    runs-on: Seed
    timeout-minutes: 60
    if: github.event.action != 'closed'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # START BACKGROUND TASKS (run in parallel with build steps)
      # ============================================================
      - name: Start background setup tasks
        env:
          DOCKERHUB_USERNAME: fernapi
          DOCKERHUB_PASSWORD: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}
        run: |
          # Create a directory to store task status
          mkdir -p /tmp/bg-tasks
          
          # Start Docker Hub login + base image pull in background (pull must wait for login)
          echo "Starting Docker Hub login + base image pull in background..."
          (
            echo "Logging into Docker Hub..."
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            echo "Docker Hub login completed, pulling base image..."
            docker pull docker.io/fernapi/fern-self-hosted-base:latest
            echo "Base image pull completed!"
            # Write success marker
            echo "success" > /tmp/bg-tasks/docker-setup.done
          ) > /tmp/bg-tasks/docker-setup.log 2>&1 &
          
          # Start KIND cluster setup in background (download, install, create cluster, install Calico)
          echo "Starting KIND cluster setup in background..."
          (
            # Download kind
            curl -Lo /tmp/bg-tasks/kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
            chmod +x /tmp/bg-tasks/kind
            sudo mv /tmp/bg-tasks/kind /usr/local/bin/kind
            
            # Create KIND cluster with default CNI disabled for Calico
            cat <<EOF | kind create cluster --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: 192.168.0.0/16
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 30080
              hostPort: 30080
              protocol: TCP
          EOF
            
            # Install Calico for NetworkPolicy support
            echo "Installing Calico CNI..."
            kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml
            
            # Wait for Calico pods to be created
            echo "Waiting for Calico pods to be created..."
            for i in {1..30}; do
              POD_COUNT=$(kubectl get pods -n kube-system -l k8s-app=calico-node --no-headers 2>/dev/null | wc -l)
              if [ "$POD_COUNT" -gt 0 ]; then
                echo "Calico pods found ($POD_COUNT pods)"
                break
              fi
              echo "Waiting for Calico pods to be scheduled... ($i/30)"
              sleep 5
            done
            
            # Wait for Calico to be ready
            echo "Waiting for Calico to be ready..."
            kubectl wait --for=condition=ready pod -l k8s-app=calico-node -n kube-system --timeout=180s
            echo "KIND cluster with Calico is ready!"
            # Write success marker
            echo "success" > /tmp/bg-tasks/kind-setup.done
          ) > /tmp/bg-tasks/kind-setup.log 2>&1 &
          
          echo "All background tasks started!"

      # ============================================================
      # BUILD PHASE
      # ============================================================
      - name: Update Engines
        run: |
          node -e 'const fs = require("fs"); const pkg = require("./package.json"); pkg.engines.node = ">=20.0.0"; pkg.engines.pnpm = "10.27.0"; pkg.packageManager = "pnpm@10.27.0"; fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));'

      - name: Install
        uses: ./.github/actions/install

      - name: Cache Turbo build
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-self-hosted-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-self-hosted-

      - name: Compile and build
        run: pnpm turbo compile codegen build
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}

      - name: Build FDR CJS
        run: pnpm --filter @fern-platform/fdr build:tsup:cjs

      - name: Cache docs bundle build
        uses: actions/cache@v4
        with:
          path: |
            packages/fern-docs/bundle/.next/cache
          key: ${{ runner.os }}-nextjs-bundle-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/fern-docs/bundle/**/*.ts', 'packages/fern-docs/bundle/**/*.tsx', 'packages/fern-docs/bundle/**/*.js', 'packages/fern-docs/bundle/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-bundle-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-bundle-

      - name: Build docs bundle
        run: pnpm docs:self-hosted-bundle:build

      - name: Upload JS bundle artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-bundle
          path: |
            docs_bundle.tar.gz
            servers/fdr/cjs
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base Docker image
        run: |
          cd servers/self-hosted
          pnpm docker:build
        env:
          DOCKER_BUILDKIT: 1

      - name: Build test Docker images in parallel
        run: |
          echo "Building all test Docker images in parallel from base image..."
          
          # Build all three test images in parallel
          docker build \
            --build-arg BASE_IMAGE=fern-self-hosted:latest \
            -f servers/self-hosted/kubernetes-example/dockerfiles/Dockerfile.full-gen \
            -t fern-test-full-gen:latest \
            servers/self-hosted/ &
          PID1=$!
          
          docker build \
            --build-arg BASE_IMAGE=fern-self-hosted:latest \
            -f servers/self-hosted/kubernetes-example/dockerfiles/Dockerfile.only-deps \
            -t fern-test-only-deps:latest \
            servers/self-hosted/ &
          PID2=$!
          
          docker build \
            --build-arg BASE_IMAGE=fern-self-hosted:latest \
            -f servers/self-hosted/kubernetes-example/dockerfiles/Dockerfile.no-gen \
            -t fern-test-no-gen:latest \
            servers/self-hosted/ &
          PID3=$!
          
          docker build \
            --build-arg BASE_IMAGE=fern-self-hosted:latest \
            -f servers/self-hosted/kubernetes-example/dockerfiles/Dockerfile.basepath \
            -t fern-test-basepath:latest \
            servers/self-hosted/ &
          PID4=$!
          
          wait $PID1 && echo "fern-test-full-gen built successfully" || { echo "fern-test-full-gen build failed"; exit 1; }
          wait $PID2 && echo "fern-test-only-deps built successfully" || { echo "fern-test-only-deps build failed"; exit 1; }
          wait $PID3 && echo "fern-test-no-gen built successfully" || { echo "fern-test-no-gen build failed"; exit 1; }
          wait $PID4 && echo "fern-test-basepath built successfully" || { echo "fern-test-basepath build failed"; exit 1; }
          
          echo "All test images built successfully!"
          docker images | grep fern

      # ============================================================
      # K8S TESTS PHASE
      # Self-hosted tests are now run in K8s cluster instead of Docker directly
      # This saves time by reusing the same cluster for all tests
      # ============================================================
      - name: Wait for background tasks to complete
        run: |
          echo "Waiting for background tasks to complete..."
          
          # Wait for Docker Hub login + base image pull (poll for completion marker)
          echo "Waiting for Docker setup (login + base image pull)..."
          for i in {1..120}; do
            if [ -f /tmp/bg-tasks/docker-setup.done ]; then
              echo "Docker setup completed!"
              cat /tmp/bg-tasks/docker-setup.log || true
              break
            fi
            if [ $i -eq 120 ]; then
              echo "Docker setup timed out! Logs:"
              cat /tmp/bg-tasks/docker-setup.log || true
              exit 1
            fi
            sleep 2
          done
          
          # Wait for KIND cluster setup (poll for completion marker)
          echo "Waiting for KIND cluster setup..."
          for i in {1..180}; do
            if [ -f /tmp/bg-tasks/kind-setup.done ]; then
              echo "KIND cluster setup completed!"
              cat /tmp/bg-tasks/kind-setup.log || true
              break
            fi
            if [ $i -eq 180 ]; then
              echo "KIND setup timed out! Logs:"
              cat /tmp/bg-tasks/kind-setup.log || true
              exit 1
            fi
            sleep 2
          done
          
          echo "All background tasks completed!"

      - name: Load Docker images into kind in parallel
        run: |
          echo "Loading test images into KIND cluster in parallel..."
          kind load docker-image fern-test-full-gen:latest &
          PID1=$!
          kind load docker-image fern-test-only-deps:latest &
          PID2=$!
          kind load docker-image fern-test-no-gen:latest &
          PID3=$!
          kind load docker-image fern-test-basepath:latest &
          PID4=$!
          
          wait $PID1 && echo "fern-test-full-gen loaded" || { echo "fern-test-full-gen load failed"; exit 1; }
          wait $PID2 && echo "fern-test-only-deps loaded" || { echo "fern-test-only-deps load failed"; exit 1; }
          wait $PID3 && echo "fern-test-no-gen loaded" || { echo "fern-test-no-gen load failed"; exit 1; }
          wait $PID4 && echo "fern-test-basepath loaded" || { echo "fern-test-basepath load failed"; exit 1; }
          echo "All images loaded into KIND!"

      - name: Deploy to Kubernetes and create test namespaces
        run: |
          # Create namespaces for buf cache tests in parallel with main deployment
          echo "Creating namespaces for parallel test execution..."
          NAMESPACES=(
            "runtime-gen-network-ok"      # Test 1: Runtime generation with network access
            "cached-deps-network-ok"      # Test 2: Cached deps with network access
            "cached-deps-airgapped"       # Test 3: Cached deps in air-gapped mode
            "full-gen-airgapped"          # Test 4: Full pre-generation in air-gapped mode
            "no-cache-airgapped-fail"     # Test 5: No cache in air-gapped mode (should fail)
            "runtime-gen-airgapped-fail"  # Test 6: Runtime generation in air-gapped mode (should fail)
            "basepath-test"               # Test 7: Runtime basePath patching
          )
          for ns in "${NAMESPACES[@]}"; do
            kubectl create namespace $ns || true
          done
          
          # Use the full-gen image for the initial deployment test
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: fern-docs
            labels:
              app: fern-docs
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: fern-docs
            template:
              metadata:
                labels:
                  app: fern-docs
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                  runAsGroup: 65532
                  fsGroup: 65532
                  fsGroupChangePolicy: OnRootMismatch
                containers:
                  - name: fern-docs
                    image: fern-test-full-gen:latest
                    imagePullPolicy: Never
                    ports:
                      - name: docs
                        containerPort: 3000
                        protocol: TCP
                      - name: health
                        containerPort: 8081
                        protocol: TCP
                    env:
                      - name: WARMUP
                        value: "false"
                      - name: FERN_LOG_LEVEL
                        value: "info"
                      - name: TMPDIR
                        value: /tmp
                      - name: CORS_PROXY_ALLOWED_DOMAINS
                        value: "google.com,cloudflare.com"
                      - name: FERN_AUTH_TYPE
                        value: "password"
                      - name: FERN_AUTH_SECRET
                        value: "fern"
                    resources:
                      requests:
                        memory: "4Gi"
                        cpu: "1000m"
                      limits:
                        memory: "8Gi"
                        cpu: "2000m"
                    livenessProbe:
                      httpGet:
                        path: /liveness
                        port: 8081
                      initialDelaySeconds: 120
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                    readinessProbe:
                      httpGet:
                        path: /readiness
                        port: 8081
                      initialDelaySeconds: 60
                      periodSeconds: 5
                      timeoutSeconds: 5
                      failureThreshold: 6
                    securityContext:
                      allowPrivilegeEscalation: false
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      privileged: false
                      readOnlyRootFilesystem: false
                      capabilities:
                        drop:
                          - ALL
                terminationGracePeriodSeconds: 30
          EOF
          kubectl apply -f servers/self-hosted/kubernetes-example/service.yaml
          
          # Deploy all buf cache tests in parallel (so they start warming up while main pod is being tested)
          echo "Deploying all 6 buf cache tests in parallel..."
          
          # Test 1: Runtime generation with network access - SHOULD PASS
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test1-deployment.yaml
          
          # Test 2: Cached deps with network access - SHOULD PASS
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test2-deployment.yaml
          
          # Test 3: Cached deps in air-gapped mode - SHOULD PASS
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test3-networkpolicy.yaml
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test3-deployment.yaml
          
          # Test 4: Full pre-generation in air-gapped mode - SHOULD PASS
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test4-networkpolicy.yaml
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test4-deployment.yaml
          
          # Test 5: No cache in air-gapped mode - SHOULD FAIL
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test5-networkpolicy.yaml
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test5-deployment.yaml
          
          # Test 6: Runtime generation in air-gapped mode - SHOULD FAIL
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test6-networkpolicy.yaml
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test6-deployment.yaml
          
          # Test 7: Runtime basePath patching - SHOULD PASS
          kubectl apply -f servers/self-hosted/kubernetes-example/tests/test7-deployment.yaml

      - name: Wait for pod to be ready
        run: |
          echo "Waiting for pod to be scheduled..."
          kubectl wait --for=condition=PodScheduled pod -l app=fern-docs --timeout=120s || true
          
          echo "Waiting for pod to be ready (this may take 3-5 minutes)..."
          for i in {1..15}; do
            POD_STATUS=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
            READY=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
            echo "Attempt $i/15: Pod status=$POD_STATUS, Ready=$READY"
            
            if [ "$READY" = "true" ]; then
              echo "Pod is ready!"
              break
            fi
            
            if [ "$POD_STATUS" = "Failed" ] || [ "$POD_STATUS" = "Error" ]; then
              echo "Pod failed to start. Checking logs..."
              kubectl logs -l app=fern-docs --tail=100 || true
              kubectl describe pod -l app=fern-docs || true
              exit 1
            fi
            
            sleep 10
          done
          
          READY=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
          if [ "$READY" != "true" ]; then
            echo "Pod failed to become ready within timeout"
            kubectl logs -l app=fern-docs --tail=200 || true
            kubectl describe pod -l app=fern-docs || true
            exit 1
          fi

      - name: Test health endpoints
        run: |
          echo "Testing liveness endpoint..."
          LIVENESS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:30080/liveness 2>/dev/null || echo "000")
          echo "Liveness status: $LIVENESS"
          
          POD_NAME=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].metadata.name}')
          
          echo "Testing internal liveness endpoint..."
          kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/liveness
          
          echo "Testing internal readiness endpoint..."
          kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/readiness
          
          echo "Testing internal FDR health..."
          kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health
          
          echo "Testing internal MinIO health..."
          kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/minio/health/live

      - name: Test PostgreSQL
        run: |
          POD_NAME=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].metadata.name}')
          
          echo "Testing PostgreSQL connection..."
          kubectl exec $POD_NAME -- pg_isready -h localhost -p 5432 -U postgres -d postgres
          
          echo "Checking fdr database exists..."
          DB_EXISTS=$(kubectl exec $POD_NAME -- psql -h localhost -p 5432 -U postgres -d postgres -t -c "SELECT 1 FROM pg_database WHERE datname='fdr'" 2>/dev/null | tr -d ' ')
          if [ "$DB_EXISTS" != "1" ]; then
            echo "ERROR: fdr database does not exist"
            exit 1
          fi
          echo "fdr database exists"
          
          echo "Checking fdr database has tables..."
          TABLE_COUNT=$(kubectl exec $POD_NAME -- psql -h localhost -p 5432 -U postgres -d fdr -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public'" 2>/dev/null | tr -d ' ')
          if [ "$TABLE_COUNT" -le 0 ]; then
            echo "ERROR: fdr database has no tables"
            exit 1
          fi
          echo "fdr database has $TABLE_COUNT tables"

      # ============================================================
      # BASEPATH RUNTIME PATCHING TEST
      # Run this before password auth tests since it's in a separate namespace
      # and doesn't depend on the default namespace pod
      # ============================================================
      - name: Test basePath runtime patching
        run: |
          echo ""
          echo "=========================================="
          echo "BasePath runtime patching test"
          echo "=========================================="
          
          BP_NS="basepath-test"
          BP_POD=""
          BP_READY=false
          
          for i in {1..30}; do
            POD_READY=$(kubectl get pods -n $BP_NS -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
            POD_STATUS=$(kubectl get pods -n $BP_NS -l app=fern-docs -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
            echo "$BP_NS - Attempt $i/30: Ready=$POD_READY, Status=$POD_STATUS"
            
            if [ "$POD_READY" = "true" ]; then
              BP_POD=$(kubectl get pods -n $BP_NS -l app=fern-docs -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              echo "$BP_NS - Pod $BP_POD is ready"
              
              LIVENESS_STATUS=$(kubectl exec -n $BP_NS $BP_POD -- curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/liveness 2>/dev/null || echo "000")
              echo "$BP_NS - Liveness: HTTP $LIVENESS_STATUS"
              if [ "$LIVENESS_STATUS" = "200" ]; then
                BP_READY=true
                break
              fi
            fi
            sleep 10
          done
          
          if [ "$BP_READY" = "false" ]; then
            echo "FAILURE: basepath-test - pod did not become ready"
            kubectl logs -n $BP_NS -l app=fern-docs --tail=100 || true
            kubectl describe pod -n $BP_NS -l app=fern-docs || true
            exit 1
          fi
          
          echo "$BP_NS - Pod ready, testing basePath patching..."
          
          # Port-forward to test from outside the pod
          LOCAL_PORT=$((10000 + RANDOM % 50000))
          echo "$BP_NS - Port-forwarding $BP_POD:3000 to localhost:$LOCAL_PORT..."
          kubectl port-forward -n $BP_NS $BP_POD $LOCAL_PORT:3000 &
          PF_PID=$!
          sleep 3
          
          # Test 1: Docs UI accessible at /docs/ (basePath)
          BP_DOCS_OK=false
          for attempt in {1..5}; do
            echo "$BP_NS - Checking /docs/ (attempt $attempt/5)..."
            HTTP_CODE=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "http://localhost:$LOCAL_PORT/docs/" 2>/dev/null || echo "000")
            echo "$BP_NS - /docs/ HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "307" ]; then
              BP_DOCS_OK=true
              break
            fi
            sleep 3
          done
          
          if [ "$BP_DOCS_OK" = "false" ]; then
            echo "FAILURE: Docs UI not accessible at /docs/"
            kubectl logs -n $BP_NS -l app=fern-docs --tail=100 || true
            kill $PF_PID 2>/dev/null || true
            exit 1
          fi
          
          # Test 2: HTML does NOT contain placeholder string
          echo "$BP_NS - Checking that placeholder /__FERN_BP__/ is not in response..."
          RESPONSE_BODY=$(curl -s --max-time 30 "http://localhost:$LOCAL_PORT/docs/" 2>/dev/null || echo "")
          if echo "$RESPONSE_BODY" | grep -q "/__FERN_BP__/"; then
            echo "FAILURE: Response HTML still contains /__FERN_BP__/ placeholder!"
            echo "First 500 chars of response:"
            echo "$RESPONSE_BODY" | head -c 500
            kill $PF_PID 2>/dev/null || true
            exit 1
          fi
          echo "$BP_NS - Placeholder correctly replaced (not found in response)"
          
          # Test 3: Verify /docs/_next/static paths are present (basePath applied to assets)
          echo "$BP_NS - Checking that /docs/_next/ asset paths are in response..."
          if echo "$RESPONSE_BODY" | grep -q "/docs/_next/"; then
            echo "$BP_NS - Asset paths correctly use /docs/ prefix"
          else
            echo "WARNING: /docs/_next/ not found in response - assets may not use basePath"
            echo "First 1000 chars of response:"
            echo "$RESPONSE_BODY" | head -c 1000
          fi
          
          # Clean up port-forward
          kill $PF_PID 2>/dev/null || true
          wait $PF_PID 2>/dev/null || true
          
          echo "SUCCESS: basepath-test passed (docs accessible at /docs/, placeholder replaced)"

      - name: Test docs UI via NodePort (password auth enabled)
        run: |
          echo "Testing docs UI via NodePort with password auth (localhost:30080)..."
          echo "With password auth enabled, unauthenticated requests should return 307 (redirect to login)"
          
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:30080 2>/dev/null || echo "000")
            echo "Attempt $i/5: HTTP status=$HTTP_CODE"
            
            if [ "$HTTP_CODE" = "307" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Docs UI is responding (HTTP $HTTP_CODE)!"
              break
            fi
            sleep 5
          done
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:30080 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "307" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Docs UI not accessible (HTTP $HTTP_CODE, expected 307 or 200)"
            kubectl logs -l app=fern-docs --tail=100 || true
            exit 1
          fi
          echo "Docs UI is responding correctly (HTTP $HTTP_CODE)"

      - name: Test password auth flow
        run: |
          POD_NAME=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].metadata.name}')
          DOMAIN=$(kubectl exec $POD_NAME -- printenv NEXT_PUBLIC_DOCS_DOMAIN 2>/dev/null || echo "localhost")
          
          echo "Testing password auth endpoint..."
          echo "Domain: $DOMAIN"
          
          # Diagnostic: check basePath config in Next.js manifests
          echo "=== Diagnostics: basePath config ==="
          echo "--- required-server-files.json basePath ---"
          kubectl exec $POD_NAME -- node -e "
            const d = require('/nextapp/packages/fern-docs/bundle/.next/required-server-files.json');
            console.log('basePath:', JSON.stringify(d.config?.basePath));
            console.log('assetPrefix:', JSON.stringify(d.config?.assetPrefix));
          " 2>/dev/null || echo "(could not read)"
          echo "--- routes-manifest.json basePath ---"
          kubectl exec $POD_NAME -- node -e "
            const d = require('/nextapp/packages/fern-docs/bundle/.next/routes-manifest.json');
            console.log('basePath:', JSON.stringify(d.basePath));
          " 2>/dev/null || echo "(could not read)"
          echo "--- Check for remaining placeholder ---"
          kubectl exec $POD_NAME -- sh -c 'find /nextapp/packages/fern-docs/bundle/.next -name "required-server-files.json" -o -name "routes-manifest.json" | xargs grep -l "FERN_BP" 2>/dev/null || echo "No placeholder found in manifests"'
          echo "--- NEXT_PUBLIC_BASE_PATH env ---"
          kubectl exec $POD_NAME -- printenv NEXT_PUBLIC_BASE_PATH 2>/dev/null || echo "(not set)"
          echo "=== End diagnostics ==="
          
          echo "Test 1: Incorrect password should return 401..."
          WRONG_PW_CODE=$(kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" \
            -X POST "http://localhost:3000/api/fern-docs/auth/password" \
            -H "Content-Type: application/json" \
            -H "x-fern-host: ${DOMAIN}" \
            -d '{"password": "wrong"}' 2>/dev/null || echo "000")
          echo "Wrong password status: $WRONG_PW_CODE"
          if [ "$WRONG_PW_CODE" != "401" ]; then
            echo "ERROR: Wrong password should return 401 (got $WRONG_PW_CODE)"
            echo "--- Response body and headers via proxy (port 3000) ---"
            kubectl exec $POD_NAME -- curl -s -D- \
              -X POST "http://localhost:3000/api/fern-docs/auth/password" \
              -H "Content-Type: application/json" \
              -H "x-fern-host: ${DOMAIN}" \
              -d '{"password": "wrong"}' 2>/dev/null || true
            echo ""
            echo "--- Direct to Next.js (port 3001) ---"
            kubectl exec $POD_NAME -- curl -s -D- \
              -X POST "http://localhost:3001/api/fern-docs/auth/password" \
              -H "Content-Type: application/json" \
              -H "x-fern-host: ${DOMAIN}" \
              -H "x-forwarded-host: localhost:3000" \
              -d '{"password": "wrong"}' 2>/dev/null || true
            echo ""
            echo "--- Pod logs (last 30 lines) ---"
            kubectl logs $POD_NAME --tail=30 2>/dev/null || true
            exit 1
          fi
          echo "Wrong password correctly rejected"
          
          echo "Test 2: Correct password should return 200..."
          CORRECT_PW_CODE=$(kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" \
            -X POST "http://localhost:3000/api/fern-docs/auth/password" \
            -H "Content-Type: application/json" \
            -H "x-fern-host: ${DOMAIN}" \
            -d '{"password": "fern"}' 2>/dev/null || echo "000")
          echo "Correct password status: $CORRECT_PW_CODE"
          if [ "$CORRECT_PW_CODE" != "200" ]; then
            echo "ERROR: Correct password should return 200 (got $CORRECT_PW_CODE)"
            kubectl exec $POD_NAME -- curl -s -D- \
              -X POST "http://localhost:3000/api/fern-docs/auth/password" \
              -H "Content-Type: application/json" \
              -H "x-fern-host: ${DOMAIN}" \
              -d '{"password": "fern"}' 2>/dev/null || true
            exit 1
          fi
          echo "Correct password accepted"
          
          echo "All password auth tests passed!"

      - name: Test custom components page
        run: |
          echo "Testing custom components page (localhost:30080/custom-components)..."
          echo "With password auth enabled, unauthenticated requests should return 307 (redirect to login)"
          
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:30080/custom-components 2>/dev/null || echo "000")
            echo "Attempt $i/5: HTTP status=$HTTP_CODE"
            
            if [ "$HTTP_CODE" = "307" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Custom components page is responding (HTTP $HTTP_CODE)!"
              break
            fi
            sleep 5
          done
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:30080/custom-components 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "307" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Custom components page not accessible (HTTP $HTTP_CODE, expected 307 or 200)"
            kubectl logs -l app=fern-docs --tail=100 || true
            exit 1
          fi
          echo "Custom components page responding correctly (HTTP $HTTP_CODE)"

      - name: Test CORS proxy endpoint
        run: |
          echo "Testing CORS proxy endpoint (/__proxy/)..."
          
          # Test 1: Verify SSRF protection - blocked domain should return 403
          echo "Testing SSRF protection (blocked domain should return 403)..."
          BLOCKED_CODE=$(curl -s -o /tmp/proxy-blocked-response.txt -w "%{http_code}" "http://localhost:30080/__proxy/https://example.org" 2>/dev/null || echo "000")
          echo "Blocked domain status: $BLOCKED_CODE"
          
          if [ "$BLOCKED_CODE" != "403" ]; then
            echo "ERROR: SSRF protection failed - expected 403 for blocked domain, got $BLOCKED_CODE"
            cat /tmp/proxy-blocked-response.txt 2>/dev/null || true
            exit 1
          fi
          echo "SSRF protection working - blocked domain correctly returned 403"
          
          # Test 2: GET request through the proxy using Google (allowed via CORS_PROXY_ALLOWED_DOMAINS)
          echo "Testing GET request through proxy (allowed domain)..."
          PROXY_GET_CODE=$(curl -s -o /tmp/proxy-get-response.html -w "%{http_code}" "http://localhost:30080/__proxy/https://www.google.com" 2>/dev/null || echo "000")
          echo "GET proxy status: $PROXY_GET_CODE"
          
          if [ "$PROXY_GET_CODE" != "200" ]; then
            echo "ERROR: CORS proxy GET request failed (HTTP $PROXY_GET_CODE)"
            cat /tmp/proxy-get-response.html 2>/dev/null || true
            exit 1
          fi
          
          # Verify the response contains HTML content from Google
          if ! grep -qi "google" /tmp/proxy-get-response.html; then
            echo "ERROR: CORS proxy response does not contain expected Google content"
            head -20 /tmp/proxy-get-response.html
            exit 1
          fi
          echo "GET request through proxy successful"
          
          # Test 3: POST request through the proxy using Cloudflare (allowed via CORS_PROXY_ALLOWED_DOMAINS)
          echo "Testing POST request through proxy (allowed domain)..."
          PROXY_POST_CODE=$(curl -s -o /tmp/proxy-post-response.txt -w "%{http_code}" \
            -X POST "http://localhost:30080/__proxy/https://cloudflare.com/cdn-cgi/trace" \
            -H "Content-Type: application/json" \
            -d '{"test": "data"}' 2>/dev/null || echo "000")
          echo "POST proxy status: $PROXY_POST_CODE"
          
          if [ "$PROXY_POST_CODE" != "200" ]; then
            echo "ERROR: CORS proxy POST request failed (HTTP $PROXY_POST_CODE)"
            cat /tmp/proxy-post-response.txt 2>/dev/null || true
            exit 1
          fi
          
          # Verify the response contains Cloudflare trace data
          if ! grep -q "fl=" /tmp/proxy-post-response.txt; then
            echo "ERROR: CORS proxy POST response does not contain expected Cloudflare data"
            cat /tmp/proxy-post-response.txt
            exit 1
          fi
          echo "POST request through proxy successful"
          
          # Test 4: OPTIONS preflight request (CORS)
          echo "Testing OPTIONS preflight request..."
          CORS_HEADERS=$(curl -s -I -X OPTIONS "http://localhost:30080/__proxy/https://www.google.com" 2>/dev/null)
          
          if ! echo "$CORS_HEADERS" | grep -qi "Access-Control-Allow-Origin"; then
            echo "ERROR: CORS proxy missing Access-Control-Allow-Origin header"
            echo "$CORS_HEADERS"
            exit 1
          fi
          
          if ! echo "$CORS_HEADERS" | grep -qi "Access-Control-Allow-Methods"; then
            echo "ERROR: CORS proxy missing Access-Control-Allow-Methods header"
            echo "$CORS_HEADERS"
            exit 1
          fi
          echo "OPTIONS preflight request successful with CORS headers"
          
          echo "All CORS proxy tests passed!"

      - name: Test MeiliSearch search endpoint
        run: |
          POD_NAME=$(kubectl get pods -l app=fern-docs -o jsonpath='{.items[0].metadata.name}')
          
          echo "Testing MeiliSearch health endpoint directly inside pod..."
          MEILI_HEALTH=$(kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:7700/health 2>/dev/null || echo "000")
          echo "MeiliSearch health status: $MEILI_HEALTH"
          
          if [ "$MEILI_HEALTH" != "200" ]; then
            echo "ERROR: MeiliSearch health check failed (HTTP $MEILI_HEALTH)"
            kubectl exec $POD_NAME -- curl -s http://localhost:7700/health 2>/dev/null || true
            exit 1
          fi
          echo "MeiliSearch health check passed"
          
          # Note: The /_search/ proxy allows safe search endpoints:
          # - indexes (list all indexes)
          # - indexes/{indexName} (get index info)
          # - indexes/{indexName}/search (single index search)
          # - indexes/{indexName}/facet-search (facet search)
          # - multi-search (multi-index search)
          # Admin endpoints like /keys, /dumps, /snapshots, /tasks are blocked for security reasons
          
          echo "Testing that indexes endpoint is allowed via /_search/ proxy..."
          
          # Capture verbose output for debugging
          echo "Making request to http://localhost:3000/_search/indexes..."
          INDEXES_RESPONSE=$(kubectl exec $POD_NAME -- curl -s -v http://localhost:3000/_search/indexes 2>&1 || echo "curl failed")
          echo "Full response:"
          echo "$INDEXES_RESPONSE"
          
          INDEXES_CODE=$(kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/_search/indexes 2>/dev/null || echo "000")
          echo "Indexes endpoint status: $INDEXES_CODE (expected 200)"
          
          if [ "$INDEXES_CODE" != "200" ]; then
            echo "ERROR: MeiliSearch indexes endpoint should return 200 OK (got HTTP $INDEXES_CODE)"
            echo ""
            echo "=== Capturing pod logs for debugging ==="
            kubectl logs $POD_NAME --tail=100 || true
            echo "=== End of pod logs ==="
            exit 1
          fi
          echo "MeiliSearch indexes endpoint allowed"
          
          echo "Testing that admin endpoints are blocked via /_search/ proxy..."
          KEYS_CODE=$(kubectl exec $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/_search/keys 2>/dev/null || echo "000")
          echo "Keys endpoint status: $KEYS_CODE (expected 403)"
          
          if [ "$KEYS_CODE" != "403" ]; then
            echo "ERROR: MeiliSearch keys endpoint should return 403 Forbidden (got HTTP $KEYS_CODE)"
            exit 1
          fi
          echo "MeiliSearch keys endpoint correctly blocked"
          
          echo "All MeiliSearch security tests passed!"

      # Cleanup the main deployment before running buf cache tests
      - name: Cleanup main deployment
        run: |
          echo "Cleaning up main deployment before buf cache tests..."
          kubectl delete deployment fern-docs || true
          kubectl delete service fern-docs || true
          sleep 5

      # ============================================================
      # Buf Cache Tests - Testing air-gapped deployment scenarios
      # Using namespaces to run all tests in parallel
      # See servers/self-hosted/kubernetes-example/tests/ for YAML definitions
      # Tests were already deployed during the deploy phase (before main pod wait)
      # ============================================================

      - name: "Wait for buf cache tests and check results"
        run: |
          echo "Checking buf cache test results..."
          
          # Track results
          TEST_RESULTS=""
          FAILED=false
          
          # ============================================================
          # NETWORK POLICY VERIFICATION
          # Verify that air-gapped namespaces actually block external traffic
          # This ensures our tests are meaningful and catch real issues
          # ============================================================
          echo ""
          echo "=========================================="
          echo "Verifying NetworkPolicy blocks external traffic"
          echo "=========================================="
          
          # Test external connectivity from an air-gapped namespace
          # We use cached-deps-airgapped as it should have NetworkPolicy applied
          AIRGAPPED_NS="cached-deps-airgapped"
          AIRGAPPED_POD=$(kubectl get pods -n $AIRGAPPED_NS -l app=fern-docs -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          
          if [ -n "$AIRGAPPED_POD" ]; then
            echo "Testing external connectivity from $AIRGAPPED_NS/$AIRGAPPED_POD..."
            
            # Test Venus (Fern's auth service) - should be blocked
            echo "Testing Venus (api.buildwithfern.com)..."
            VENUS_RESULT=$(kubectl exec -n $AIRGAPPED_NS $AIRGAPPED_POD -- curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://api.buildwithfern.com/health 2>&1 || echo "blocked")
            echo "Venus result: $VENUS_RESULT"
            
            # Test buf.build - should be blocked
            echo "Testing buf.build..."
            BUF_RESULT=$(kubectl exec -n $AIRGAPPED_NS $AIRGAPPED_POD -- curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://buf.build 2>&1 || echo "blocked")
            echo "buf.build result: $BUF_RESULT"
            
            # Test google.com - should be blocked
            echo "Testing google.com..."
            GOOGLE_RESULT=$(kubectl exec -n $AIRGAPPED_NS $AIRGAPPED_POD -- curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://google.com 2>&1 || echo "blocked")
            echo "google.com result: $GOOGLE_RESULT"
            
            # Check if any external calls succeeded (they shouldn't in air-gapped mode)
            NETWORK_BLOCKED=true
            if [[ "$VENUS_RESULT" =~ ^[0-9]+$ ]] && [ "$VENUS_RESULT" != "000" ]; then
              echo "WARNING: Venus call succeeded with HTTP $VENUS_RESULT - NetworkPolicy may not be enforced!"
              NETWORK_BLOCKED=false
            fi
            if [[ "$BUF_RESULT" =~ ^[0-9]+$ ]] && [ "$BUF_RESULT" != "000" ]; then
              echo "WARNING: buf.build call succeeded with HTTP $BUF_RESULT - NetworkPolicy may not be enforced!"
              NETWORK_BLOCKED=false
            fi
            if [[ "$GOOGLE_RESULT" =~ ^[0-9]+$ ]] && [ "$GOOGLE_RESULT" != "000" ]; then
              echo "WARNING: google.com call succeeded with HTTP $GOOGLE_RESULT - NetworkPolicy may not be enforced!"
              NETWORK_BLOCKED=false
            fi
            
            if [ "$NETWORK_BLOCKED" = "true" ]; then
              echo "SUCCESS: NetworkPolicy is correctly blocking external traffic"
              TEST_RESULTS="${TEST_RESULTS}network-policy-verification: PASS (external traffic blocked)\n"
            else
              echo "WARNING: NetworkPolicy may not be fully enforced - some external calls succeeded"
              echo "This may affect the reliability of air-gapped tests"
              TEST_RESULTS="${TEST_RESULTS}network-policy-verification: WARNING (some external traffic allowed)\n"
            fi
          else
            echo "WARNING: Could not find pod in $AIRGAPPED_NS to test NetworkPolicy"
            TEST_RESULTS="${TEST_RESULTS}network-policy-verification: SKIPPED (no pod found)\n"
          fi
          
          echo ""
          
          # Define test namespaces and descriptions
          declare -A PASS_TESTS=(
            ["runtime-gen-network-ok"]="Runtime generation with network access"
            ["cached-deps-network-ok"]="Cached deps with network access"
            ["cached-deps-airgapped"]="Cached deps in air-gapped mode"
            ["full-gen-airgapped"]="Full pre-generation in air-gapped mode"
          )
          
          declare -A FAIL_TESTS=(
            ["no-cache-airgapped-fail"]="No cache in air-gapped mode"
            ["runtime-gen-airgapped-fail"]="Runtime generation in air-gapped mode"
          )
          
          # Check tests that should pass
          for ns in runtime-gen-network-ok cached-deps-network-ok cached-deps-airgapped full-gen-airgapped; do
            desc="${PASS_TESTS[$ns]}"
            echo ""
            echo "=========================================="
            echo "Checking $ns ($desc) - SHOULD PASS"
            echo "=========================================="
            
            READY=false
            for i in {1..30}; do
              POD_READY=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
              POD_STATUS=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
              echo "$ns - Attempt $i/5: Ready=$POD_READY, Status=$POD_STATUS"
              
              if [ "$POD_READY" = "true" ]; then
                # Pod reports ready - verify by checking liveness endpoint directly
                POD_NAME=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                echo "$ns - Pod $POD_NAME reports ready, verifying liveness endpoint..."
                
                LIVENESS_OK=false
                for j in {1..3}; do
                  LIVENESS_STATUS=$(kubectl exec -n $ns $POD_NAME -- curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/liveness 2>/dev/null || echo "000")
                  echo "$ns - Liveness check $j/3: HTTP $LIVENESS_STATUS"
                  if [ "$LIVENESS_STATUS" = "200" ]; then
                    LIVENESS_OK=true
                    break
                  fi
                  sleep 2
                done
                
                if [ "$LIVENESS_OK" = "true" ]; then
                  # Also verify docs page actually loads at port 3000
                  echo "$ns - Liveness OK, verifying docs page loads at port 3000..."
                  DOCS_OK=false
                  for k in {1..3}; do
                    DOCS_STATUS=$(kubectl exec -n $ns $POD_NAME -- curl -s --max-time 30 -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo "000")
                    echo "$ns - Docs page check $k/3: HTTP $DOCS_STATUS"
                    if [ "$DOCS_STATUS" = "200" ]; then
                      DOCS_OK=true
                      break
                    fi
                    sleep 2
                  done
                  
                  if [ "$DOCS_OK" = "true" ]; then
                    READY=true
                    break
                  else
                    echo "$ns - WARNING: Liveness OK but docs page failed to load!"
                    echo "$ns - Checking logs for errors..."
                    kubectl logs -n $ns -l app=fern-docs --tail=50 2>/dev/null | grep -E "ERROR|FATAL|failed|fetch failed" || true
                  fi
                else
                  echo "$ns - WARNING: Pod reports ready but liveness check failed!"
                  echo "$ns - This may indicate docs generation failed. Checking logs..."
                  kubectl logs -n $ns -l app=fern-docs --tail=50 2>/dev/null | grep -E "ERROR|FATAL|failed|fetch failed" || true
                fi
              fi
              sleep 10
            done
            
            if [ "$READY" = "true" ]; then
              echo "SUCCESS: $ns passed - pod is ready, liveness check passed, and docs page loads"
              TEST_RESULTS="${TEST_RESULTS}$ns: PASS\n"
            else
              echo "FAILURE: $ns failed - pod did not become ready, liveness check failed, or docs page did not load"
              kubectl logs -n $ns -l app=fern-docs --tail=100 || true
              TEST_RESULTS="${TEST_RESULTS}$ns: FAIL (should have passed)\n"
              FAILED=true
            fi
          done
          
          # Check tests that should fail (network blocked, no cache)
          for ns in no-cache-airgapped-fail runtime-gen-airgapped-fail; do
            desc="${FAIL_TESTS[$ns]}"
            echo ""
            echo "=========================================="
            echo "Checking $ns ($desc) - SHOULD FAIL"
            echo "=========================================="
            
            BECAME_READY=false
            FOUND_EXPECTED_ERROR=false
            for i in {1..30}; do
              POD_READY=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
              POD_STATUS=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
              RESTART_COUNT=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}' 2>/dev/null || echo "0")
              echo "$ns - Attempt $i/5: Ready=$POD_READY, Status=$POD_STATUS, Restarts=$RESTART_COUNT"
              
              if [ "$POD_READY" = "true" ]; then
                BECAME_READY=true
                break
              fi
              
              # Check for errors in logs indicating buf fetch failure or container crash
              if kubectl logs -n $ns -l app=fern-docs --tail=50 2>/dev/null | grep -qE "buf.build|network|timeout|connection|ENOTFOUND|unavailable"; then
                echo "Found expected network/buf errors in logs - test correctly failed!"
                FOUND_EXPECTED_ERROR=true
                break
              fi
              
              # Also check if container has crashed/restarted (indicates failure as expected)
              if [ "$RESTART_COUNT" -gt 0 ]; then
                echo "Container has restarted $RESTART_COUNT times - test correctly failed!"
                FOUND_EXPECTED_ERROR=true
                break
              fi
              
              sleep 10
            done
            
            if [ "$BECAME_READY" = "true" ]; then
              echo "FAILURE: $ns - pod became ready when it should have failed"
              echo "This indicates NetworkPolicy is not being enforced or docs were pre-cached"
              kubectl logs -n $ns -l app=fern-docs --tail=50 || true
              TEST_RESULTS="${TEST_RESULTS}$ns: UNEXPECTED PASS (should have failed)\n"
              FAILED=true
            elif [ "$FOUND_EXPECTED_ERROR" = "true" ]; then
              echo "SUCCESS: $ns passed - found expected network/buf errors (test correctly failed)"
              TEST_RESULTS="${TEST_RESULTS}$ns: PASS (correctly failed with expected errors)\n"
            else
              echo "SUCCESS: $ns passed - pod correctly failed to become ready (network blocked)"
              TEST_RESULTS="${TEST_RESULTS}$ns: PASS (correctly failed)\n"
            fi
          done
          
          # ============================================================
          # AIRGAPPED PAGE RENDERING TEST
          # Verify that docs pages render without hanging in air-gapped mode.
          # This catches regressions where rendering-path code makes outbound
          # HTTPS calls that would block forever when egress is denied.
          # We curl from OUTSIDE the pod (via port-forward) with a strict
          # timeout so a hung render fails the test instead of hanging CI.
          # ============================================================
          echo ""
          echo "=========================================="
          echo "Airgapped page rendering test (external curl)"
          echo "=========================================="
          
          for ns in cached-deps-airgapped full-gen-airgapped; do
            desc="${PASS_TESTS[$ns]}"
            POD_NAME=$(kubectl get pods -n $ns -l app=fern-docs -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            
            if [ -z "$POD_NAME" ]; then
              echo "$ns - SKIP: no pod found"
              continue
            fi
            
            # Pick a random local port to avoid collisions between namespaces
            LOCAL_PORT=$((10000 + RANDOM % 50000))
            
            echo "$ns - Port-forwarding $POD_NAME:3000 to localhost:$LOCAL_PORT..."
            kubectl port-forward -n $ns $POD_NAME $LOCAL_PORT:3000 &
            PF_PID=$!
            sleep 3
            
            RENDER_OK=false
            for attempt in {1..3}; do
              echo "$ns - External curl attempt $attempt/3 (max 30s timeout)..."
              HTTP_CODE=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "http://localhost:$LOCAL_PORT/" 2>/dev/null || echo "000")
              echo "$ns - HTTP status: $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "307" ]; then
                RENDER_OK=true
                break
              fi
              sleep 2
            done
            
            # Clean up port-forward
            kill $PF_PID 2>/dev/null || true
            wait $PF_PID 2>/dev/null || true
            
            if [ "$RENDER_OK" = "true" ]; then
              echo "SUCCESS: $ns - page rendered from outside within timeout"
              TEST_RESULTS="${TEST_RESULTS}$ns-external-render: PASS\n"
            else
              echo "FAILURE: $ns - page did not render within 30s timeout (possible outbound call hang)"
              echo "$ns - Checking for stuck outbound connections..."
              kubectl exec -n $ns $POD_NAME -- sh -c 'cat /proc/net/tcp 2>/dev/null | head -40' || true
              kubectl logs -n $ns -l app=fern-docs --tail=50 2>/dev/null || true
              TEST_RESULTS="${TEST_RESULTS}$ns-external-render: FAIL (render timeout - likely blocked outbound calls)\n"
              FAILED=true
            fi
          done
          
          echo ""
          echo "=========================================="
          echo "TEST RESULTS SUMMARY"
          echo "=========================================="
          echo -e "$TEST_RESULTS"
          
          if [ "$FAILED" = "true" ]; then
            echo "Some tests that should have passed did not pass!"
            exit 1
          fi
          
          echo "All expected-to-pass tests passed!"

      - name: Configure AWS credentials for ECR push
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1

      - name: Push PR preview image to ECR
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          AWS_ACCOUNT_ID: "985111089818"
          AWS_REGION: "us-east-1"
        run: |
          # Login to ECR
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
          
          # Create ECR repository if it doesn't exist
          aws ecr describe-repositories --repository-names smoke-test --region $AWS_REGION 2>/dev/null || \
            aws ecr create-repository --repository-name smoke-test --region $AWS_REGION
          
          # Tag and push the full-gen image (same as KIND tests use) with a PR-specific tag
          # The full-gen image has pre-generated docs and proper /data directory permissions
          PR_IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/smoke-test:pr-${PR_NUMBER}-${PR_SHA}"
          
          echo "Tagging full-gen image as PR preview image: $PR_IMAGE"
          docker tag fern-test-full-gen:latest $PR_IMAGE
          
          echo "Pushing PR preview image to ECR..."
          docker push $PR_IMAGE
          
          echo "PR preview image pushed successfully: $PR_IMAGE"

      - name: Cleanup
        if: always()
        run: |
          # Fast cleanup - just delete the cluster, no need to gracefully delete namespaces
          kind delete cluster || true

  # ============================================================
  # PR PREVIEW CLEANUP
  # Delete the PR namespace when PR is closed or merged
  # ============================================================
  cleanup-pr-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      NAMESPACE: self-hosted-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Delete PR namespace
        run: |
          echo "Deleting namespace ${{ env.NAMESPACE }}..."
          if kubectl get namespace ${{ env.NAMESPACE }} 2>/dev/null; then
            kubectl delete namespace ${{ env.NAMESPACE }} --timeout=120s || echo "Namespace deletion timed out, it will be cleaned up eventually"
            echo "Namespace ${{ env.NAMESPACE }} deleted"
          else
            echo "Namespace ${{ env.NAMESPACE }} does not exist, nothing to clean up"
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const namespace = '${{ env.NAMESPACE }}';
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Self-Hosted PR Preview Cleaned Up\n\nThe preview namespace \`${namespace}\` has been deleted.`
            });
