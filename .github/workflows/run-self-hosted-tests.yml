name: Run self-hosted tests

on:
  push:
    branches:
      - app
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

jobs:
  run-self-hosted-tests:
    runs-on: Seed
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history to detect changes

      - name: Detect changed files
        id: detect_changes
        run: |
          # For workflow_call (releases), always run all tests
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "run_all_tests=true" >> $GITHUB_OUTPUT
            echo "Release workflow detected - will run all tests"
            exit 0
          fi

          # For pushes to app branch, compare with previous commit
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.sha }}"
          # For pull requests, compare with base branch
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
          else
            # Default to running all tests for unknown event types
            echo "run_all_tests=true" >> $GITHUB_OUTPUT
            echo "Unknown event type - will run all tests"
            exit 0
          fi

          # Check if BASE_REF is the null SHA (happens on first push to a new branch or force-push)
          # or if the commit is unreachable (e.g., after force-push where old commit was garbage collected)
          if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "run_all_tests=true" >> $GITHUB_OUTPUT
            echo "BASE_REF is null SHA (new branch or force-push) - will run all tests"
            exit 0
          fi

          if ! git rev-parse --verify "$BASE_REF^{commit}" >/dev/null 2>&1; then
            echo "run_all_tests=true" >> $GITHUB_OUTPUT
            echo "BASE_REF commit is unreachable - will run all tests"
            exit 0
          fi

          # Check if servers/self-hosted has changes
          CHANGED_FILES=$(git diff --name-only "$BASE_REF" "$HEAD_REF")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q "^servers/self-hosted/"; then
            echo "run_all_tests=true" >> $GITHUB_OUTPUT
            echo "Changes detected in servers/self-hosted - will run all tests"
          else
            echo "run_all_tests=false" >> $GITHUB_OUTPUT
            echo "No changes in servers/self-hosted - will run single test"
          fi

      - name: Update Engines
        run: |
          node -e 'const fs = require("fs"); const pkg = require("./package.json"); console.log("Before modification:", JSON.stringify(pkg.engines, null, 2)); pkg.engines.node = ">=20.0.0"; pkg.engines.pnpm = "10.11.0"; pkg.packageManager = "pnpm@10.11.0"; console.log("After modification:", JSON.stringify(pkg.engines, null, 2)); fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));'

      - name: Install
        uses: ./.github/actions/install

      - name: Compile and build
        run: pnpm turbo compile codegen build
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}

      - name: Build FDR CJS
        run: pnpm --filter @fern-platform/fdr build:tsup:cjs

      - name: Build docs bundle
        run: pnpm docs:self-hosted-bundle:build

      - name: Run all self-hosted tests
        if: steps.detect_changes.outputs.run_all_tests == 'true'
        run: pnpm turbo build test:self-hosted --filter=@fern-platform/self-hosted

      - name: Run single self-hosted test (singleNode only)
        if: steps.detect_changes.outputs.run_all_tests == 'false'
        run: pnpm --filter=@fern-platform/self-hosted exec -- vitest src/__test__/singleNode.test.ts --globals --config src/__test__/vitest.config.ts
