name: Deploy Storybook

on:
  pull_request:
    paths:
      - "packages/fern-dashboard/**"
      - "packages/fern-dashboard-storybook/**"
      - ".github/workflows/deploy-storybook.yml"
  push:
    branches:
      - app
    paths:
      - "packages/fern-dashboard/**"
      - "packages/fern-dashboard-storybook/**"
      - ".github/workflows/deploy-storybook.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

env:
  VERCEL_ORG_ID: team_6FKOM5nw037hv8g2mTk3gaH7
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STORYBOOK_PROJECT_ID }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      has_project_id: ${{ steps.check.outputs.has_project_id }}
    steps:
      - name: Check for Vercel Storybook project ID
        id: check
        run: |
          if [ -n "${{ secrets.VERCEL_STORYBOOK_PROJECT_ID }}" ]; then
            echo "has_project_id=true" >> $GITHUB_OUTPUT
          else
            echo "has_project_id=false" >> $GITHUB_OUTPUT
            echo "VERCEL_STORYBOOK_PROJECT_ID secret is not set — skipping deployment."
          fi

  deploy-preview:
    needs: check-config
    if: github.event_name == 'pull_request' && needs.check-config.outputs.has_project_id == 'true'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Install Vercel CLI
        run: |
          for i in 1 2 3; do
            npm install --global vercel@latest && exit 0
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All attempts failed"
          exit 1

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }})
          echo "VERCEL_DEPLOYMENT_URL=$url" >> $GITHUB_OUTPUT

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = '${{ steps.deploy.outputs.VERCEL_DEPLOYMENT_URL }}';
            const body = `## Storybook Preview\n\n**Preview URL:** ${url}\n\nThis preview was deployed from commit ${{ github.event.pull_request.head.sha }}.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Storybook Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }

  deploy-production:
    needs: check-config
    if: github.event_name == 'push' && needs.check-config.outputs.has_project_id == 'true'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Install Vercel CLI
        run: |
          for i in 1 2 3; do
            npm install --global vercel@latest && exit 0
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All attempts failed"
          exit 1

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "VERCEL_DEPLOYMENT_URL=$url" >> $GITHUB_OUTPUT
