name: CI

on:
  pull_request:
  push:
    branches:
      - app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
  WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
  WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}

jobs:
  check-platform-changes:
    runs-on: ubuntu-latest
    outputs:
      platform_changed: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            platform:
              - '!servers/fai/**'
              - '!servers/fai-lambda/**'
              - '!servers/fai-lambda-deploy/**'
              - '!fern/apis/fai/**'

  check:
    needs: check-platform-changes
    if: needs.check-platform-changes.outputs.platform_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # This helps turbo resolve changes faster

      - name: Install
        uses: ./.github/actions/install

      - name: Compile and build
        run: pnpm turbo compile codegen build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
      - name: Compile Template Resolver
        run: pnpm --filter=@fern-api/template-resolver compile:cjs

      - name: Check dependencies
        run: pnpm check:knip

      - name: Check dependency deduplication
        run: pnpm dedupe --check

      - name: Check esbuild version
        run: bash scripts/check-esbuild-version.sh

      - name: Format YAML
        run: pnpm format:yaml:check

  lint:
    needs: check-platform-changes
    if: needs.check-platform-changes.outputs.platform_changed == 'true'
    runs-on: CLI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # This helps turbo resolve changes faster

      - name: Install
        uses: ./.github/actions/install

      - name: Lint style
        run: pnpm lint:style

      - name: biome
        run: pnpm check

  test:
    needs: check-platform-changes
    if: needs.check-platform-changes.outputs.platform_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # This helps turbo resolve changes faster

      - name: Install
        uses: ./.github/actions/install

      - name: Run tests (excluding slow packages)
        run: pnpm turbo test --filter='!@fern-docs/search-keyword' --filter='!@fern-api/fdr-sdk' --filter='!@fern-docs/bundle'
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('servers/fdr/docker-compose.test.yml') }}

      - name: Pre-pull Docker images
        run: |
          docker pull postgres:10.3 &
          docker pull adobe/s3mock &
          docker pull redis &
          wait

      - name: Run tests against local FDR
        run: pnpm turbo test:local --filter=@fern-platform/fdr
        env:
          CI: true

  test-slow:
    needs: check-platform-changes
    if: needs.check-platform-changes.outputs.platform_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # This helps turbo resolve changes faster

      - name: Install
        uses: ./.github/actions/install

      - name: Compile and build dependencies
        run: pnpm turbo compile build --filter=@fern-docs/search-keyword... --filter=@fern-api/fdr-sdk... --filter=@fern-docs/bundle...
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Run slow tests
        run: pnpm turbo test --filter=@fern-docs/search-keyword --filter=@fern-api/fdr-sdk --filter=@fern-docs/bundle --concurrency=1
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144

  typecheck:
    needs: check-platform-changes
    if: needs.check-platform-changes.outputs.platform_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: TypeScript type check
        run: pnpm turbo check-types
        env:
          NODE_OPTIONS: --max-old-space-size=8192

