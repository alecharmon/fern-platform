name: Fern Dev Tests

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Test suite to run (blank = all)"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Fern Dev

    steps:
      - uses: actions/checkout@v5

      - name: Configure git credentials for cross-repo cloning
        run: |
          git config --global url."https://x-access-token:${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: fern-dev-tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: fern-dev-tests
        run: npx playwright install chromium

      - name: Run tests
        id: tests
        working-directory: fern-dev-tests
        run: npx playwright test ${{ inputs.test_suite && format('tests/{0}', inputs.test_suite) || '' }}
        continue-on-error: true
        env:
          FERN_TOKEN: ${{ secrets.FERN_DEV_ORG_TESTING_TOKEN }}
          TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
          DEV_SMOKE_TEST_FERN_TOKEN: ${{ secrets.DEV_SMOKE_TEST_FERN_TOKEN }}
          FAI_DEV_ENDPOINT_TOKEN: ${{ secrets.FAI_DEV_ENDPOINT_TOKEN }}

      - name: Parse test results
        id: test-results
        if: steps.tests.outcome == 'failure'
        working-directory: fern-dev-tests
        run: |
          if [ ! -f test-results.json ]; then
            echo "summary=Could not parse test results" >> $GITHUB_OUTPUT
            exit 0
          fi
          TOTAL=$(jq '.stats.expected + .stats.unexpected + .stats.flaky + .stats.skipped' test-results.json)
          FAILED=$(jq '.stats.unexpected' test-results.json)
          PASSED=$(jq '.stats.expected' test-results.json)
          SKIPPED=$(jq '.stats.skipped' test-results.json)
          FAILED_NAMES=$(jq -r '[.suites[].suites[]?.specs[]? | select(.ok == false) | .title] + [.suites[].specs[]? | select(.ok == false) | .title] | unique | .[]' test-results.json 2>/dev/null || echo "")
          if [ -z "$FAILED_NAMES" ]; then
            FAILED_NAMES=$(jq -r '.. | objects | select(.ok == false and .title != null) | .title' test-results.json 2>/dev/null | sort -u || echo "")
          fi
          SUMMARY="$FAILED/$TOTAL tests failed ($PASSED passed, $SKIPPED skipped)"
          if [ -n "$FAILED_NAMES" ]; then
            BULLET_LIST=$(echo "$FAILED_NAMES" | head -20 | while IFS= read -r name; do printf '\\n  \u2022 %s' "$name"; done)
            SUMMARY="${SUMMARY}\n\nFailed tests:${BULLET_LIST}"
          fi
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Upload diffs on failure
        uses: actions/upload-artifact@v5
        if: steps.tests.outcome == 'failure'
        with:
          name: visual-diffs
          path: fern-dev-tests/diffs
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: steps.tests.outcome == 'failure'
        with:
          name: playwright-report
          path: fern-dev-tests/playwright-report/
          retention-days: 7

      # Re-run failed tests with UPDATE_BASELINES to regenerate drifted baselines
      - name: Update baselines if tests failed
        if: steps.tests.outcome == 'failure'
        working-directory: fern-dev-tests
        run: UPDATE_BASELINES=true npx playwright test || true

      # Detect new baselines (from first-time tests) and changed baselines (from regressions)
      - name: Check for new or changed baselines
        id: baselines-changed
        run: |
          NEW_BASELINES=$(git ls-files --others --exclude-standard fern-dev-tests/baselines/)
          CHANGED_BASELINES=$(git diff --name-only fern-dev-tests/baselines/)

          if [ -n "$NEW_BASELINES" ]; then
            echo "New baselines detected:"
            echo "$NEW_BASELINES"
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$CHANGED_BASELINES" ]; then
            echo "Changed baselines detected:"
            echo "$CHANGED_BASELINES"
            echo "has_changed=true" >> $GITHUB_OUTPUT
          else
            echo "has_changed=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$NEW_BASELINES" ] || [ -n "$CHANGED_BASELINES" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR with new or updated baselines
        id: create-pr
        if: steps.baselines-changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(ci): update visual regression baselines"
          title: "chore(ci): update visual regression baselines"
          body: |
            Visual regression baselines have changed or new baselines were created.

            ${{ steps.baselines-changed.outputs.has_new == 'true' && '**New baselines** were added for tests that had no existing baseline.' || '' }}
            ${{ steps.baselines-changed.outputs.has_changed == 'true' && '**Existing baselines** were updated due to visual changes.' || '' }}

            **Review the screenshots** to determine if these changes are expected.
            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            - **Merge** if the visual changes are intentional (e.g., after a redesign, feature update, or new test)
            - **Close** and investigate if the changes indicate a regression
          branch: chore/update-visual-baselines
          delete-branch: true
          add-paths: fern-dev-tests/baselines/

      - name: Notify #docs-notifs on failure
        if: steps.tests.outcome == 'failure'
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "*Fern Dev Tests failed*\n\n${{ steps.test-results.outputs.summary }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>${{ steps.create-pr.outputs.pull-request-url && format('\n<{0}|Review baseline update PR>', steps.create-pr.outputs.pull-request-url) || '' }}"
            }

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
