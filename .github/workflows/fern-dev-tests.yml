name: Fern Dev Tests

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Test suite to run (blank = all)"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Fern Dev

    steps:
      - uses: actions/checkout@v6

      - name: Configure git credentials for cross-repo cloning
        run: |
          git config --global url."https://x-access-token:${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: fern-dev-tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: fern-dev-tests
        run: npx playwright install chromium

      - name: Run tests
        id: tests
        working-directory: fern-dev-tests
        run: npx playwright test ${{ inputs.test_suite && format('tests/{0}', inputs.test_suite) || '' }}
        continue-on-error: true
        env:
          FERN_TOKEN: ${{ secrets.FERN_DEV_ORG_TESTING_TOKEN }}
          TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
          DEV_SMOKE_TEST_FERN_TOKEN: ${{ secrets.DEV_SMOKE_TEST_FERN_TOKEN }}
          FAI_DEV_ENDPOINT_TOKEN: ${{ secrets.FAI_DEV_ENDPOINT_TOKEN }}

      - name: Retry failed tests after delay
        id: retry
        if: steps.tests.outcome == 'failure'
        working-directory: fern-dev-tests
        run: |
          echo "Tests failed. Retrying failed tests after a short delay..."
          cp test-results.json test-results-full.json || true
          sleep 60
          npx playwright test --last-failed || { cp test-results-full.json test-results.json 2>/dev/null || true; exit 1; }
        continue-on-error: true
        env:
          FERN_TOKEN: ${{ secrets.FERN_DEV_ORG_TESTING_TOKEN }}
          TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
          DEV_SMOKE_TEST_FERN_TOKEN: ${{ secrets.DEV_SMOKE_TEST_FERN_TOKEN }}
          FAI_DEV_ENDPOINT_TOKEN: ${{ secrets.FAI_DEV_ENDPOINT_TOKEN }}

      - name: Check results against allowed-failures sheet
        id: check-results
        if: steps.tests.outcome == 'failure' && steps.retry.outcome != 'success'
        working-directory: fern-dev-tests
        run: npx tsx utils/check-results.ts
        continue-on-error: true
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_KEY: ${{ secrets.FERN_DEV_TESTS_SHEETS_API_JSON }}

      - name: Upload diffs on failure
        uses: actions/upload-artifact@v6
        if: steps.tests.outcome == 'failure' && steps.retry.outcome != 'success'
        with:
          name: visual-diffs
          path: fern-dev-tests/diffs
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: steps.tests.outcome == 'failure' && steps.retry.outcome != 'success'
        with:
          name: playwright-report
          path: fern-dev-tests/playwright-report/
          retention-days: 7

      # Re-run failed tests with UPDATE_BASELINES to regenerate drifted baselines
      - name: Update baselines if tests failed
        if: steps.tests.outcome == 'failure' && steps.retry.outcome != 'success'
        working-directory: fern-dev-tests
        run: UPDATE_BASELINES=true npx playwright test --last-failed || true

      # Detect new baselines (from first-time tests) and changed baselines (from regressions)
      - name: Check for new or changed baselines
        id: baselines-changed
        run: |
          NEW_BASELINES=$(git ls-files --others --exclude-standard fern-dev-tests/baselines/)
          CHANGED_BASELINES=$(git diff --name-only fern-dev-tests/baselines/)

          if [ -n "$NEW_BASELINES" ]; then
            echo "New baselines detected:"
            echo "$NEW_BASELINES"
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$CHANGED_BASELINES" ]; then
            echo "Changed baselines detected:"
            echo "$CHANGED_BASELINES"
            echo "has_changed=true" >> $GITHUB_OUTPUT
          else
            echo "has_changed=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$NEW_BASELINES" ] || [ -n "$CHANGED_BASELINES" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR with new or updated baselines
        id: create-pr
        if: steps.baselines-changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(ci): update visual regression baselines [skip ci]"
          title: "chore(ci): update visual regression baselines"
          body: |
            Visual regression baselines have changed or new baselines were created.

            ${{ steps.baselines-changed.outputs.has_new == 'true' && '**New baselines** were added for tests that had no existing baseline.' || '' }}
            ${{ steps.baselines-changed.outputs.has_changed == 'true' && '**Existing baselines** were updated due to visual changes.' || '' }}

            **Review the screenshots** to determine if these changes are expected.
            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            - **Merge** if the visual changes are intentional (e.g., after a redesign, feature update, or new test)
            - **Close** and investigate if the changes indicate a regression
          branch: chore/update-visual-baselines
          delete-branch: true
          add-paths: fern-dev-tests/baselines/

      - name: Notify #docs-notifs on hard failure
        if: steps.check-results.outcome == 'failure'
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "*Fern Dev Tests failed*\n\n${{ steps.check-results.outputs.summary }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>${{ steps.create-pr.outputs.pull-request-url && format('\n<{0}|Review baseline update PR>', steps.create-pr.outputs.pull-request-url) || '' }}\n<${{ steps.check-results.outputs.sheet_url }}|Update allowed failures>"
            }

      - name: Notify #docs-notifs on soft failure (pass)
        if: steps.check-results.outputs.outcome == 'soft_failure'
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "*Fern Dev Tests passed*\n\n${{ steps.check-results.outputs.summary }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>\n<${{ steps.check-results.outputs.sheet_url }}|Update allowed failures>"
            }

      - name: Notify #docs-notifs on new baselines
        if: steps.baselines-changed.outputs.changed == 'true' && !(steps.tests.outcome == 'failure' && steps.retry.outcome != 'success')
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "*Fern Dev Tests: New baseline detected*\n\n${{ steps.baselines-changed.outputs.has_new == 'true' && 'New baselines were added for tests with no existing baseline.' || 'Existing baselines were updated due to visual changes.' }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>${{ steps.create-pr.outputs.pull-request-url && format('\n<{0}|Review baseline update PR>', steps.create-pr.outputs.pull-request-url) || '' }}"
            }

      - name: Fail if hard failures
        if: steps.check-results.outcome == 'failure'
        run: exit 1
