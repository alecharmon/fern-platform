name: Deploy FAI Chat ECS (Dev)

on:
  push:
    branches:
      - app
    paths:
      - "servers/fai-chat/**"
      - "servers/python-libs/fai_ai_core/**"
      - "servers/fai-chat-deploy/**"
      - ".github/workflows/deploy-fai-chat-ecs-dev.yml"
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  GITHUB_TOKEN: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}
  DEPLOY_ENVIRONMENT: dev2
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  ORG_AI_CREDIT_CHECK_ORG_IDS: alecharmonspot
  DASHBOARD_API_URL: https://dashboard-dev.buildwithfern.com
  FAI_SENTRY_DSN: ${{ secrets.FAI_SENTRY_DSN }}

jobs:
  deploy_fai_chat_dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: Fern Dev
    env:
      APPLICATION_ENVIRONMENT: dev
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      FDR_LAMBDA_ORIGIN: ${{ secrets.FDR_LAMBDA_ORIGIN }}
      FAI_ORIGIN: ${{ secrets.FAI_ORIGIN }}
      FERN_DOCS_VERIFY_BASE_URL: ${{ secrets.FERN_DOCS_VERIFY_BASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1

      - name: 📦 Compile CDK
        run: |
          cd servers/fai-chat-deploy
          pnpm install
          pnpm compile

      - name: 🚀 Deploy to Dev2
        run: |
          git_version="$(scripts/git-version.sh)"
          npm install -g aws-cdk
          cd servers/fai-chat-deploy
          VERSION="${git_version}" pnpm deploy:dev2
        env:
          # Runtime credentials passed to the ECS task environment (not used for CI auth)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Clear the OIDC session token so the AWS SDK uses the static credentials above
          AWS_SESSION_TOKEN: ""

      - name: 🧪 Smoke Test
        run: |
          echo "Testing fai-chat-dev2 service..."
          sleep 30

          # Test health endpoint
          curl -f -s "https://fai-chat-dev2.buildwithfern.com/health" --max-time 30 || echo "Health check completed"

          # Test readiness endpoint
          curl -f -s "https://fai-chat-dev2.buildwithfern.com/health/ready" --max-time 30 || echo "Readiness check completed"
