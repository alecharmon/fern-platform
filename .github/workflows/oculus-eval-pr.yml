name: Oculus Eval on PR

on:
  pull_request:
    types: [opened]
    paths:
      - 'packages/fern-docs/search-server/ask-fern/**'
      - 'pnpm-lock.yaml'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test against'
        required: true
        type: number

concurrency:
  group: oculus-eval-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_6FKOM5nw037hv8g2mTk3gaH7
  VERCEL_PROJECT_ID: prj_XXWllSgR38im0A8e0cKXjOnMoo07

jobs:
  run-eval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: read
      deployments: read

    steps:
      - name: Evaluate if workflow should run
        id: eval_gate
        uses: actions/github-script@v8
        with:
          script: |
            let prNumber, prSha, shouldRun = false;

            // For pull_request events, path filter already applied, so always run
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              prSha = context.payload.pull_request.head.sha;
              shouldRun = true;
              console.log('Triggered by pull_request event with path filter. Running eval.');
            } 
            // For issue_comment events, check if comment contains "/run evals"
            else if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment.body.toLowerCase().trim();
              const isPR = !!context.payload.issue.pull_request;

              if (!isPR) {
                console.log('Comment is on an issue, not a PR. Skipping.');
              } else if (!comment.includes('/run evals')) {
                console.log('Comment does not contain "/run evals". Skipping.');
              } else {
                prNumber = context.payload.issue.number;
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });
                prSha = pr.head.sha;
                shouldRun = true;
                console.log('Comment contains "/run evals" on a PR. Running eval.');
                
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: 'rocket'
                });
              }
            }
            // For workflow_dispatch events, always run
            else if (context.eventName === 'workflow_dispatch') {
              prNumber = parseInt('${{ github.event.inputs.pr_number }}');
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              prSha = pr.head.sha;
              shouldRun = true;
              console.log('Manually triggered via workflow_dispatch. Running eval.');
            } else {
              throw new Error('Unsupported event type');
            }

            core.setOutput('should_run', shouldRun ? 'true' : 'false');
            core.setOutput('number', prNumber || '');
            core.setOutput('sha', prSha || '');
            console.log(`PR #${prNumber}, SHA: ${prSha}, should_run: ${shouldRun}`);

      - name: Checkout code
        if: ${{ steps.eval_gate.outputs.should_run == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.eval_gate.outputs.sha }}

      - name: Wait for prod.ferndocs.com Deployment
        if: ${{ steps.eval_gate.outputs.should_run == 'true' }}
        id: vercel-preview
        uses: actions/github-script@v8
        with:
          script: |
            const maxAttempts = 60;
            const delayMs = 10000;
            const prNumber = parseInt('${{ steps.eval_gate.outputs.number }}');

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              console.log(`Attempt ${attempt}/${maxAttempts}: Checking for prod.ferndocs.com deployment...`);

              // Check the Vercel bot comment to detect skipped/ignored deployments
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });

              const vercelComment = comments.find(comment =>
                comment.user.login === 'vercel[bot]' &&
                comment.body.includes('prod.ferndocs.com')
              );

              if (vercelComment) {
                const lines = vercelComment.body.split('\n');
                for (const line of lines) {
                  if (line.includes('prod.ferndocs.com') && (line.includes('Skipped') || line.includes('Ignored'))) {
                    console.log('prod.ferndocs.com deployment was skipped/ignored by Vercel');
                    core.setOutput('url', '');
                    return;
                  }
                }
              }

              // Check GitHub Deployments API
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: '${{ steps.eval_gate.outputs.sha }}',
                per_page: 100
              });

              console.log(`Found ${deployments.length} deployment(s) for SHA ${{ steps.eval_gate.outputs.sha }}`);

              // Log all environments for debugging
              if (deployments.length > 0) {
                console.log('Deployment environments:');
                deployments.forEach(d => console.log(`  - ${d.environment} (ID: ${d.id})`));
              }

              // Look for prod.ferndocs.com deployment
              const prodDeployment = deployments.find(d =>
                d.environment && (
                  d.environment === 'Production – prod.ferndocs.com' ||
                  d.environment === 'Preview – prod.ferndocs.com' ||
                  d.environment.includes('prod.ferndocs.com')
                )
              );

              if (prodDeployment) {
                console.log(`Found prod.ferndocs.com deployment (env: ${prodDeployment.environment})`);

                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: prodDeployment.id
                });

                console.log(`Deployment has ${statuses.length} status(es)`);
                if (statuses.length > 0) {
                  console.log(`Latest status: ${statuses[0].state}`);
                }

                const successStatus = statuses.find(s => s.state === 'success');
                if (successStatus && successStatus.environment_url) {
                  const previewUrl = `${successStatus.environment_url}`;
                  console.log(`✓ Deployment ready!`);
                  console.log(`  Base URL: ${successStatus.environment_url}`);
                  console.log(`  Preview URL: ${previewUrl}`);
                  core.setOutput('url', previewUrl);
                  return;
                }

                // Check for failure
                if (statuses.length > 0 && statuses[0].state === 'failure') {
                  throw new Error(`prod.ferndocs.com deployment failed`);
                }
              } else {
                console.log('prod.ferndocs.com deployment not found yet');
              }

              if (attempt < maxAttempts) {
                console.log(`Waiting ${delayMs/1000}s before next check...`);
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }

            throw new Error('Timeout waiting for prod.ferndocs.com deployment after 10 minutes');

      - name: Setup Python
        if: ${{ steps.eval_gate.outputs.should_run == 'true' && steps.vercel-preview.outputs.url != '' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        if: ${{ steps.eval_gate.outputs.should_run == 'true' && steps.vercel-preview.outputs.url != '' }}
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Oculus dependencies
        if: ${{ steps.eval_gate.outputs.should_run == 'true' && steps.vercel-preview.outputs.url != '' }}
        working-directory: servers/oculus
        run: poetry install

      - name: Setup FAI dependencies
        if: ${{ steps.eval_gate.outputs.should_run == 'true' && steps.vercel-preview.outputs.url != '' }}
        working-directory: servers/fai
        run: |
          poetry install
          echo "PYTHONPATH=$PWD/src:$PYTHONPATH" >> $GITHUB_ENV

      - name: Run Oculus evaluation
        if: ${{ steps.eval_gate.outputs.should_run == 'true' && steps.vercel-preview.outputs.url != '' }}
        working-directory: servers/oculus
        env:
          VERCEL_URL: ${{ steps.vercel-preview.outputs.url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OCULUS_INTEGRATION: vercel-http
        run: |
          mkdir -p results
          poetry run oculus run \
            --suite simple \
            --run-id pr-${{ steps.eval_gate.outputs.number }}-${{ github.run_id }} \
            --integration vercel-http \
            --output-dir ./results \
            --github-output

      - name: Upload results artifact
        if: ${{ always() && steps.eval_gate.outputs.should_run == 'true' && steps.vercel-preview.outputs.url != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: oculus-results-pr-${{ steps.eval_gate.outputs.number }}
          path: servers/oculus/results/
          retention-days: 90

      - name: Comment PR with results
        if: ${{ always() && steps.eval_gate.outputs.should_run == 'true' && steps.vercel-preview.outputs.url != '' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultsDir = 'servers/oculus/results';
            const prNumber = parseInt('${{ steps.eval_gate.outputs.number }}');
            const runId = `pr-${prNumber}-${{ github.run_id }}`;
            const summaryPath = path.join(resultsDir, `github_summary_${runId}.md`);

            if (!fs.existsSync(summaryPath)) {
              console.log('No summary file found, skipping comment');
              return;
            }

            let summary = fs.readFileSync(summaryPath, 'utf8');

            const artifactUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            summary = summary.replace(
              'Full results available in workflow artifacts',
              `[View full results in workflow artifacts](${artifactUrl})`
            );

            const vercelUrl = '${{ steps.vercel-preview.outputs.url }}';
            const commentBody = `${summary}\n\n---\n**Tested against:** ${vercelUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🔍 Oculus Evaluation Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
