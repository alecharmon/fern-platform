name: Run Page Stats Job

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  run-page-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run page stats job
        run: |
          echo "Running page stats job..."
          
          response=$(curl -s -w "\n%{http_code}" \
            "https://prod.ferndocs.com/api/fern-docs/run-page-stats-job" \
            --max-time 300)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response code: $http_code"
          echo "Response body: $body"
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Page stats job completed successfully"
          else
            echo "Page stats job failed with status code: $http_code"
            exit 1
          fi
