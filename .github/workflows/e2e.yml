name: Playwright E2E Tests

on:
  schedule:
    # Run every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dashboard_url:
        description: "Dashboard URL to test against (defaults to production)"
        required: false
        type: string
        default: "https://dashboard.buildwithfern.com"

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm --filter=playwright exec playwright install --with-deps chromium

      - name: Run E2E Tests
        run: pnpm test:playwright
        env:
          DASHBOARD_URL: ${{ inputs.dashboard_url || 'https://dashboard.buildwithfern.com' }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: playwright/test-results/
          retention-days: 7
