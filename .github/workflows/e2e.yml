name: Playwright E2E Tests

on:
  workflow_dispatch:
  deployment_status:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment.environment, 'fern-dashboard') &&
       !contains(github.event.deployment.environment, 'Production'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm --filter=playwright exec playwright install

      - name: Print Preview URL
        run: |
          echo "Preview URL: ${{ github.event.deployment_status.target_url || 'Not available (workflow_dispatch)' }}"
          echo "Environment: ${{ github.event.deployment.environment || 'N/A' }}"

      - name: Run E2E Tests
        run: pnpm test:e2e
        env:
          DASHBOARD_URL: ${{ github.event.deployment_status.target_url || '' }}
          FERN_CI_AUTOMATED_TESTING: ${{ secrets.FERN_CI_AUTOMATED_TESTING }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: playwright/test-results/
          retention-days: 7

