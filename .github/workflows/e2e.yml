name: Playwright E2E Tests

on:
  workflow_dispatch:
    inputs:
      dashboard_url:
        description: "Vercel preview URL for fern-dashboard (e.g. https://fern-dashboard-xxx-buildwithfern.vercel.app)"
        required: true
        type: string

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm --filter=playwright exec playwright install

      - name: Print Preview URL
        run: |
          echo "Preview URL: ${{ inputs.dashboard_url || github.event.deployment_status.target_url || 'Not available' }}"
          echo "Environment: ${{ github.event.deployment.environment || 'workflow_dispatch' }}"

      - name: Run E2E Tests
        run: pnpm test:e2e
        env:
          DASHBOARD_URL: ${{ inputs.dashboard_url || github.event.deployment_status.target_url || '' }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: playwright/test-results/
          retention-days: 7

