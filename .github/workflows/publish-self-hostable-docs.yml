name: Publish Self-Hostable Docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match a docs@ release version)"
        required: true
        type: string
  push:
    tags:
      - "docs@*"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

jobs:
  test:
    uses: ./.github/workflows/run-self-hosted-tests.yml

  build-and-publish:
    runs-on: seed
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # This helps turbo resolve changes faster

      - name: Determine version to publish
        id: determine_version
        run: |
          PROVIDED_VERSION="${{ github.event.inputs.version }}"
          GIT_REF="${{ github.ref }}"
          
          if [ -n "$PROVIDED_VERSION" ]; then
            # Manual dispatch with version provided
            echo "Using provided version: $PROVIDED_VERSION"
            echo "version=$PROVIDED_VERSION" >> $GITHUB_OUTPUT
          elif [[ "$GIT_REF" == refs/tags/docs@* ]]; then
            # Triggered by docs@ tag - extract version from tag
            TAG_VERSION="${GIT_REF#refs/tags/docs@}"
            echo "Using version from docs@ tag: $TAG_VERSION"
            echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Version must be provided via workflow_dispatch input or docs@ tag"
            exit 1
          fi

      - name: Update Engines
        run: |
          node -e 'const fs = require("fs"); const pkg = require("./package.json"); console.log("Before modification:", JSON.stringify(pkg.engines, null, 2)); pkg.engines.node = ">=20.0.0"; pkg.engines.pnpm = "10.11.0"; pkg.packageManager = "pnpm@10.11.0"; console.log("After modification:", JSON.stringify(pkg.engines, null, 2)); fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));'

      - name: Install
        uses: ./.github/actions/install

      - name: Compile
        run: pnpm compile

      - name: Build FDR CJS
        run: pnpm --filter @fern-platform/fdr build:tsup:cjs

      - name: Build self-hosted bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm docs:self-hosted-bundle:build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Build and push multi-platform Docker image
        working-directory: servers/self-hosted
        run: |
          VERSION="${{ steps.determine_version.outputs.version }}"
          echo "Building and publishing version: $VERSION for linux/amd64 and linux/arm64"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            -f Dockerfile.self_hosted \
            -t fernapi/fern-self-hosted:$VERSION \
            -t fernenterprise/fern-self-hosted:$VERSION \
            ../..
