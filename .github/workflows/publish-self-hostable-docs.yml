name: Publish Self-Hostable Docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match a docs@ release version)"
        required: true
        type: string
  push:
    tags:
      - "docs@*"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

jobs:
  test:
    uses: ./.github/workflows/run-self-hosted-tests.yml
    with:
      upload_artifact: true
    secrets: inherit

  determine-version:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    outputs:
      version: ${{ steps.determine_version.outputs.version }}
    steps:
      - name: Determine version to publish
        id: determine_version
        run: |
          PROVIDED_VERSION="${{ github.event.inputs.version }}"
          GIT_REF="${{ github.ref }}"
          
          if [ -n "$PROVIDED_VERSION" ]; then
            echo "Using provided version: $PROVIDED_VERSION"
            echo "version=$PROVIDED_VERSION" >> $GITHUB_OUTPUT
          elif [[ "$GIT_REF" == refs/tags/docs@* ]]; then
            TAG_VERSION="${GIT_REF#refs/tags/docs@}"
            echo "Using version from docs@ tag: $TAG_VERSION"
            echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Version must be provided via workflow_dispatch input or docs@ tag"
            exit 1
          fi

  build-docker-amd64:
    runs-on: seed
    needs: [test, determine-version]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download JS bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-bundle

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Build and push amd64 Docker image
        working-directory: servers/self-hosted
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          echo "Building version: $VERSION for linux/amd64 (native)"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --cache-from type=gha,scope=amd64 \
            --cache-to type=gha,mode=max,scope=amd64 \
            --push \
            -f Dockerfile.self_hosted \
            -t fernapi/fern-self-hosted:$VERSION-amd64 \
            -t fernapi/fern-self-hosted:latest-amd64 \
            -t fernenterprise/fern-self-hosted:$VERSION-amd64 \
            -t fernenterprise/fern-self-hosted:latest-amd64 \
            ../..

  build-docker-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [test, determine-version]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download JS bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-bundle

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Build and push arm64 Docker image
        working-directory: servers/self-hosted
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          echo "Building version: $VERSION for linux/arm64 (native)"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from type=gha,scope=arm64 \
            --cache-to type=gha,mode=max,scope=arm64 \
            --push \
            -f Dockerfile.self_hosted \
            -t fernapi/fern-self-hosted:$VERSION-arm64 \
            -t fernapi/fern-self-hosted:latest-arm64 \
            -t fernenterprise/fern-self-hosted:$VERSION-arm64 \
            -t fernenterprise/fern-self-hosted:latest-arm64 \
            ../..

  create-manifest:
    runs-on: ubuntu-latest
    needs: [determine-version, build-docker-amd64, build-docker-arm64]
    timeout-minutes: 10
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Create and push multi-platform manifest
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          echo "Creating multi-platform manifest for version: $VERSION"
          
          docker manifest create fernapi/fern-self-hosted:$VERSION \
            fernapi/fern-self-hosted:$VERSION-amd64 \
            fernapi/fern-self-hosted:$VERSION-arm64
          docker manifest push fernapi/fern-self-hosted:$VERSION
          
          docker manifest create fernapi/fern-self-hosted:latest \
            fernapi/fern-self-hosted:latest-amd64 \
            fernapi/fern-self-hosted:latest-arm64
          docker manifest push fernapi/fern-self-hosted:latest
          
          docker manifest create fernenterprise/fern-self-hosted:$VERSION \
            fernenterprise/fern-self-hosted:$VERSION-amd64 \
            fernenterprise/fern-self-hosted:$VERSION-arm64
          docker manifest push fernenterprise/fern-self-hosted:$VERSION
          
          docker manifest create fernenterprise/fern-self-hosted:latest \
            fernenterprise/fern-self-hosted:latest-amd64 \
            fernenterprise/fern-self-hosted:latest-arm64
          docker manifest push fernenterprise/fern-self-hosted:latest
          
          echo "Successfully published multi-platform images:"
          echo "  - fernapi/fern-self-hosted:$VERSION"
          echo "  - fernapi/fern-self-hosted:latest"
          echo "  - fernenterprise/fern-self-hosted:$VERSION"
          echo "  - fernenterprise/fern-self-hosted:latest"

  deploy-eks-smoke-test:
    needs: [determine-version, create-manifest]
    uses: ./.github/workflows/deploy-eks-smoke-test.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
    secrets: inherit
