name: Deploy FAI Lambda Prod

on:
  push:
    tags:
      - "fai-scribe@*"
      - "fai-code-indexing@*"
      - "fai-chat@*"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
  SCRIBE_GITHUB_TOKEN: ${{ secrets.FAI_SCRIBE_GITHUB_TOKEN }}
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

jobs:
  deploy_fai_scribe_prod:
    runs-on: Seed
    if: github.ref_type == 'tag' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fai-scribe@')
    environment: Fern Prod
    strategy:
      matrix:
        concurrency: [1]
    env:
      APPLICATION_ENVIRONMENT: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🧪 Run Tests
        run: |
          cd servers/fai-lambda/fai-scribe
          poetry install
          poetry run pytest -sv

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 🚀 Deploy to Production
        run: |
          git_version="$(scripts/git-version.sh)"
          npm install -g aws-cdk
          cd servers/fai-lambda-deploy
          VERSION="${git_version}" pnpm --filter=@fern-platform/fai-lambda-deploy deploy:prod:scribe

  deploy_fai_code_indexing_prod:
    runs-on: Seed
    if: github.ref_type == 'tag' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fai-code-indexing@')
    environment: Fern Prod
    strategy:
      matrix:
        concurrency: [1]
    env:
      APPLICATION_ENVIRONMENT: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🧪 Run Tests
        run: |
          cd servers/fai-lambda/fai-code-indexing
          poetry install
          poetry run pytest -sv

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 🚀 Deploy to Production
        run: |
          git_version="$(scripts/git-version.sh)"
          npm install -g aws-cdk
          cd servers/fai-lambda-deploy
          VERSION="${git_version}" pnpm --filter=@fern-platform/fai-lambda-deploy deploy:prod:code-indexing

  deploy_fai_chat_prod:
    runs-on: Seed
    if: github.ref_type == 'tag' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fai-chat@')
    environment: Fern Prod
    strategy:
      matrix:
        concurrency: [1]
    env:
      APPLICATION_ENVIRONMENT: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🧪 Run Tests
        run: |
          cd servers/fai-lambda/fai-chat
          poetry install
          poetry run pytest -sv

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 🚀 Deploy to Production
        run: |
          git_version="$(scripts/git-version.sh)"
          npm install -g aws-cdk
          cd servers/fai-lambda-deploy
          VERSION="${git_version}" pnpm --filter=@fern-platform/fai-lambda-deploy deploy:prod:chat
