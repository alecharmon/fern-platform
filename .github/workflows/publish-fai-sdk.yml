name: Publish FAI SDK

on:
  push:
    tags:
      - "fai-sdk@*"

env:
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
  NPM_TOKEN: ${{ secrets.FERN_NPM_TOKEN }}
  PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

jobs:
  publish_sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: Install Fern
        run: npm install -g fern-api@0.121.2

      - name: Publish FAI SDK
        env:
          NPM_TOKEN: ${{ secrets.FERN_NPM_TOKEN }}
        run: |
          git_version="$(scripts/fai-sdk-version.sh)"
          fern generate --api fai --group public-sdk --version ${git_version}

  publish_java_sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: Install Fern
        run: npm install -g fern-api@0.121.2

      - name: Publish FAI Java SDK
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          git_version="$(scripts/fai-sdk-version.sh)"
          fern generate --api fai --group java-sdk --version ${git_version}

  publish_python_sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: Install Fern
        run: npm install -g fern-api@0.121.2

      - name: Publish FAI Python SDK
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          latest_tag=$(git tag -l "fai-sdk@*" --sort=-v:refname | head -n1)
          python_version="$(echo "$latest_tag" | sed 's/^fai-sdk@//;')"
          fern generate --api fai --group python-sdk --version ${python_version}
