name: Cleanup Merged Branches

on:
  schedule:
    - cron: "0 3 * * *" # Run daily at 3 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (only report, don't delete)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  cleanup-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full clone to see all branches

      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "=== Cleaning up merged branches ==="
          echo "Dry run mode: $DRY_RUN"

          # Protected branches that should never be deleted
          PROTECTED="app main master"

          # Fetch all remote branches
          git fetch --prune origin

          DELETED=0
          SKIPPED=0
          FAILED=0
          TOTAL=0

          # Get branches merged into app (the default branch)
          for BRANCH in $(git branch -r --merged origin/app | sed 's/origin\///' | sed 's/^[[:space:]]*//'); do
            # Skip HEAD pointer
            if [[ "$BRANCH" == *"HEAD"* ]]; then
              continue
            fi

            # Skip protected branches
            SKIP=false
            for P in $PROTECTED; do
              if [[ "$BRANCH" == "$P" ]]; then
                SKIP=true
                break
              fi
            done
            if [[ "$SKIP" == "true" ]]; then
              continue
            fi

            TOTAL=$((TOTAL + 1))

            # Check if branch has an open PR
            OPEN_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')
            if [[ "$OPEN_PR" -gt 0 ]]; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[DRY RUN] Would delete: $BRANCH"
              DELETED=$((DELETED + 1))
            else
              if git push origin --delete "$BRANCH" 2>/dev/null; then
                echo "Deleted: $BRANCH"
                DELETED=$((DELETED + 1))
              else
                echo "Failed to delete: $BRANCH"
                FAILED=$((FAILED + 1))
              fi
            fi

            # Rate limit: pause briefly every 50 deletions
            if [[ $((DELETED % 50)) -eq 0 ]] && [[ "$DELETED" -gt 0 ]]; then
              echo "Pausing briefly to avoid rate limits..."
              sleep 5
            fi
          done

          echo ""
          echo "=== Summary ==="
          echo "Total merged branches found: $TOTAL"
          echo "Branches deleted: $DELETED"
          echo "Branches skipped (open PR): $SKIPPED"
          echo "Branches failed: $FAILED"
