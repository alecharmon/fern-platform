name: Deploy Dashboard Infrastructure Dev

on:
  push:
    branches:
      - app
    paths:
      - "servers/dashboard-deploy/**"
      - ".github/workflows/deploy-dashboard-infrastructure-dev.yml"
      - "pnpm-lock.yaml"
  pull_request:
    branches:
      - app
    paths:
      - "servers/dashboard-deploy/**"
      - ".github/workflows/deploy-dashboard-infrastructure-dev.yml"
      - "pnpm-lock.yaml"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}

jobs:
  deploy_dev:
    runs-on: ubuntu-latest
    environment: Fern Dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 🚀 cdk deploy
        run: |
          npm install -g aws-cdk
          cd servers/dashboard-deploy
          pnpm --filter=@fern-platform/dashboard-deploy deploy:dev
