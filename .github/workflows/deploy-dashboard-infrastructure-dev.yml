name: Deploy Dashboard Infrastructure Dev

on:
  push:
    branches:
      - app
    paths:
      - "servers/dashboard-deploy/**"
      - ".github/workflows/deploy-dashboard-infrastructure-dev.yml"
      - "pnpm-lock.yaml"
  pull_request:
    branches:
      - app
    paths:
      - "servers/dashboard-deploy/**"
      - ".github/workflows/deploy-dashboard-infrastructure-dev.yml"
      - "pnpm-lock.yaml"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}

jobs:
  deploy_dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: Fern Dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📥 Install
        uses: ./.github/actions/install

      - name: 💻 Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1

      - name: 🚀 cdk deploy
        run: |
          npm install -g aws-cdk
          cd servers/dashboard-deploy
          pnpm --filter=@fern-platform/dashboard-deploy deploy:dev
