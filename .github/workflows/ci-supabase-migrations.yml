name: Supabase Migration Check

on:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

jobs:
  check-supabase-changes:
    runs-on: ubuntu-latest
    outputs:
      supabase_changed: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            supabase:
              - 'packages/commons/supabase-client/supabase/migrations/**'
              - 'packages/commons/supabase-client/supabase/config.toml'

  check-prod-drift:
    needs: check-supabase-changes
    if: needs.check-supabase-changes.outputs.supabase_changed == 'true'
    name: Check for unapplied migrations (prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/commons/supabase-client
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to prod project
        run: supabase link --project-ref mygothwbccfcegfpjtoh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check for pending migrations
        id: dry-run
        run: |
          OUTPUT=$(supabase db push --dry-run 2>&1) || true
          echo "$OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if echo "$OUTPUT" | grep -q "Would push these migrations"; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Report pending migrations
        if: steps.dry-run.outputs.has_pending == 'true'
        run: |
          echo "::warning::There are unapplied migrations on prod. Apply them manually before merging."
          echo ""
          echo "Pending migrations:"
          echo "${{ steps.dry-run.outputs.output }}"
          echo ""
          echo "Run: pnpm --filter=@fern-platform/supabase db:push:prod"
          exit 1

  check-dev-drift:
    needs: check-supabase-changes
    if: needs.check-supabase-changes.outputs.supabase_changed == 'true'
    name: Check for unapplied migrations (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/commons/supabase-client
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to dev project
        run: supabase link --project-ref hpgcvygnvocaluwunkwi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check for pending migrations
        id: dry-run
        run: |
          OUTPUT=$(supabase db push --dry-run 2>&1) || true
          echo "$OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if echo "$OUTPUT" | grep -q "Would push these migrations"; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Report pending migrations
        if: steps.dry-run.outputs.has_pending == 'true'
        run: |
          echo "::warning::There are unapplied migrations on dev. Apply them manually before merging."
          echo ""
          echo "Pending migrations:"
          echo "${{ steps.dry-run.outputs.output }}"
          echo ""
          echo "Run: pnpm --filter=@fern-platform/supabase db:push:dev"
          exit 1

