name: Deploy FDR Cpp Library Docs Parser Prod

on:
  push:
    tags:
      - "fdr-cpp-library-docs-parser@*"

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  GITHUB_TOKEN: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}

jobs:
  deploy_prod:
    if: github.ref_type == 'tag' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fdr-cpp-library-docs-parser@')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: Fern Prod
    env:
      APPLICATION_ENVIRONMENT: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/actions/install

      - name: Verify Docker build
        run: |
          cd servers/fdr-cpp-library-docs-parser
          docker build -t fdr-cpp-library-docs-parser:test .

      - name: Run Tests
        run: |
          cd servers/fdr-cpp-library-docs-parser
          # Install Poetry and dependencies
          pip install poetry
          poetry install --with dev 2>/dev/null || poetry install
          # Run tests if they exist
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            poetry run pytest -v
          else
            echo "No tests found, skipping..."
          fi

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1

      - name: Deploy to Production
        run: |
          git_version="$(git rev-parse --short HEAD)"
          npm install -g aws-cdk
          cd servers/fdr-cpp-library-docs-parser-deploy
          VERSION="${git_version}" pnpm deploy:prod
