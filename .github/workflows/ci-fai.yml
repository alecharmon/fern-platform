name: FAI CI

on:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

jobs:
  check-fai-changes:
    runs-on: ubuntu-latest
    outputs:
      fai_changed: ${{ steps.filter.outputs.fai }}
      fai_chat_changed: ${{ steps.filter.outputs.fai_chat }}
      fai_reindexing_changed: ${{ steps.filter.outputs.fai_reindexing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fai:
              - 'servers/fai/**'
              - 'servers/fai-lambda/**'
              - 'servers/fai-lambda-deploy/**'
              - 'fern/apis/fai/**'
              - '.github/workflows/ci-fai.yml'
            fai_chat:
              - 'servers/fai-chat/**'
              - 'servers/python-libs/fai_ai_core/**'
              - '.github/workflows/ci-fai.yml'
            fai_reindexing:
              - 'servers/fai-reindexing/**'
              - '.github/workflows/ci-fai.yml'

  lint-fai:
    needs: check-fai-changes
    if: needs.check-fai-changes.outputs.fai_changed == 'true'
    runs-on: CLI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Setup poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
          cd servers/fai
          poetry install

      - name: Lint & Format
        run: |
          cd servers/fai
          make code-cleanup

      - name: Type check
        run: |
          cd servers/fai
          poetry run mypy .

  lint-fai-chat:
    needs: check-fai-changes
    if: needs.check-fai-changes.outputs.fai_chat_changed == 'true'
    runs-on: CLI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Setup poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1

      - name: Install shared core (fai_ai_core)
        run: |
          cd servers/python-libs/fai_ai_core
          poetry install --with dev

      - name: Lint & Test shared core
        run: |
          cd servers/python-libs/fai_ai_core
          poetry run ruff check
          poetry run ruff format --check
          poetry run pytest

      - name: Install fai-chat
        run: |
          cd servers/fai-chat
          poetry install --with dev

      - name: Lint & Type Check fai-chat
        run: |
          cd servers/fai-chat
          make check

      - name: Test fai-chat
        run: |
          cd servers/fai-chat
          make test

  test-fai:
    needs: check-fai-changes
    if: needs.check-fai-changes.outputs.fai_changed == 'true'
    runs-on: ubuntu-latest
    environment: Fern Dev
    env:
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      POSTGRES_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mydatabase
      ASK_FERN_SLACK_BOT_TOKEN: ${{ secrets.ASK_FERN_SLACK_BOT_TOKEN }}
      FERNIE_SLACK_BOT_TOKEN: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      VENUS_URL: ${{ secrets.VENUS_URL }}
      FAI_LAMBDA_FUNCTION_NAME: ${{ secrets.FAI_LAMBDA_FUNCTION_NAME }}
      FAI_REINDEXING_SQS_URL: ${{ secrets.FAI_REINDEXING_DEV_SQS_URL }}
      SCRIBE_SLACK_BOT_TOKEN: ${{ secrets.SCRIBE_SLACK_BOT_TOKEN }}
      FERN_GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup poetry
        run: |
          curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1
          cd servers/fai
          poetry install
      - name: Create .env file
        run: |
          cd servers/fai
          echo "TURBOPUFFER_API_KEY=${{ env.TURBOPUFFER_API_KEY }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ env.ANTHROPIC_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ env.OPENAI_API_KEY }}" >> .env
          echo "COHERE_API_KEY=${{ env.COHERE_API_KEY }}" >> .env
          echo "POSTGRES_DATABASE_URL=${{ env.POSTGRES_DATABASE_URL }}" >> .env
          echo "FERN_TOKEN=${{ env.FERN_TOKEN }}" >> .env
          echo "ASK_FERN_SLACK_BOT_TOKEN=${{ env.ASK_FERN_SLACK_BOT_TOKEN }}" >> .env
          echo "FERNIE_SLACK_BOT_TOKEN=${{ env.FERNIE_SLACK_BOT_TOKEN }}" >> .env
          echo "FAI_LAMBDA_FUNCTION_NAME=${{ env.FAI_LAMBDA_FUNCTION_NAME }}" >> .env
          echo "DISCORD_BOT_TOKEN=${{ env.DISCORD_BOT_TOKEN }}" >> .env
          echo "DISCORD_OAUTH_URL=${{ env.DISCORD_OAUTH_URL }}" >> .env
          echo "ASK_FERN_SLACK_CLIENT_ID=${{ env.ASK_FERN_SLACK_CLIENT_ID }}" >> .env
          echo "ASK_FERN_SLACK_CLIENT_SECRET=${{ env.ASK_FERN_SLACK_CLIENT_SECRET }}" >> .env
          echo "ASK_FERN_SLACK_SIGNING_SECRET=${{ env.ASK_FERN_SLACK_SIGNING_SECRET }}" >> .env
          echo "SCRIBE_SLACK_CLIENT_ID=${{ env.SCRIBE_SLACK_CLIENT_ID }}" >> .env
          echo "SCRIBE_SLACK_CLIENT_SECRET=${{ env.SCRIBE_SLACK_CLIENT_SECRET }}" >> .env
          echo "SCRIBE_SLACK_SIGNING_SECRET=${{ env.SCRIBE_SLACK_SIGNING_SECRET }}" >> .env
          echo "SCRIBE_DEVIN_API_KEY=${{ env.SCRIBE_DEVIN_API_KEY }}" >> .env
          echo "SCRIBE_SLACK_BOT_TOKEN=${{ env.SCRIBE_SLACK_BOT_TOKEN }}" >> .env
          echo "FERN_GITHUB_TOKEN=${{ env.FERN_GITHUB_TOKEN }}" >> .env
          echo "FERN_BOT_APP_ID=${{ env.FERN_BOT_APP_ID }}" >> .env
          echo "FERN_BOT_PRIVATE_KEY=${{ env.FERN_BOT_PRIVATE_KEY }}" >> .env
          echo "VENUS_URL=${{ env.VENUS_URL }}" >> .env
          echo "FAI_REINDEXING_SQS_URL=${{ env.FAI_REINDEXING_DEV_SQS_URL }}" >> .env
      - name: test
        run: |
          cd servers/fai
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          poetry run pytest -sv

  test-fai-reindexing:
    needs: check-fai-changes
    if: needs.check-fai-changes.outputs.fai_reindexing_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Compile dependencies
        run: pnpm --filter=@fern-platform/fai-reindexing^... compile

      - name: Run tests
        run: pnpm --filter=@fern-platform/fai-reindexing test:reindexing
        env:
          CI: true
