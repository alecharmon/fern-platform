name: Generate FDR OpenAPI Spec

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "servers/fdr/**"
  push:
    branches:
      - app
    paths:
      - "servers/fdr/**"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  check-openapi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install
        uses: ./.github/actions/install

      - name: Compile dependencies
        run: pnpm turbo compile --filter=@fern-api/fdr-sdk...
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Generate OpenAPI spec
        run: pnpm --filter=@fern-platform/fdr generate:openapi

      - name: Check for OpenAPI spec changes
        run: |
          if git diff --exit-code servers/fdr/openapi.json; then
            echo "OpenAPI spec is up to date."
          else
            echo "::error::OpenAPI spec is out of date. Please run 'pnpm --filter=@fern-platform/fdr generate:openapi' and commit the changes."
            exit 1
          fi

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: fdr-openapi-spec
          path: servers/fdr/openapi.json

  update-openapi:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app

      - name: Install
        uses: ./.github/actions/install

      - name: Compile dependencies
        run: pnpm turbo compile --filter=@fern-api/fdr-sdk...
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Generate OpenAPI spec
        run: pnpm --filter=@fern-platform/fdr generate:openapi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}
          commit-message: "chore: update FDR OpenAPI spec"
          title: "chore: update FDR OpenAPI spec"
          branch: update-fdr-openapi-spec
          delete-branch: true
          body: "Auto-generated update to the FDR OpenAPI spec."

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

      - name: Approve PR
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.PR_BOT_GH_PAT }}
        run: gh pr review ${{ steps.cpr.outputs.pull-request-number }} --approve
