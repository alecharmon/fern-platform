name: Deploy Kubernetes Smoke Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version to deploy (e.g., 1.0.0). If not provided, uses 'latest' tag."
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Docker image version to deploy"
        required: true
        type: string

env:
  EKS_CLUSTER_NAME: ${{ vars.EKS_SMOKE_TEST_CLUSTER_NAME || 'self-hosted' }}
  AWS_REGION: ${{ vars.EKS_SMOKE_TEST_AWS_REGION || 'us-east-1' }}
  NAMESPACE: ${{ vars.EKS_SMOKE_TEST_NAMESPACE || 'fern-smoke-test' }}
  DEPLOYMENT_NAME: fern-docs-smoke-test

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Validate VPC subnets for internet-facing LoadBalancer
        run: |
          echo "Checking that EKS VPC subnets are tagged for internet-facing LoadBalancers..."
          
          VPC_ID=$(aws eks describe-cluster --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }} \
            --query 'cluster.resourcesVpcConfig.vpcId' --output text)
          echo "EKS VPC: $VPC_ID"
          
          TAGGED_SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:kubernetes.io/role/elb,Values=1" \
            --query 'Subnets[*].SubnetId' --output text --region ${{ env.AWS_REGION }})
          
          if [ -z "$TAGGED_SUBNETS" ]; then
            echo "::error::No subnets tagged with kubernetes.io/role/elb=1 in VPC $VPC_ID."
            echo "::error::Internet-facing LoadBalancers require at least one public subnet with this tag."
            echo "::error::Tag your public subnets: aws ec2 create-tags --resources <subnet-ids> --tags Key=kubernetes.io/role/elb,Value=1"
            exit 1
          fi
          
          echo "Found tagged subnets: $TAGGED_SUBNETS"
          echo "VPC is correctly configured for internet-facing LoadBalancers."

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin 985111089818.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Login to Docker Hub (for pulling base image)
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Build and push smoke test image to ECR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE_IMAGE="fernapi/fern-self-hosted:${VERSION}"
          SMOKE_TEST_IMAGE="985111089818.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/smoke-test:${VERSION}"
          
          echo "Building smoke test image from base: $BASE_IMAGE"
          
          # Create ECR repository if it doesn't exist
          aws ecr describe-repositories --repository-names smoke-test --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name smoke-test --region ${{ env.AWS_REGION }}
          
          docker build \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            -f servers/self-hosted/kubernetes-example/dockerfiles/Dockerfile.full-gen \
            -t $SMOKE_TEST_IMAGE \
            smoke-test/
          
          echo "Pushing smoke test image to ECR: $SMOKE_TEST_IMAGE"
          docker push $SMOKE_TEST_IMAGE
          
          echo "smoke_test_image=$SMOKE_TEST_IMAGE" >> $GITHUB_OUTPUT
        id: build

      - name: Deploy to EKS
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SMOKE_TEST_IMAGE="985111089818.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/smoke-test:${VERSION}"
          
          # Replace IMAGE_PLACEHOLDER with actual image in deployment manifest
          sed "s|IMAGE_PLACEHOLDER|${SMOKE_TEST_IMAGE}|g" \
            servers/self-hosted/kubernetes-example/smoke-test/deployment.yaml | \
            kubectl apply -n ${{ env.NAMESPACE }} -f -
          
          # Apply service manifest
          kubectl apply -n ${{ env.NAMESPACE }} \
            -f servers/self-hosted/kubernetes-example/smoke-test/service.yaml

      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for deployment to roll out..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Run health checks
        run: |
          echo "Running health checks..."
          
          POD_NAME=$(kubectl get pods -n ${{ env.NAMESPACE }} \
            -l app=${{ env.DEPLOYMENT_NAME }} \
            -o jsonpath='{.items[0].metadata.name}')
          
          echo "Pod name: $POD_NAME"
          
          echo "Testing liveness endpoint..."
          kubectl exec -n ${{ env.NAMESPACE }} $POD_NAME -- \
            curl -sf http://localhost:8081/liveness || exit 1
          echo "Liveness check passed"
          
          echo "Testing readiness endpoint..."
          kubectl exec -n ${{ env.NAMESPACE }} $POD_NAME -- \
            curl -sf http://localhost:8081/readiness || exit 1
          echo "Readiness check passed"
          
          echo "Testing FDR health endpoint..."
          kubectl exec -n ${{ env.NAMESPACE }} $POD_NAME -- \
            curl -sf http://localhost:8080/health || exit 1
          echo "FDR health check passed"
          
          echo "Testing docs endpoint..."
          HTTP_CODE=$(kubectl exec -n ${{ env.NAMESPACE }} $POD_NAME -- \
            curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "307" ]; then
            echo "Docs endpoint check passed (HTTP $HTTP_CODE)"
          else
            echo "Docs endpoint check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          
          echo "All health checks passed!"

      - name: Get LoadBalancer URL
        id: loadbalancer
        run: |
          echo "Retrieving LoadBalancer URL..."
          
          # Wait for the LoadBalancer hostname to be assigned (may already exist)
          for i in {1..30}; do
            LB_HOSTNAME=$(kubectl get service ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$LB_HOSTNAME" ]; then
              LB_URL="http://${LB_HOSTNAME}"
              echo "LoadBalancer URL: $LB_URL"
              echo "loadbalancer_url=$LB_URL" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting for LoadBalancer hostname... ($i/30)"
            sleep 10
          done
          
          if [ -z "$LB_HOSTNAME" ]; then
            echo "WARNING: Could not get LoadBalancer hostname after 5 minutes"
            kubectl get service ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} -o yaml || true
          fi

      - name: Print smoke test URL
        run: |
          LB_URL="${{ steps.loadbalancer.outputs.loadbalancer_url }}"
          
          echo ""
          echo "=============================================="
          if [ -n "$LB_URL" ]; then
            echo "  SMOKE TEST DOCS SITE (PUBLIC URL):"
            echo "  $LB_URL"
          else
            echo "  WARNING: Could not get LoadBalancer URL"
          fi
          echo "=============================================="
          echo ""

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "Kubernetes Smoke Test Deployed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Kubernetes Smoke Test Deployed* :rocket:\n\nVersion: `${{ steps.version.outputs.version }}`\nPublic URL: ${{ steps.loadbalancer.outputs.loadbalancer_url || 'Not available' }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }

      - name: Get deployment info
        if: always()
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} -o wide || true
          
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.DEPLOYMENT_NAME }} -o wide || true
          
          echo ""
          echo "=== Service Status ==="
          kubectl get service ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} -o wide || true
          
          echo ""
          echo "=== Recent Pod Logs ==="
          POD_NAME=$(kubectl get pods -n ${{ env.NAMESPACE }} \
            -l app=${{ env.DEPLOYMENT_NAME }} \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$POD_NAME" ]; then
            kubectl logs -n ${{ env.NAMESPACE }} $POD_NAME --tail=50 || true
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Kubernetes smoke test deployment failed. Check the logs above for details."
