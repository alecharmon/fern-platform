name: Smoke Test Preview

on:
  pull_request:
    paths:
      - "smoke-test/fern/**"
      - "packages/fern-docs/bundle/**"
      - "packages/fern-docs/components/**"
      - "packages/fdr-sdk/**"
      - ".github/workflows/smoke-test-preview.yml"
  workflow_dispatch:

jobs:
  generate_preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fern CLI tool
        run: npm install -g fern-api

      - name: Setup Go for protoc-gen-openapi
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install proto toolchain
        run: |
          # Install protoc
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          
          # Install buf CLI (1.35.1 supports buf dep update command)
          BUF_VERSION=1.35.1
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64.tar.gz" | sudo tar -xzC /usr/local --strip-components=1
          
          # Install protoc-gen-openapi v0.1.6 (includes fern.summary support from PR #13)
          go install github.com/fern-api/protoc-gen-openapi/cmd/protoc-gen-openapi@v0.1.6
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          
          # Print versions for debugging
          echo "Installed toolchain versions:"
          protoc --version
          buf --version
          go version
          which protoc-gen-openapi

      - name: Upload smoke test content to FDR
        id: fern-preview
        env:
          FERN_TOKEN: ${{ secrets.FERN_SMOKE_TEST_API_KEY }}
        run: |
          cd smoke-test/fern
          
          # Verify FERN_TOKEN is set
          if [ -z "$FERN_TOKEN" ]; then
            echo "Error: FERN_TOKEN is not set"
            exit 1
          fi
          
          # Upload docs content to FDR and get the preview host
          set +e
          OUTPUT=$(fern generate --docs --preview --log-level debug 2>&1)
          STATUS=$?
          set -e
          
          echo "$OUTPUT"
          
          if [ $STATUS -ne 0 ]; then
            echo "Error: fern generate failed with exit code $STATUS"
            exit 1
          fi
          
          # Extract preview URL with more flexible pattern
          PREVIEW_URL=$(echo "$OUTPUT" | sed -n 's/.*Published docs to \(https[^ ]*\).*/\1/p' | head -n1)

          if [ -z "$PREVIEW_URL" ]; then
            echo "Error: Failed to extract preview URL from Fern output"
            exit 1
          fi

          # Extract host from the preview URL (remove https://)
          SMOKE_TEST_HOST=$(echo "$PREVIEW_URL" | sed 's|https://||')
          echo "Smoke test host: $SMOKE_TEST_HOST"
          echo "SMOKE_TEST_HOST=$SMOKE_TEST_HOST" >> $GITHUB_OUTPUT
          cd ../..

      - name: Wait for prod.ferndocs.com Deployment
        id: vercel-preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const maxAttempts = 60;  // 60 attempts × 15 seconds = 15 minutes
            const delayMs = 15000;  // 15 seconds

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              console.log(`Attempt ${attempt}/${maxAttempts}: Looking for Vercel bot comment...`);

              // Get comments on the PR
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              // Find the Vercel bot comment
              const vercelComment = comments.find(comment =>
                comment.user.login === 'vercel[bot]' &&
                comment.body.includes('prod.ferndocs.com')
              );

              if (vercelComment) {
                console.log('Found Vercel bot comment');

                // Parse the comment body to find the prod.ferndocs.com preview URL
                // Look for the markdown table row with prod.ferndocs.com
                const lines = vercelComment.body.split('\n');
                for (const line of lines) {
                  if (line.includes('prod.ferndocs.com') && line.includes('Preview')) {
                    // Extract URL from markdown link format [Preview](url)
                    const match = line.match(/\[Preview\]\((https:\/\/[^)]+)\)/);
                    if (match) {
                      const previewUrl = match[1];
                      console.log(`✓ Found prod.ferndocs.com preview URL: ${previewUrl}`);

                      // Check if deployment is ready (not building)
                      if (line.includes('Ready') || line.includes('![Ready]')) {
                        console.log('Deployment is ready!');
                        core.setOutput('url', previewUrl);
                        return;
                      } else {
                        console.log('Deployment exists but not ready yet, waiting...');
                      }
                    }
                  }
                }
              } else {
                console.log('Vercel bot comment not found yet');
              }

              if (attempt < maxAttempts) {
                console.log(`Waiting ${delayMs/1000}s before next check...`);
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }

            throw new Error('Timeout waiting for prod.ferndocs.com deployment after 15 minutes');

      - name: Setup preview connection
        id: generate-docs
        if: steps.vercel-preview.outputs.url != ''
        env:
          VERCEL_URL: ${{ steps.vercel-preview.outputs.url }}
          SMOKE_TEST_HOST: ${{ steps.fern-preview.outputs.SMOKE_TEST_HOST }}
        run: |
          # Build the preview API URL
          PREVIEW_API_URL="${VERCEL_URL}/api/fern-docs/preview?host=${SMOKE_TEST_HOST}"
          echo "Preview API URL: $PREVIEW_API_URL"
          echo "Vercel Base URL: $VERCEL_URL"

          # Set up preview cookie and save to file for reuse
          echo "Setting up preview cookie..."
          curl -c /tmp/preview-cookies.txt -L "$PREVIEW_API_URL" > /dev/null 2>&1
          echo "Cookie saved to /tmp/preview-cookies.txt"

          # The crawler will visit the preview API URL first to set cookies
          # Then crawl from the base URL
          echo "🌱 Smoke Test Preview: $PREVIEW_API_URL" > preview_url.txt
          echo "PREVIEW_URL=$PREVIEW_API_URL" >> $GITHUB_OUTPUT

      - name: Skip message for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "⚠️ Smoke test cannot run via workflow_dispatch because Vercel preview URL is not available."
          echo "This workflow is designed to run on pull_request events only."
          echo "🌱 Smoke Test Preview: Skipped (workflow_dispatch)" > preview_url.txt

      - name: Setup Node.js
        if: steps.generate-docs.outputs.PREVIEW_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Puppeteer
        if: steps.generate-docs.outputs.PREVIEW_URL != ''
        working-directory: smoke-test
        run: npm install

      - name: Crawl preview site
        if: steps.generate-docs.outputs.PREVIEW_URL != ''
        working-directory: smoke-test
        run: |
          node crawler.js "${{ steps.generate-docs.outputs.PREVIEW_URL }}"

      - name: Test content negotiation with Accept header
        if: steps.generate-docs.outputs.PREVIEW_URL != ''
        env:
          VERCEL_URL: ${{ steps.vercel-preview.outputs.url }}
        run: |
          echo "Testing Accept: text/plain header for content negotiation..."

          # Reuse preview cookie from previous step
          echo "Using existing preview cookie from /tmp/preview-cookies.txt"

          # Test base URL with Accept: text/plain header
          echo "Testing ${VERCEL_URL} with Accept: text/plain"
          RESPONSE=$(curl -b /tmp/preview-cookies.txt -H "Accept: text/plain" -s -i "${VERCEL_URL}/" 2>&1)

          # Extract content-type header
          CONTENT_TYPE=$(echo "$RESPONSE" | grep -i "^content-type:" | head -1 | cut -d' ' -f2- | tr -d '\r')

          echo "Response Content-Type: $CONTENT_TYPE"

          # Check if content-type contains text/plain
          if echo "$CONTENT_TYPE" | grep -q "text/plain"; then
            echo "✅ Content negotiation working: returned text/plain"
          else
            echo "❌ Content negotiation failed: expected text/plain, got $CONTENT_TYPE"
            exit 1
          fi

      - name: Combine results for PR comment
        if: github.event_name == 'pull_request' && always()
        run: |
          echo "## 🌱 Smoke Test Preview" > final-comment.txt
          echo "" >> final-comment.txt
          echo "**Run at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> final-comment.txt
          echo "" >> final-comment.txt
          echo "Testing branch changes with smoke test content:" >> final-comment.txt
          echo "" >> final-comment.txt
          echo "- **Smoke Test Content (from FDR):** https://${{ steps.fern-preview.outputs.SMOKE_TEST_HOST }}" >> final-comment.txt
          echo "- **Branch's Docs Platform (Vercel):** ${{ steps.generate-docs.outputs.PREVIEW_URL }}" >> final-comment.txt
          echo "" >> final-comment.txt
          if [ -f smoke-test/crawler-summary.txt ]; then
            cat smoke-test/crawler-summary.txt >> final-comment.txt
          else
            echo "⚠️ Crawler did not run or failed to generate results" >> final-comment.txt
          fi

      - name: Comment URL in PR
        if: github.event_name == 'pull_request' && always()
        uses: thollander/actions-comment-pull-request@v2.4.3
        with:
          filePath: final-comment.txt
          comment_tag: smoke-test-preview
