name: Smoke Test Preview

on:
  pull_request:
    paths:
      - "smoke-test/fern/**"
      - "packages/fern-docs/bundle/**"
      - "packages/fern-docs/components/**"
      - "packages/fdr-sdk/**"
      - ".github/workflows/smoke-test-preview.yml"
      - "pnpm-lock.yaml"
      - "scripts/visual-diff.ts"
  workflow_dispatch:

jobs:
  # Setup job: Upload to FDR and wait for Vercel deployment
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: "buildwithfern"
    outputs:
      smoke_test_host: ${{ steps.fern-preview.outputs.SMOKE_TEST_HOST }}
      vercel_url: ${{ steps.vercel-preview.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fern CLI tool
        run: npm install -g fern-api

      - name: Setup Go for protoc-gen-openapi
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Install proto toolchain
        run: |
          # Install protoc
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

          # Install buf CLI (1.35.1 supports buf dep update command)
          BUF_VERSION=1.35.1
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64.tar.gz" | sudo tar -xzC /usr/local --strip-components=1

          # Install protoc-gen-openapi v0.1.6 (includes fern.summary support from PR #13)
          go install github.com/fern-api/protoc-gen-openapi/cmd/protoc-gen-openapi@v0.1.6
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

          # Print versions for debugging
          echo "Installed toolchain versions:"
          protoc --version
          buf --version
          go version
          which protoc-gen-openapi

      - name: Upload smoke test content to FDR
        id: fern-preview
        env:
          FERN_TOKEN: ${{ secrets.FERN_SMOKE_TEST_API_KEY }}
        run: |
          cd smoke-test/fern

          # Verify FERN_TOKEN is set
          if [ -z "$FERN_TOKEN" ]; then
            echo "Error: FERN_TOKEN is not set"
            exit 1
          fi

          # Upload docs content to FDR and get the preview host
          set +e
          OUTPUT=$(fern generate --docs --preview --log-level debug 2>&1)
          STATUS=$?
          set -e

          echo "$OUTPUT"

          if [ $STATUS -ne 0 ]; then
            echo "Error: fern generate failed with exit code $STATUS"
            exit 1
          fi

          # Extract preview URL with more flexible pattern
          PREVIEW_URL=$(echo "$OUTPUT" | sed -n 's/.*Published docs to \(https[^ ]*\).*/\1/p' | head -n1)

          if [ -z "$PREVIEW_URL" ]; then
            echo "Error: Failed to extract preview URL from Fern output"
            exit 1
          fi

          # Extract host from the preview URL (remove https://)
          SMOKE_TEST_HOST=$(echo "$PREVIEW_URL" | sed 's|https://||')
          echo "Smoke test host: $SMOKE_TEST_HOST"
          echo "SMOKE_TEST_HOST=$SMOKE_TEST_HOST" >> $GITHUB_OUTPUT
          cd ../..

      - name: Wait for prod.ferndocs.com Deployment
        id: vercel-preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const maxAttempts = 60;  // 60 attempts x 15 seconds = 15 minutes
            const delayMs = 15000;  // 15 seconds

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              console.log(`Attempt ${attempt}/${maxAttempts}: Looking for Vercel bot comment...`);

              // Get comments on the PR
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              // Find the Vercel bot comment
              const vercelComment = comments.find(comment =>
                comment.user.login === 'vercel[bot]' &&
                comment.body.includes('prod.ferndocs.com')
              );

              if (vercelComment) {
                console.log('Found Vercel bot comment');

                // Parse the comment body to find the prod.ferndocs.com preview URL
                // Look for the markdown table row with prod.ferndocs.com
                const lines = vercelComment.body.split('\n');
                for (const line of lines) {
                  if (line.includes('prod.ferndocs.com') && line.includes('Preview')) {
                    // Extract URL from markdown link format [Preview](url)
                    const match = line.match(/\[Preview\]\((https:\/\/[^)]+)\)/);
                    if (match) {
                      const previewUrl = match[1];
                      console.log(`Found prod.ferndocs.com preview URL: ${previewUrl}`);

                      // Check if deployment is ready (not building)
                      if (line.includes('Ready') || line.includes('![Ready]')) {
                        console.log('Deployment is ready!');
                        core.setOutput('url', previewUrl);
                        return;
                      } else {
                        console.log('Deployment exists but not ready yet, waiting...');
                      }
                    }
                  }
                }
              } else {
                console.log('Vercel bot comment not found yet');
              }

              if (attempt < maxAttempts) {
                console.log(`Waiting ${delayMs/1000}s before next check...`);
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }

            throw new Error('Timeout waiting for prod.ferndocs.com deployment after 15 minutes');

      - name: Skip message for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Smoke test cannot run via workflow_dispatch because Vercel preview URL is not available."
          echo "This workflow is designed to run on pull_request events only."

  # Smoke test job: Run smoke tests on the preview
  smoke-test:
    needs: setup
    if: needs.setup.outputs.vercel_url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: "buildwithfern"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run smoke test (Playwright)
        id: smoke-test
        continue-on-error: true
        env:
          VERCEL_URL: ${{ needs.setup.outputs.vercel_url }}
          SMOKE_TEST_HOST: ${{ needs.setup.outputs.smoke_test_host }}
        run: |
          pnpm smoke-test "$VERCEL_URL" "$SMOKE_TEST_HOST" --concurrency auto2x
          SMOKE_EXIT=$?
          echo "SMOKE_EXIT=$SMOKE_EXIT" >> $GITHUB_OUTPUT
          if [ $SMOKE_EXIT -ne 0 ]; then
            echo "Smoke test completed with exit code $SMOKE_EXIT"
          fi

      - name: Prepare smoke test PR comment
        if: github.event_name == 'pull_request' && always()
        env:
          SMOKE_TEST_HOST: ${{ needs.setup.outputs.smoke_test_host }}
          VERCEL_URL: ${{ needs.setup.outputs.vercel_url }}
        run: |
          echo "## Smoke Test Preview" > smoke-test-comment.txt
          echo "" >> smoke-test-comment.txt
          echo "**Run at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> smoke-test-comment.txt
          echo "" >> smoke-test-comment.txt
          echo "Testing branch changes with smoke test content:" >> smoke-test-comment.txt
          echo "" >> smoke-test-comment.txt
          echo "- **Smoke Test Content (from FDR):** https://${SMOKE_TEST_HOST}" >> smoke-test-comment.txt
          echo "- **Branch's Docs Platform (Vercel):** ${VERCEL_URL}/api/fern-docs/preview?host=${SMOKE_TEST_HOST}" >> smoke-test-comment.txt
          echo "" >> smoke-test-comment.txt
          if [ -f ./smoke-test-output/crawler-summary.txt ]; then
            cat ./smoke-test-output/crawler-summary.txt >> smoke-test-comment.txt
          else
            echo "Crawler did not run or failed to generate results" >> smoke-test-comment.txt
          fi

      - name: Post smoke test PR comment
        if: github.event_name == 'pull_request' && always()
        uses: thollander/actions-comment-pull-request@v2.4.3
        with:
          filePath: smoke-test-comment.txt
          comment_tag: smoke-test-preview

  # Visual diff jobs: Run visual diff for each domain in parallel
  visual-diff:
    needs: setup
    if: needs.setup.outputs.vercel_url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: "buildwithfern"
    strategy:
      fail-fast: false
      matrix:
        domain:
          - "buildwithfern.com/learn"
          - "docs.cohere.com"
          - "elevenlabs.io/docs"
          - "docs.mercoa.com"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run visual diff for ${{ matrix.domain }}
        id: visual-diff
        continue-on-error: true
        env:
          VERCEL_URL: ${{ needs.setup.outputs.vercel_url }}
        run: |
          pnpm visual-diff \
            --domains "${{ matrix.domain }}" \
            --preview "$VERCEL_URL" \
            --max-pages 100 \
            --max-diffs 3 \
            --concurrency auto2x \
            --output ./visual-diff-output \
            --fail-on-diff || echo "DIFFS_FOUND=true" >> $GITHUB_OUTPUT

      - name: Upload visual diff report for ${{ matrix.domain }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diff-${{ strategy.job-index }}
          path: visual-diff-output/
          retention-days: 7

  # Aggregate visual diff results and post PR comment
  visual-diff-report:
    needs: [setup, visual-diff]
    if: always() && needs.setup.outputs.vercel_url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all visual diff artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: visual-diff-*
          path: ./visual-diff-output
          merge-multiple: true

      - name: Install CML dependencies
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2

      - name: Generate visual diff PR comment
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT_DIR="./visual-diff-output"
          
          # Initialize counters
          TOTAL_DOMAINS=0
          TOTAL_PAGES=0
          TOTAL_DIFFS=0
          TOTAL_ERRORS=0
          
          # Create a temp file with all diffs
          echo "[]" > /tmp/all_diffs.json
          
          # Process each domain directory
          for domain_dir in "$OUTPUT_DIR"/*/; do
            if [ -d "$domain_dir" ]; then
              domain=$(basename "$domain_dir")
              report_path="$domain_dir/report.json"
              
              if [ -f "$report_path" ]; then
                TOTAL_DOMAINS=$((TOTAL_DOMAINS + 1))
                
                # Get stats from this domain's report
                DOMAIN_PAGES=$(jq '.totalPages // 0' "$report_path")
                DOMAIN_DIFFS=$(jq '.pagesWithDiffs // 0' "$report_path")
                DOMAIN_ERRORS=$(jq '.pagesWithErrors // 0' "$report_path")
                
                TOTAL_PAGES=$((TOTAL_PAGES + DOMAIN_PAGES))
                TOTAL_DIFFS=$((TOTAL_DIFFS + DOMAIN_DIFFS))
                TOTAL_ERRORS=$((TOTAL_ERRORS + DOMAIN_ERRORS))
                
                # Extract diffs from this domain's report
                jq --arg domain "$domain" '[.results[] | select(.hasDiff == true and .error == null) | {domain: $domain, page: .page, diffPercentage: .diffPercentage, liveUrl: .liveUrl, previewUrl: .previewUrl, liveScreenshot: .liveScreenshot, previewScreenshot: .previewScreenshot, diffScreenshot: .diffScreenshot}]' "$report_path" > /tmp/domain_diffs.json
                
                # Merge with all diffs
                jq -s '.[0] + .[1]' /tmp/all_diffs.json /tmp/domain_diffs.json > /tmp/merged_diffs.json
                mv /tmp/merged_diffs.json /tmp/all_diffs.json
              fi
            fi
          done

          # Start building the report
          echo "## Visual Diff Report" > visual-diff-comment.md
          echo "" >> visual-diff-comment.md
          echo "**Total Domains:** $TOTAL_DOMAINS" >> visual-diff-comment.md
          echo "**Total Pages:** $TOTAL_PAGES" >> visual-diff-comment.md
          echo "**Total Diffs:** $TOTAL_DIFFS" >> visual-diff-comment.md
          echo "**Total Errors:** $TOTAL_ERRORS" >> visual-diff-comment.md
          echo "" >> visual-diff-comment.md

          # Sort by diffPercentage and take top 3
          jq 'sort_by(-.diffPercentage) | .[0:3]' /tmp/all_diffs.json > /tmp/top_diffs.json

          TOP_COUNT=$(jq 'length' /tmp/top_diffs.json)

          if [ "$TOP_COUNT" -gt 0 ]; then
            echo "### Top $TOP_COUNT Visual Differences" >> visual-diff-comment.md
            echo "" >> visual-diff-comment.md

            # Process each top diff
            for i in $(seq 0 $((TOP_COUNT - 1))); do
              domain=$(jq -r ".[$i].domain" /tmp/top_diffs.json)
              page=$(jq -r ".[$i].page" /tmp/top_diffs.json)
              diff_pct=$(jq -r ".[$i].diffPercentage" /tmp/top_diffs.json)
              live_url=$(jq -r ".[$i].liveUrl" /tmp/top_diffs.json)
              preview_url=$(jq -r ".[$i].previewUrl" /tmp/top_diffs.json)
              live_screenshot=$(jq -r ".[$i].liveScreenshot" /tmp/top_diffs.json)
              preview_screenshot=$(jq -r ".[$i].previewScreenshot" /tmp/top_diffs.json)
              diff_screenshot=$(jq -r ".[$i].diffScreenshot" /tmp/top_diffs.json)

              echo "#### $domain - $page" >> visual-diff-comment.md
              echo "**Diff:** ${diff_pct}%" >> visual-diff-comment.md
              echo "" >> visual-diff-comment.md
              
              # Add links to live and preview pages
              echo "**Links:** [Live]($live_url) | [Preview]($preview_url)" >> visual-diff-comment.md
              echo "" >> visual-diff-comment.md

              # Display all three images using CML inline syntax (cml comment auto-uploads images)
              echo "| Live | Preview | Diff |" >> visual-diff-comment.md
              echo "|:----:|:-------:|:----:|" >> visual-diff-comment.md

              # Build table row with inline images (CML will auto-upload these)
              row="|"
              
              # Live screenshot
              if [ "$live_screenshot" != "null" ] && [ -f "$live_screenshot" ]; then
                row="$row ![]($live_screenshot) |"
              else
                row="$row Not available |"
              fi

              # Preview screenshot
              if [ "$preview_screenshot" != "null" ] && [ -f "$preview_screenshot" ]; then
                row="$row ![]($preview_screenshot) |"
              else
                row="$row Not available |"
              fi

              # Diff screenshot
              if [ "$diff_screenshot" != "null" ] && [ -f "$diff_screenshot" ]; then
                row="$row ![]($diff_screenshot) |"
              else
                row="$row Not available |"
              fi

              echo "$row" >> visual-diff-comment.md
              echo "" >> visual-diff-comment.md
            done

            echo "" >> visual-diff-comment.md
            echo "> Download the full report from the workflow artifacts for all diff images." >> visual-diff-comment.md
          else
            echo "No visual differences found!" >> visual-diff-comment.md
          fi

      - name: Post visual diff PR comment
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f visual-diff-comment.md ]; then
            cml comment update visual-diff-comment.md
          fi
