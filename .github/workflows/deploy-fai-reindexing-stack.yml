name: Deploy FAI Reindexing Stack

on:
  push:
    tags:
      - "fai-reindexing@*"

jobs:
  deploy-prod:
    if: contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: Fern Prod
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
      FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}
      EDGE_CONFIG: ${{ secrets.EDGE_CONFIG }}
      DB_DOCS_DEFINITION_BUCKET_NAME: ${{ secrets.DB_DOCS_DEFINITION_BUCKET_NAME }}
      DB_DOCS_DEFINITION_BUCKET_REGION: ${{ secrets.DB_DOCS_DEFINITION_BUCKET_REGION }}
      DEPLOY_ENVIRONMENT: prod
      FAI_SENTRY_DSN: ${{ secrets.FAI_SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.27.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          echo "Removing unnecessary system packages..."
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo apt-get clean
          docker system prune -af --volumes
          echo "Disk space after cleanup:"
          df -h

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1
      - name: Deploy to Prod
        run: |
          git_version="$(git rev-parse --short HEAD)"

          # Install dependencies
          pnpm install

          # Build FAI SDK (required for lambda bundle)
          pnpm --filter=@fern-api/fai-sdk build

          # Build FAI reindexing stack
          cd servers/fai-reindexing

          # Build Lambda function
          pnpm build:lambda

          # Build Docker container
          docker build -t fai-reindexing-scheduler:${git_version} -f Dockerfile ../../
          docker save fai-reindexing-scheduler:${git_version} -o fai-reindexing-scheduler:${git_version}.tar

          # Deploy with CDK
          cd deploy
          pnpm install
          DEPLOY_ENVIRONMENT=prod VERSION="${git_version}" pnpm cdk deploy fai-reindexing-scheduler-prod --require-approval never --progress events
