name: Publish Self-Hostable Docs (with-docs-basepath)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: false
        type: string

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

jobs:
  test:
    uses: ./.github/workflows/run-self-hosted-tests.yml

  build-and-publish:
    runs-on: seed
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # This helps turbo resolve changes faster

      - name: Determine version to publish
        id: determine_version
        run: |
          PROVIDED_VERSION="${{ github.event.inputs.version }}"
          BASE_PATH="/docs"

          if [ -n "$PROVIDED_VERSION" ]; then
            echo "Using provided version: $PROVIDED_VERSION"
            echo "version=$PROVIDED_VERSION" >> $GITHUB_OUTPUT
          else
            echo "No version provided, determining next version..."

            # Get Docker Hub token
            USR="fernapi"
            IMG="fern-self-hosted-with-docs-basepath"
            TOKEN=$(curl -fsSL -u "$USR:${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$USR/$IMG:pull" | \
              jq -r .token)

            # Get latest tag from Docker Hub registry
            LATEST_TAG=$(curl -fsSL -H "Authorization: Bearer $TOKEN" \
              "https://registry-1.docker.io/v2/$USR/$IMG/tags/list" | \
              jq -r '.tags | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | sort_by(split(".") | map(tonumber)) | reverse | .[0]')

            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              echo "No existing tags found for $IMG, starting with 0.1.0"
              NEW_TAG="0.1.0"
            else
              echo "Current latest tag is $LATEST_TAG"

              # Validate semver format (major.minor.patch)
              if [[ ! "$LATEST_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Error: LATEST_TAG '$LATEST_TAG' does not match semver format (major.minor.patch). Manually publish new version to unblock automatic publishing."
                exit 1
              fi

              # Increment minor version
              NEW_TAG=$(echo $LATEST_TAG | awk -F. '{print $1"."$2+1".0"}')
            fi

            echo "New tag is $NEW_TAG"
            echo "version=$NEW_TAG" >> $GITHUB_OUTPUT
          fi

          echo "base_path=$BASE_PATH" >> $GITHUB_OUTPUT

      - name: Update Engines
        run: |
          node -e 'const fs = require("fs"); const pkg = require("./package.json"); console.log("Before modification:", JSON.stringify(pkg.engines, null, 2)); pkg.engines.node = ">=20.0.0"; pkg.engines.pnpm = "10.11.0"; pkg.packageManager = "pnpm@10.11.0"; console.log("After modification:", JSON.stringify(pkg.engines, null, 2)); fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));'

      - name: Install
        uses: ./.github/actions/install

      - name: Compile
        run: pnpm compile

      - name: Build FDR CJS
        run: pnpm --filter @fern-platform/fdr build:tsup:cjs

      - name: Build self-hosted bundle with base path
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          BASE_PATH: ${{ steps.determine_version.outputs.base_path }}
        run: pnpm docs:self-hosted-bundle:build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Build and push multi-platform Docker image
        working-directory: servers/self-hosted
        run: |
          VERSION="${{ steps.determine_version.outputs.version }}"
          BASE_PATH="${{ steps.determine_version.outputs.base_path }}"
          echo "Building and publishing version: $VERSION (with basePath: $BASE_PATH) for linux/amd64 and linux/arm64"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            -f Dockerfile.self_hosted \
            -t fernapi/fern-self-hosted-with-docs-basepath:$VERSION \
            -t fernenterprise/fern-self-hosted-with-docs-basepath:$VERSION \
            ../..
