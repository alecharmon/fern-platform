name: Publish Self-Hostable Docs (with-docs-basepath)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match a docs@ release version)"
        required: true
        type: string
  push:
    tags:
      - "docs@*"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

jobs:
  test:
    uses: ./.github/workflows/run-self-hosted-tests.yml

  build-js-bundle:
    runs-on: seed
    needs: test
    timeout-minutes: 30
    outputs:
      version: ${{ steps.determine_version.outputs.version }}
      base_path: ${{ steps.determine_version.outputs.base_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine version to publish
        id: determine_version
        run: |
          PROVIDED_VERSION="${{ github.event.inputs.version }}"
          GIT_REF="${{ github.ref }}"
          BASE_PATH="/docs"
          
          if [ -n "$PROVIDED_VERSION" ]; then
            echo "Using provided version: $PROVIDED_VERSION"
            echo "version=$PROVIDED_VERSION" >> $GITHUB_OUTPUT
          elif [[ "$GIT_REF" == refs/tags/docs@* ]]; then
            TAG_VERSION="${GIT_REF#refs/tags/docs@}"
            echo "Using version from docs@ tag: $TAG_VERSION"
            echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Version must be provided via workflow_dispatch input or docs@ tag"
            exit 1
          fi

          echo "base_path=$BASE_PATH" >> $GITHUB_OUTPUT

      - name: Update Engines
        run: |
          node -e 'const fs = require("fs"); const pkg = require("./package.json"); console.log("Before modification:", JSON.stringify(pkg.engines, null, 2)); pkg.engines.node = ">=20.0.0"; pkg.engines.pnpm = "10.27.0"; pkg.packageManager = "pnpm@10.27.0"; console.log("After modification:", JSON.stringify(pkg.engines, null, 2)); fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));'

      - name: Install
        uses: ./.github/actions/install

      - name: Compile
        run: pnpm compile

      - name: Build FDR CJS
        run: pnpm --filter @fern-platform/fdr build:tsup:cjs

      - name: Build self-hosted bundle with base path
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          BASE_PATH: ${{ steps.determine_version.outputs.base_path }}
        run: pnpm docs:self-hosted-bundle:build

      - name: Upload JS bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-bundle-basepath
          path: docs_bundle.tar.gz
          retention-days: 1

  build-docker-amd64:
    runs-on: seed
    needs: build-js-bundle
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download JS bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-bundle-basepath

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Build and push amd64 Docker image
        working-directory: servers/self-hosted
        run: |
          VERSION="${{ needs.build-js-bundle.outputs.version }}"
          BASE_PATH="${{ needs.build-js-bundle.outputs.base_path }}"
          echo "Building version: $VERSION (with basePath: $BASE_PATH) for linux/amd64 (native)"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --cache-from type=gha,scope=basepath-amd64 \
            --cache-to type=gha,mode=max,scope=basepath-amd64 \
            --push \
            -f Dockerfile.self_hosted \
            -t fernapi/fern-self-hosted-with-docs-basepath:$VERSION-amd64 \
            -t fernenterprise/fern-self-hosted-with-docs-basepath:$VERSION-amd64 \
            ../..

  build-docker-arm64:
    runs-on: ubuntu-24.04-arm64
    needs: build-js-bundle
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download JS bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-bundle-basepath

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Build and push arm64 Docker image
        working-directory: servers/self-hosted
        run: |
          VERSION="${{ needs.build-js-bundle.outputs.version }}"
          BASE_PATH="${{ needs.build-js-bundle.outputs.base_path }}"
          echo "Building version: $VERSION (with basePath: $BASE_PATH) for linux/arm64 (native)"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from type=gha,scope=basepath-arm64 \
            --cache-to type=gha,mode=max,scope=basepath-arm64 \
            --push \
            -f Dockerfile.self_hosted \
            -t fernapi/fern-self-hosted-with-docs-basepath:$VERSION-arm64 \
            -t fernenterprise/fern-self-hosted-with-docs-basepath:$VERSION-arm64 \
            ../..

  create-manifest:
    runs-on: ubuntu-latest
    needs: [build-js-bundle, build-docker-amd64, build-docker-arm64]
    timeout-minutes: 10
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Create and push multi-platform manifest
        run: |
          VERSION="${{ needs.build-js-bundle.outputs.version }}"
          BASE_PATH="${{ needs.build-js-bundle.outputs.base_path }}"
          echo "Creating multi-platform manifest for version: $VERSION (with basePath: $BASE_PATH)"
          
          docker manifest create fernapi/fern-self-hosted-with-docs-basepath:$VERSION \
            fernapi/fern-self-hosted-with-docs-basepath:$VERSION-amd64 \
            fernapi/fern-self-hosted-with-docs-basepath:$VERSION-arm64
          docker manifest push fernapi/fern-self-hosted-with-docs-basepath:$VERSION
          
          docker manifest create fernenterprise/fern-self-hosted-with-docs-basepath:$VERSION \
            fernenterprise/fern-self-hosted-with-docs-basepath:$VERSION-amd64 \
            fernenterprise/fern-self-hosted-with-docs-basepath:$VERSION-arm64
          docker manifest push fernenterprise/fern-self-hosted-with-docs-basepath:$VERSION
          
          echo "Successfully published multi-platform images:"
          echo "  - fernapi/fern-self-hosted-with-docs-basepath:$VERSION"
          echo "  - fernenterprise/fern-self-hosted-with-docs-basepath:$VERSION"
