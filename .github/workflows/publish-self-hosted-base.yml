name: Publish Self-Hosted Base Image

on:
  push:
    branches:
      - app
    paths:
      - "servers/self-hosted/Dockerfile.base"
      - ".github/workflows/publish-self-hosted-base.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for the base image (e.g., v1, v2, latest)"
        required: false
        default: "latest"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-base-amd64:
    runs-on: seed
    timeout-minutes: 60
    outputs:
      version: ${{ steps.determine_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine version
        id: determine_version
        run: |
          PROVIDED_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$PROVIDED_VERSION" ] && [ "$PROVIDED_VERSION" != "latest" ]; then
            echo "Using provided version: $PROVIDED_VERSION"
            echo "version=$PROVIDED_VERSION" >> $GITHUB_OUTPUT
          else
            # Use short commit SHA as version for automatic builds
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "Using commit SHA as version: $SHORT_SHA"
            echo "version=$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Build and push amd64 base image
        working-directory: servers/self-hosted
        run: |
          VERSION="${{ steps.determine_version.outputs.version }}"
          echo "Building base image version: $VERSION for linux/amd64 (native)"
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha,scope=base-amd64 \
            --cache-to type=gha,mode=max,scope=base-amd64 \
            --push \
            -f Dockerfile.base \
            -t fernapi/fern-self-hosted-base:$VERSION-amd64 \
            -t fernenterprise/fern-self-hosted-base:$VERSION-amd64 \
            .

  build-base-arm64:
    runs-on: ubuntu-24.04-arm64
    timeout-minutes: 60
    needs: build-base-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Build and push arm64 base image
        working-directory: servers/self-hosted
        run: |
          VERSION="${{ needs.build-base-amd64.outputs.version }}"
          echo "Building base image version: $VERSION for linux/arm64 (native)"
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=base-arm64 \
            --cache-to type=gha,mode=max,scope=base-arm64 \
            --push \
            -f Dockerfile.base \
            -t fernapi/fern-self-hosted-base:$VERSION-arm64 \
            -t fernenterprise/fern-self-hosted-base:$VERSION-arm64 \
            .

  create-manifest:
    runs-on: ubuntu-latest
    needs: [build-base-amd64, build-base-arm64]
    timeout-minutes: 10
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fernapi
          password: ${{ secrets.FERN_API_DOCKERHUB_PASSWORD }}

      - name: Create and push multi-platform manifest
        run: |
          VERSION="${{ needs.build-base-amd64.outputs.version }}"
          echo "Creating multi-platform manifest for base image version: $VERSION"
          
          # Create versioned manifest
          docker manifest create fernapi/fern-self-hosted-base:$VERSION \
            fernapi/fern-self-hosted-base:$VERSION-amd64 \
            fernapi/fern-self-hosted-base:$VERSION-arm64
          docker manifest push fernapi/fern-self-hosted-base:$VERSION
          
          docker manifest create fernenterprise/fern-self-hosted-base:$VERSION \
            fernenterprise/fern-self-hosted-base:$VERSION-amd64 \
            fernenterprise/fern-self-hosted-base:$VERSION-arm64
          docker manifest push fernenterprise/fern-self-hosted-base:$VERSION
          
          # Also update the 'latest' tag
          docker manifest create fernapi/fern-self-hosted-base:latest \
            fernapi/fern-self-hosted-base:$VERSION-amd64 \
            fernapi/fern-self-hosted-base:$VERSION-arm64
          docker manifest push fernapi/fern-self-hosted-base:latest
          
          docker manifest create fernenterprise/fern-self-hosted-base:latest \
            fernenterprise/fern-self-hosted-base:$VERSION-amd64 \
            fernenterprise/fern-self-hosted-base:$VERSION-arm64
          docker manifest push fernenterprise/fern-self-hosted-base:latest
          
          echo "Successfully published multi-platform base images:"
          echo "  - fernapi/fern-self-hosted-base:$VERSION"
          echo "  - fernapi/fern-self-hosted-base:latest"
          echo "  - fernenterprise/fern-self-hosted-base:$VERSION"
          echo "  - fernenterprise/fern-self-hosted-base:latest"
