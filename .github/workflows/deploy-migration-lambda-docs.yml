name: Deploy Migration Lambda Docs

on:
  push:
    branches:
      - app
    paths:
      - "packages/migration-lambda-docs/**"
      - "servers/fdr/prisma/**"
      - ".github/workflows/deploy-migration-lambda-docs.yml"
  workflow_dispatch:  # Allow manual triggering for testing
    inputs:
      run_migration:
        description: 'Run migration after deployment?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PACKAGE_NAME: "@fern-platform/migration-lambda-docs"

jobs:
  deploy:
    runs-on: Seed
    permissions:
      id-token: write
      contents: read
    environment: Fern Prod
    strategy:
      matrix:
        concurrency: [1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install
        uses: ./.github/actions/install

      - name: Build Migration Lambda
        run: |
          cd packages/migration-lambda-docs
          pnpm build

      - name: Package Migration Lambda
        run: |
          cd packages/migration-lambda-docs
          pnpm package

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1

      - name: Deploy Migration Lambda
        run: |
          cd packages/migration-lambda-docs
          aws lambda update-function-code \
            --function-name prisma-migration-lambda-docs \
            --zip-file fileb://migration-lambda.zip \
            --region us-east-1

      - name: Wait for Lambda Update
        run: |
          aws lambda wait function-updated \
            --function-name prisma-migration-lambda-docs \
            --region us-east-1

      - name: Update Environment Variables
        run: |
          aws lambda update-function-configuration \
            --function-name prisma-migration-lambda-docs \
            --environment Variables={DOCS_DB_SECRET_ID=${{ secrets.DOCS_DB_SECRET_ID }}} \
            --region us-east-1

      - name: Wait for Configuration Update
        run: |
          echo "Waiting for Lambda configuration to update..."
          aws lambda wait function-updated \
            --function-name prisma-migration-lambda-docs \
            --region us-east-1
          echo "Configuration update complete"

      - name: Output
        run: |
          echo "Migration Lambda function 'prisma-migration-lambda-docs' updated successfully"

      - name: Run Database Migrations
        if: github.event.inputs.run_migration != 'false'
        run: |
          # Determine if this is production branch or feature branch
          if [[ "${{ github.ref }}" == "refs/heads/app" ]] || [[ "${{ github.ref }}" == "refs/heads/devin/1763683373-lambda-rds-secrets" ]]; then
            echo "Running migrations..."
            TEST_MODE="false"
          else
            echo "Testing connection on feature branch..."
            TEST_MODE="true"
          fi

          aws lambda invoke \
            --function-name prisma-migration-lambda-docs \
            --region us-east-1 \
            --payload "{\"testConnection\": $TEST_MODE}" \
            --cli-binary-format raw-in-base64-out \
            response.json

          echo "Lambda response:"
          cat response.json

          # Check if operation was successful
          if grep -qE '"statusCode":\s*200' response.json; then
            if [[ "$TEST_MODE" == "true" ]]; then
              echo "Database connection test successful"
            else
              echo "Migrations completed successfully"
            fi
          else
            echo "Operation failed"
            cat response.json
            exit 1
          fi
