name: Deploy Local Preview (PROD)

on:
  push:
    tags:
      - "docs-local-bundle@*"
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.FERN_SUPPORT_GH_ACTIONS_PAT }}

jobs:        
  prod:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1
      - name: Install
        uses: ./.github/actions/install
      - name: Compile
        run: pnpm compile
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/docs-local-bundle@* ]]; then
            # Extract version from tag (e.g., docs-local-bundle@1.2.3 -> 1.2.3)
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#docs-local-bundle@}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # For manual dispatch, use a timestamp-based version
            echo "version=prod-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi
      - name: Build local preview bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_PUBLIC_DOCS_BUNDLE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm --filter=@fern-docs/bundle run docs:make:local
      - name: Synthesize local preview bundle
        run: pnpm --filter=@fern-platform/cdk run deploy-app:prod
