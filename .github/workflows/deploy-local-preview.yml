name: Deploy Local Preview (PROD)

on:
  release:
    types: [created]
    tags:
      - "docs@*"
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}

jobs:        
  prod:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'docs@') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Install
        uses: ./.github/actions/install
      - name: Compile
        run: pnpm compile
      - name: Build local preview bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm --filter=@fern-docs/bundle run docs:make:local
      - name: Synthesize local preview bundle
        run: pnpm --filter=@fern-platform/cdk run deploy-app:prod