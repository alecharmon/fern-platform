name: Deploy Local Preview (DEV)

on:
  push:
    branches:
      - app

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: "buildwithfern"
  FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.FERN_GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::985111089818:role/github-ci"
          aws-region: us-east-1
      - name: Install
        uses: ./.github/actions/install
      - name: Compile
        run: pnpm compile
      - name: Generate dev version
        id: version
        run: echo "version=dev-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
      - name: Build local preview bundle
        run: pnpm --filter=@fern-docs/bundle run docs:make:local
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_PUBLIC_DOCS_BUNDLE_VERSION: ${{ steps.version.outputs.version }}
      - name: Synthesize local preview bundle
        run: pnpm --filter=@fern-platform/cdk run deploy-app:dev2
