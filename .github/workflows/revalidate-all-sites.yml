name: Revalidate All Sites

on:
  workflow_call:
    inputs:
      batch_size:
        description: "Number of sites per batch (default: 24)"
        required: false
        default: "24"
        type: string
      auto_rollback:
        description: "Automatically rollback on bad deploy detection (default: true)"
        required: false
        default: "true"
        type: string
      rollback_threshold:
        description: "Percentage of failing sites to trigger rollback (default: 10)"
        required: false
        default: "10"
        type: string
      page_failure_threshold:
        description: "Per-site page failure percentage to consider a site failed (default: 50)"
        required: false
        default: "50"
        type: string
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of sites per batch (default: 24)"
        required: false
        default: "24"
        type: string
      auto_rollback:
        description: "Automatically rollback on bad deploy detection (default: true)"
        required: false
        default: "true"
        type: string
      rollback_threshold:
        description: "Percentage of failing sites to trigger rollback (default: 10)"
        required: false
        default: "10"
        type: string
      page_failure_threshold:
        description: "Per-site page failure percentage to consider a site failed (default: 50)"
        required: false
        default: "50"
        type: string

jobs:
  notify-start:
    name: Notify revalidation starting
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "`${{ github.ref_name }}` live, revalidation starting..."
            }

  prepare:
    name: Prepare site batches
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.split.outputs.batches }}
      total_sites: ${{ steps.split.outputs.total_sites }}
    steps:
      - uses: actions/checkout@v6

      - name: Split sites into batches
        id: split
        run: |
          # Read sites from the monitor sites list
          # Convert ',warm' suffix to '|warm' so it survives comma-based batch splitting, then strip bare trailing commas
          sites=$(cat playwright/checks/sites.csv | sed 's/,warm$/|warm/' | sed 's/,$//' | grep -v '^$')
          total=$(echo "$sites" | wc -l)
          echo "total_sites=$total" >> $GITHUB_OUTPUT

          batch_size=${{ inputs.batch_size || '24' }}

          # Create JSON array of batches
          batches="["
          batch_num=0
          current_batch=""
          count=0

          while IFS= read -r site; do
            if [ -z "$site" ]; then
              continue
            fi

            if [ $count -ge $batch_size ]; then
              # Close current batch and start new one
              if [ -n "$current_batch" ]; then
                batches="${batches}{\"index\":$batch_num,\"sites\":\"$current_batch\"},"
                batch_num=$((batch_num + 1))
              fi
              current_batch="$site"
              count=1
            else
              if [ -z "$current_batch" ]; then
                current_batch="$site"
              else
                current_batch="${current_batch},$site"
              fi
              count=$((count + 1))
            fi
          done <<< "$sites"

          # Add final batch
          if [ -n "$current_batch" ]; then
            batches="${batches}{\"index\":$batch_num,\"sites\":\"$current_batch\"}"
          fi

          batches="${batches}]"

          # Remove trailing comma if present before closing bracket
          batches=$(echo "$batches" | sed 's/,]/]/')

          echo "batches=$batches" >> $GITHUB_OUTPUT
          echo "Created $((batch_num + 1)) batches from $total sites"

  revalidate:
    name: Revalidate batch ${{ matrix.batch.index }}
    needs: prepare
    runs-on: Seed
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        batch: ${{ fromJson(needs.prepare.outputs.batches) }}
    steps:
      - name: Revalidate sites in batch
        id: revalidate
        env:
          REVALIDATE_AUTH_TOKEN: ${{ secrets.FERN_TOKEN }}
          SITES: ${{ matrix.batch.sites }}
        run: |
          echo "Processing batch ${{ matrix.batch.index }}"

          # Convert comma-separated sites to newline-separated
          echo "$SITES" | tr ',' '\n' > sites_batch.txt

          # Count sites in this batch
          site_count=$(wc -l < sites_batch.txt)
          echo "Revalidating $site_count sites with 24 parallel requests (3x 8 cores)"

          # Create files to track results
          touch failed_sites.txt
          touch page_stats.csv

          # Function to revalidate a single site and track page-level failures
          revalidate_site() {
            local entry="$1"
            local domain="$entry"
            local use_warm=false

            # Check if the entry ends with '|warm' to use invalidate+warm instead of revalidate
            if [[ "$entry" == *"|warm" ]]; then
              domain="${entry%|warm}"
              use_warm=true
            fi

            local output_file=$(mktemp)
            local url

            if [ "$use_warm" = true ]; then
              url="https://$domain/api/fern-docs/invalidate?warm=true"
              echo "Using invalidate+warm for: $domain"
            else
              url="https://$domain/api/fern-docs/revalidate"
            fi

            # Run curl, capture body to file and HTTP status code
            local http_code
            http_code=$(curl -s -L -o "$output_file" -w "%{http_code}" \
                 -H "Authorization: Bearer $REVALIDATE_AUTH_TOKEN" \
                 "$url" \
                 --max-time 800) || http_code="000"

            # Display the output for logging
            cat "$output_file"

            # Check for HTTP-level failure
            if [[ ! "$http_code" =~ ^2 ]]; then
              echo "FAILED: $domain (HTTP $http_code)"
              echo "$domain" >> failed_sites.txt
              rm -f "$output_file"
              return
            fi

            # Parse page-level stats from revalidate-pages-finished lines
            local total_pages=$(grep 'revalidate-pages-finished' "$output_file" | grep -oP 'total=\K[0-9]+' | awk '{s+=$1} END {print s+0}')
            local completed_pages=$(grep 'revalidate-pages-finished' "$output_file" | grep -oP 'completed=\K[0-9]+' | awk '{s+=$1} END {print s+0}')
            local failed_pages=$(grep 'revalidate-pages-finished' "$output_file" | grep -oP 'failed=\K[0-9]+' | awk '{s+=$1} END {print s+0}')

            # Record page-level stats
            if [ "$total_pages" -gt 0 ]; then
              echo "$domain,$total_pages,$completed_pages,$failed_pages" >> page_stats.csv
            fi

            echo "SUCCESS: $domain (pages: $completed_pages/$total_pages completed, $failed_pages failed)"

            rm -f "$output_file"
          }

          export -f revalidate_site
          export REVALIDATE_AUTH_TOKEN

          # Run revalidation with 24 parallel processes (3x 8 cores)
          # Use || true to prevent xargs from failing the job
          cat sites_batch.txt | xargs -P 24 -I {} bash -c 'revalidate_site "$@"' _ {} || true

          # Output failed sites for this batch
          if [ -s failed_sites.txt ]; then
            failed=$(cat failed_sites.txt | tr '\n' ',' | sed 's/,$//')
            echo "failed_sites=$failed" >> $GITHUB_OUTPUT
            echo "Failed sites in batch ${{ matrix.batch.index }}: $failed"
          else
            echo "failed_sites=" >> $GITHUB_OUTPUT
          fi

          echo "Batch ${{ matrix.batch.index }} completed"

      - name: Upload failed sites
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: failed-sites-batch-${{ matrix.batch.index }}
          path: failed_sites.txt
          retention-days: 1

      - name: Upload page stats
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: page-stats-batch-${{ matrix.batch.index }}
          path: page_stats.csv
          retention-days: 1

  summary:
    name: Revalidation summary
    needs: [prepare, revalidate]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      should_rollback: ${{ steps.analyze.outputs.should_rollback }}
      prev_tag: ${{ steps.find_prev_tag.outputs.prev_tag }}
      failed_sites: ${{ steps.analyze.outputs.failed_sites }}
    steps:
      - name: Download failed site artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: failed-sites-batch-*
          path: failed-sites-artifacts

      - name: Download page stats artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: page-stats-batch-*
          path: page-stats-artifacts

      - name: Analyze revalidation results
        id: analyze
        run: |
          page_failure_threshold=${{ inputs.page_failure_threshold || '50' }}
          rollback_threshold=${{ inputs.rollback_threshold || '10' }}
          total_sites=${{ needs.prepare.outputs.total_sites }}

          echo "## Revalidation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Total sites: $total_sites" >> $GITHUB_STEP_SUMMARY
          echo "- Batch size: ${{ inputs.batch_size || '24' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Parallel requests per batch: 24 (3x 8 cores)" >> $GITHUB_STEP_SUMMARY

          # Collect all HTTP-level failed sites
          all_failed=""
          for f in failed-sites-artifacts/*/failed_sites.txt; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              sites=$(cat "$f" | tr '\n' ',' | sed 's/,$//')
              if [ -n "$sites" ]; then
                if [ -n "$all_failed" ]; then
                  all_failed="$all_failed,$sites"
                else
                  all_failed="$sites"
                fi
              fi
            fi
          done

          if [ -n "$all_failed" ]; then
            all_failed=$(echo "$all_failed" | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
          fi

          http_failed_count=0
          if [ -n "$all_failed" ]; then
            http_failed_count=$(echo "$all_failed" | tr ',' '\n' | grep -c . || echo 0)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### HTTP-Level Failed Sites ($http_failed_count)" >> $GITHUB_STEP_SUMMARY
            echo "$all_failed" | tr ',' '\n' | while read site; do
              [ -n "$site" ] && echo "- $site" >> $GITHUB_STEP_SUMMARY
            done
            echo "failed_sites=$all_failed" >> $GITHUB_OUTPUT
          else
            echo "failed_sites=" >> $GITHUB_OUTPUT
          fi

          # Analyze page-level stats
          page_bad_count=0
          page_bad_sites=""
          total_revalidated=0

          for f in page-stats-artifacts/*/page_stats.csv; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              while IFS=',' read -r domain total completed failed; do
                if [ -n "$total" ] && [ "$total" -gt 0 ]; then
                  total_revalidated=$((total_revalidated + 1))
                  rate=$((failed * 100 / total))
                  if [ "$rate" -ge "$page_failure_threshold" ]; then
                    page_bad_count=$((page_bad_count + 1))
                    if [ -n "$page_bad_sites" ]; then
                      page_bad_sites="$page_bad_sites,$domain"
                    else
                      page_bad_sites="$domain"
                    fi
                  fi
                fi
              done < "$f"
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Page-Level Revalidation Stats" >> $GITHUB_STEP_SUMMARY
          echo "- Sites with page data: $total_revalidated" >> $GITHUB_STEP_SUMMARY
          echo "- Sites with >${page_failure_threshold}% page failures: $page_bad_count" >> $GITHUB_STEP_SUMMARY

          if [ -n "$page_bad_sites" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Sites with High Page Failure Rates" >> $GITHUB_STEP_SUMMARY
            echo "$page_bad_sites" | tr ',' '\n' | while read site; do
              [ -n "$site" ] && echo "- $site" >> $GITHUB_STEP_SUMMARY
            done
          fi

          # Rollback decision is based only on page-level failures
          # Only rollback if sites with >threshold% page failures exceeds rollback_threshold% of total sites
          should_rollback=false
          page_bad_percentage=0

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deploy Health" >> $GITHUB_STEP_SUMMARY

          if [ "$total_sites" -gt 0 ] && [ "$page_bad_count" -gt 0 ]; then
            page_bad_percentage=$((page_bad_count * 100 / total_sites))
            echo "- Sites with >${page_failure_threshold}% page failures: $page_bad_count / $total_sites ($page_bad_percentage%)" >> $GITHUB_STEP_SUMMARY
            echo "- HTTP-level failures: $http_failed_count" >> $GITHUB_STEP_SUMMARY
            echo "- Rollback threshold: $rollback_threshold%" >> $GITHUB_STEP_SUMMARY

            if [ "$page_bad_percentage" -ge "$rollback_threshold" ]; then
              should_rollback=true
              echo "- **BAD DEPLOY DETECTED - auto-rollback will be triggered**" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Deploy health within acceptable range" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "$http_failed_count" -gt 0 ]; then
            echo "- HTTP-level failures: $http_failed_count (not counted toward rollback)" >> $GITHUB_STEP_SUMMARY
            echo "- Sites with >${page_failure_threshold}% page failures: 0" >> $GITHUB_STEP_SUMMARY
            echo "- Deploy health within acceptable range" >> $GITHUB_STEP_SUMMARY
          else
            echo "All sites revalidated successfully!" >> $GITHUB_STEP_SUMMARY
          fi

          echo "should_rollback=$should_rollback" >> $GITHUB_OUTPUT
          echo "bad_count=$page_bad_count" >> $GITHUB_OUTPUT
          echo "bad_percentage=$page_bad_percentage" >> $GITHUB_OUTPUT

      - name: Checkout for tag lookup
        if: steps.analyze.outputs.should_rollback == 'true' && inputs.auto_rollback != 'false'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch tags and find previous version
        if: steps.analyze.outputs.should_rollback == 'true' && inputs.auto_rollback != 'false'
        id: find_prev_tag
        run: |
          git fetch --tags

          current_ref="${{ github.ref_name }}"

          # Only auto-rollback for docs@ tag deployments
          if [[ "$current_ref" != docs@* ]]; then
            echo "Skipping auto-rollback: not a docs@ tag deployment (ref: $current_ref)"
            echo "prev_tag=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Find the previous docs@ tag by semver sort
          prev_tag=$(git tag -l 'docs@*' --sort=-version:refname | awk -v curr="$current_ref" 'found{print;exit} $0==curr{found=1}')

          if [ -z "$prev_tag" ]; then
            echo "Could not find previous tag to rollback to"
            echo "prev_tag=" >> $GITHUB_OUTPUT
          else
            echo "Previous tag: $prev_tag (current: $current_ref)"
            echo "prev_tag=$prev_tag" >> $GITHUB_OUTPUT
          fi

      - name: Build Slack message
        if: always()
        id: slack_message
        run: |
          should_rollback="${{ steps.analyze.outputs.should_rollback }}"
          bad_count="${{ steps.analyze.outputs.bad_count }}"
          bad_percentage="${{ steps.analyze.outputs.bad_percentage }}"
          failed_sites="${{ steps.analyze.outputs.failed_sites }}"
          prev_tag="${{ steps.find_prev_tag.outputs.prev_tag }}"
          current_ref="${{ github.ref_name }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$should_rollback" = "true" ] && [ -n "$prev_tag" ]; then
            echo "text=*BAD DEPLOY DETECTED - Auto-rollback triggered*\n\n$bad_count sites ($bad_percentage%) had high page failure rates for \`$current_ref\`.\nRollback to \`$prev_tag\` has been dispatched.\n\n<$run_url|View run>" >> $GITHUB_OUTPUT
          elif [ "$should_rollback" = "true" ]; then
            echo "text=*BAD DEPLOY DETECTED - Manual rollback required*\n\n$bad_count sites ($bad_percentage%) had high page failure rates for \`$current_ref\`.\nAutomatic rollback could not determine previous tag.\n\n<$run_url|View run>" >> $GITHUB_OUTPUT
          elif [ -n "$failed_sites" ]; then
            failed_count=$(echo "$failed_sites" | tr ',' '\n' | grep -c .)
            echo "text=Revalidation Complete, $failed_count site(s) failed, retrying\n\n<$run_url|View run>" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: steps.slack_message.outputs.text != ''
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "${{ steps.slack_message.outputs.text }}"
            }

  retry:
    name: Retry failed sites
    needs: summary
    runs-on: Seed
    if: always() && needs.summary.outputs.failed_sites != '' && needs.summary.outputs.should_rollback != 'true'
    outputs:
      still_failed: ${{ steps.retry.outputs.still_failed }}
    steps:
      - name: Retry failed sites one at a time
        id: retry
        env:
          REVALIDATE_AUTH_TOKEN: ${{ secrets.FERN_TOKEN }}
          FAILED_SITES: ${{ needs.summary.outputs.failed_sites }}
        run: |
          echo "Retrying failed sites one at a time..."
          echo "$FAILED_SITES" | tr ',' '\n' > retry_sites.txt

          touch still_failed.txt

          while IFS= read -r domain; do
            if [ -z "$domain" ]; then
              continue
            fi

            echo "Retrying: $domain"
            output_file=$(mktemp)

            http_code=$(curl -s -L -o "$output_file" -w "%{http_code}" \
                 -H "Authorization: Bearer $REVALIDATE_AUTH_TOKEN" \
                 "https://$domain/api/fern-docs/revalidate" \
                 --max-time 800) || http_code="000"

            cat "$output_file"
            rm -f "$output_file"

            if [[ ! "$http_code" =~ ^2 ]]; then
              echo "RETRY FAILED: $domain (HTTP $http_code)"
              echo "$domain" >> still_failed.txt
            else
              echo "RETRY SUCCESS: $domain"
            fi

            # Brief pause between retries
            sleep 2
          done < retry_sites.txt

          if [ -s still_failed.txt ]; then
            still_failed=$(cat still_failed.txt | tr '\n' ',' | sed 's/,$//')
            echo "still_failed=$still_failed" >> $GITHUB_OUTPUT
            echo "Sites still failing after retry: $still_failed"
          else
            echo "still_failed=" >> $GITHUB_OUTPUT
            echo "All sites succeeded on retry!"
          fi

  retry-summary:
    name: Retry summary
    needs: [summary, retry]
    runs-on: ubuntu-latest
    if: always() && needs.retry.result == 'success'
    steps:
      - name: Build retry summary message
        id: retry_message
        run: |
          still_failed="${{ needs.retry.outputs.still_failed }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -n "$still_failed" ]; then
            failed_count=$(echo "$still_failed" | tr ',' '\n' | grep -c .)
            site_list=$(echo "$still_failed" | tr ',' '\n' | awk 'NF{printf "%s- %s", (c++>0?"\\n":""), $0}')
            echo "text=*Revalidation retry complete, $failed_count site(s) still failing:*\n\n$site_list\n\n<$run_url|View run>" >> $GITHUB_OUTPUT
          else
            echo "text=Revalidation retry complete, all sites succeeded!\n\n<$run_url|View run>" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.FERNIE_SLACK_APP_TOKEN }}
          payload: |
            {
              "channel": "#docs-notifs",
              "text": "${{ steps.retry_message.outputs.text }}"
            }

  rollback:
    name: Auto-rollback
    needs: summary
    if: needs.summary.outputs.should_rollback == 'true' && inputs.auto_rollback != 'false' && needs.summary.outputs.prev_tag != ''
    uses: ./.github/workflows/rollback.yml
    secrets: inherit
    with:
      target_tag: ${{ needs.summary.outputs.prev_tag }}
