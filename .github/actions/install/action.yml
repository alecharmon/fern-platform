name: Setup pnpm
description: Install the ts toolchain and dependencies

inputs:
  run_install:
    description: run pnpm install
    required: false
    default: "true"
  registry-url:
    description: npm registry URL for authentication
    required: false
    default: ""

runs:
  using: "composite"

  steps:
    - name: ⎔ Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.27.0
        standalone: true # Download from GitHub releases instead of npm registry to avoid transient 403 errors
        run_install: false # https://github.com/pnpm/action-setup?tab=readme-ov-file#use-cache-to-reduce-installation-time

    - name: ⎔ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        registry-url: ${{ inputs.registry-url }}
        # Disable built-in cache to avoid race conditions when multiple parallel
        # jobs try to save the same cache key simultaneously. Caching is handled
        # by an explicit actions/cache step below instead.

    - name: 📦 Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: 📦 Restore pnpm store cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: 📥 Install dependencies
      if: ${{ inputs.run_install == 'true' }}
      shell: bash
      run: pnpm install
