[tool.poetry]
name = "fern-ai"
version = "0.1.0"
description = ""
authors = []

packages = [
    { include = "fai", from = "src" },
    { include = "utils", from = "src" }
]

[[tool.poetry.source]]
name = "fern"
url = "https://pypi.buildwithfern.com"
priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.120.1"
pydantic = "^2.8.0"
requests = "^2.31.0"
types-requests = "^2.28.11"
PyJWT = "^2.6.0"
cryptography = "^44.0.0"
posthog = "^6.7.8"
pyyaml = "^6.0.1"
cachetools = "^5.3.3"
types-cachetools = "^5.3.0.7"
uvicorn = {version = "^0.34.3", python = ">=3.9"}
openai = "^1.91.0"
dotenv = "^0.9.9"
sqlalchemy = "^2.0.41"
alembic = "^1.16.2"
asyncpg = "^0.30.0"
greenlet = "^3.2.3"
numpy = "^2.3.1"
pandas = "^2.3.1"
scikit-learn = "^1.7.0"
anthropic = "^0.57.1"
turbopuffer = "^0.5.14"
cohere = "^5.17.0"
apscheduler = "^3.11.0"
fern-fern-venus-sdk = { version = "*", source = "fern" }
tiktoken = "^0.11.0"
slack-sdk = "^3.36.0"
python-multipart = "^0.0.20"
upstash-redis = "^1.4.0"
aioboto3 = "^13.0.0"
markdownify = "^1.2.0"
tenacity = "^8.2.0"
beautifulsoup4 = "^4.12.0"

[tool.poetry.scripts]
start = "fai.main:start"
openapi = "src.utils.openapi:openapi"

[tool.poetry.group.dev.dependencies]
aiosqlite = "^0.21.0"
mypy = "^1.17.1"
pytest = "^7.1.3"
pytest-asyncio = "^0.23.0"
black = "^24.3.0"
isort = "^5.13.2"
ruff = "^0.1.0"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["fai", "tests", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 2
line_length = 120
profile = "black"
use_parentheses = true
known_first_party = ["fai", "tests", "utils"]
src_paths = ["src"]

[tool.autoflake]
in-place = true
