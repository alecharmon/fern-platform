[tool.poetry]
name = "oculus"
version = "0.1.0"
description = "Ask Fern Evaluation Pipeline"
authors = []
packages = [{include = "oculus", from = "src"}]

[[tool.poetry.source]]
name = "fern"
url = "https://pypi.buildwithfern.com"
priority = "supplemental"

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.57.1"
pydantic = "^2.8.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.0"
fern-ai = {path = "../fai", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
mypy = "^1.8.0"
black = "^24.3.0"
isort = "^5.13.2"
ruff = "^0.1.0"

[tool.poetry.scripts]
oculus = "oculus.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["oculus"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 120

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 2
line_length = 120
profile = "black"
use_parentheses = true
known_first_party = ["oculus"]
src_paths = ["src"]

[tool.autoflake]
in-place = true
