[tool.poetry]
name = "fai-discord-bot"
version = "0.1.0"
description = "Discord bot for Fern AI"
authors = []

packages = [
    { include = "*", from = "src" }
]

[[tool.poetry.source]]
name = "fern"
url = "https://pypi.buildwithfern.com"
priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
discord-py = "^2.6.3"
python-dotenv = "^0.21.1"
fern-ai = { path = "../fai", develop = true }

[tool.poetry.scripts]
start = "src.main:start"

[tool.poetry.group.dev.dependencies]
mypy = "^1.17.1"
pytest = "^7.1.3"
pytest-asyncio = "^0.23.0"
black = "^24.3.0"
isort = "^5.13.2"
ruff = "^0.1.0"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["fai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
extend-exclude = "deploy/node_modules"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 2
line_length = 120
profile = "black"
use_parentheses = true
known_first_party = ["fai"]
src_paths = ["src"]
