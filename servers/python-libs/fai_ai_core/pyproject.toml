[tool.poetry]
name = "fai-ai-core"
version = "0.1.0"
description = "Shared AI core library for Fern services"
authors = ["Fern Team"]
packages = [{ include = "fai_ai_core" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = "^2.8.0"
openai = "^1.91.0"
anthropic = "^0.74.0"
cohere = "^5.17.0"
turbopuffer = "^1.7.0"
aioboto3 = "^13.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.1.3"
pytest-asyncio = "^0.23.0"
mypy = "^1.17.1"
ruff = "^0.9.0"
black = "^24.3.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["fai_ai_core", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
