[tool.poetry]
name = "fdr-python-library-docs-parser"
version = "0.1.0"
description = "Lambda for parsing Python library documentation"

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.34"
griffe = "^1.5"
gitpython = "^3.1"
docstring-parser = "^0.16"
pydantic = "^2.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.0"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
