# Fern Self-Hosted Kubernetes Deployment
#
# This deployment assumes your fern folder is baked into the Docker image.
# Build your custom image with your fern folder, then deploy using:
#
#   pnpm k8s:start --image your-registry/fern-docs:latest
#
# Or manually replace IMAGE_PLACEHOLDER below with your image name.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fern-docs
  labels:
    app: fern-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fern-docs
  template:
    metadata:
      labels:
        app: fern-docs
    spec:
      securityContext:
        # Run as non-root user for extra security
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: fern-docs
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: docs
              containerPort: 3000
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: SKIP_WARMUP
              value: "false"
            - name: FERN_LOG_LEVEL
              value: "info"
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 30
