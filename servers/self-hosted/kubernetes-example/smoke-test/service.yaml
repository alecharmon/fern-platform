apiVersion: v1
kind: Service
metadata:
  name: fern-docs-smoke-test
  labels:
    app: fern-docs-smoke-test
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: fern-docs-smoke-test
