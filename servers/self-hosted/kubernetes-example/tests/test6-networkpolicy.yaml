# NetworkPolicy for runtime-gen-airgapped-fail: Block all egress except DNS
# This simulates an air-gapped environment
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fern-docs-air-gapped
  namespace: runtime-gen-airgapped-fail
spec:
  podSelector:
    matchLabels:
      app: fern-docs
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
