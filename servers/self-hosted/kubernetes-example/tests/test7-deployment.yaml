# Test: basepath-test
# Runtime basePath patching - SHOULD PASS
# Image: fern-test-basepath (full docs pre-generated, NEXT_PUBLIC_BASE_PATH=/docs at runtime)
# Network: Open
# Expected: Pod becomes ready and docs UI is accessible at /docs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fern-docs
  namespace: basepath-test
  labels:
    app: fern-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fern-docs
  template:
    metadata:
      labels:
        app: fern-docs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: fern-docs
          image: fern-test-basepath:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
            - containerPort: 8081
          env:
            - name: NEXT_PUBLIC_BASE_PATH
              value: "/docs"
            - name: FERN_LOG_LEVEL
              value: "debug"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
