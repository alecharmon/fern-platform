# Test: arbitrary-uid-test
# Arbitrary UID (1000) with writable filesystem - SHOULD PASS
# Image: fern-test-full-gen (full docs pre-generated)
# Network: Open
# Expected: Pod becomes ready - run.sh dynamically adds UID 1000 to /etc/passwd
# Key: This reproduces the exact customer failure where Kubernetes runs the container
#      as UID 1000 (via securityContext.runAsUser) and PostgreSQL initdb fails with:
#      "initdb: could not look up effective user ID 1000: user does not exist"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fern-docs
  namespace: arbitrary-uid-test
  labels:
    app: fern-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fern-docs
  template:
    metadata:
      labels:
        app: fern-docs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: fern-docs
          image: fern-test-full-gen:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
            - containerPort: 8081
          env:
            - name: FERN_LOG_LEVEL
              value: "debug"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
