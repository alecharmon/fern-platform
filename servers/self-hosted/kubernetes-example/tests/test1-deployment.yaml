# Test: runtime-gen-network-ok
# Runtime generation with network access and FERN_LOG_LEVEL=DEBUG (uppercase) - SHOULD PASS
# Image: fern-test-no-gen (no pre-generation)
# Network: Open (no NetworkPolicy)
# Expected: Pod becomes ready - can fetch buf deps at runtime
# Also verifies: uppercase FERN_LOG_LEVEL is normalized to lowercase (bug fix)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fern-docs
  namespace: runtime-gen-network-ok
  labels:
    app: fern-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fern-docs
  template:
    metadata:
      labels:
        app: fern-docs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: fern-docs
          image: fern-test-no-gen:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
            - containerPort: 8081
          env:
            - name: FERN_LOG_LEVEL
              value: "DEBUG"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
