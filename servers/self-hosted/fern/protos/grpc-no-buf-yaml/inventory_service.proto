syntax = "proto3";

package grpc_no_buf_yaml.v1;

option go_package = "github.com/fern-api/fern-platform/grpc_no_buf_yaml/v1";

// Import from buf.build/googleapis/googleapis to test buf cache behavior
// This requires network access to fetch the dependency from buf.build
// NOTE: This directory intentionally has NO buf.yaml file to test introspection
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// InventoryService demonstrates a gRPC service with external buf dependencies
// but WITHOUT a buf.yaml file - dependencies are specified in generators.yml
// Used to test the buf.yaml introspection feature for air-gapped deployments
service InventoryService {
  // Get inventory item by ID
  rpc GetItem(GetItemRequest) returns (GetItemResponse) {
    option (google.api.http) = {
      get: "/inventory/v1/items/{item_id}"
    };
  }

  // List all inventory items
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse) {
    option (google.api.http) = {
      get: "/inventory/v1/items"
    };
  }

  // Update inventory quantity
  rpc UpdateQuantity(UpdateQuantityRequest) returns (UpdateQuantityResponse) {
    option (google.api.http) = {
      patch: "/inventory/v1/items/{item_id}/quantity"
      body: "*"
    };
  }
}

message GetItemRequest {
  string item_id = 1;
}

message GetItemResponse {
  InventoryItem item = 1;
}

message ListItemsRequest {
  string warehouse_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListItemsResponse {
  repeated InventoryItem items = 1;
  string next_page_token = 2;
}

message UpdateQuantityRequest {
  string item_id = 1;
  int32 quantity_delta = 2;
  string reason = 3;
}

message UpdateQuantityResponse {
  InventoryItem item = 1;
}

message InventoryItem {
  string id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  int32 quantity = 5;
  string warehouse_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  ItemStatus status = 9;
}

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_IN_STOCK = 1;
  ITEM_STATUS_LOW_STOCK = 2;
  ITEM_STATUS_OUT_OF_STOCK = 3;
  ITEM_STATUS_DISCONTINUED = 4;
}
