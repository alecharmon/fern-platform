[tool.poetry]
name = "fai-chat"
version = "0.1.0"
description = "FAI Chat Lambda Function"
authors = ["Fern Team"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.120.1"
uvicorn = "^0.34.0"
pydantic = "^2.8.0"
anthropic = "^0.74.0"
openai = "^1.91.0"
cohere = "^5.17.0"
turbopuffer = "^1.7.0"
httpx = "*"
tiktoken = "^0.11.0"
sqlalchemy = "^2.0.41"
asyncpg = "^0.30.0"
upstash-redis = "^1.4.0"
aioboto3 = "^13.0.0"
fern-fai-sdk = "^0.1.9"
dotenv = "^0.9.9"
fern-fdr-lambda-sdk = "^0.140.3"
posthog = "^7.9.12"
sentry-sdk = {version = "^2.19.0", extras = ["fastapi"]}
cachetools = "^5.3.3"
PyJWT = "^2.6.0"
fai-ai-core = { path = "../python-libs/fai_ai_core", develop = true }

[tool.poetry.group.dev.dependencies]
mypy = "^1.17.1"
pytest = "^7.1.3"
pytest-asyncio = "^0.23.0"
black = "^26.3.1"
isort = "^5.13.2"
ruff = "^0.1.0"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 2
line_length = 120
profile = "black"
use_parentheses = true
known_first_party = ["src", "tests"]
src_paths = ["src"]

[tool.autoflake]
in-place = true
