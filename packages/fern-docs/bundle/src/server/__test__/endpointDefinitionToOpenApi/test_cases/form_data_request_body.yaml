endpoint_input:
  id: form-endpoint
  method: POST
  path:
    - type: literal
      value: /api/form
  requests:
    - contentType: multipart/form-data
      body:
        type: formData
        fields:
          - type: property
            key: name
            description: The name of the user.
            valueShape:
              type: primitive
              value:
                type: string
          - type: file
            key: avatar
            description: The user's avatar image.
            isOptional: false
          - type: files
            key: documents
            description: Supporting documents to upload.
            isOptional: true
endpoint_definitions: {}
output:
  openapi: 3.1.0
  info:
    title: API
    version: 1.0.0
  paths:
    /api/form:
      post:
        operationId: form-endpoint
        summary: form-endpoint
        responses:
          "200":
            description: Successful response
        requestBody:
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: The name of the user.
                  avatar:
                    type: string
                    format: binary
                    description: The user's avatar image.
                  documents:
                    type: array
                    items:
                      type: string
                      format: binary
                    description: Supporting documents to upload.
                required:
                  - name
                  - avatar
