services:
  jaeger:
    # Set up Jaeger for local OpenTelemetry trace collection
    # Set OTEL_EXPORTER_OTLP_ENDPOINT locally to point to this service
    # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    image: jaegertracing/all-in-one:1.54
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
