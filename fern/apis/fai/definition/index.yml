docs: FAI Index API

imports:
  commons: ./commons.yml

service:
  auth: false
  base-path: /index
  endpoints:
    reconstructQueryIndex:
      docs: Reconstruct the query index for a given domain
      path: /{domain}/reconstruct
      method: POST
      audiences:
        - internal
      path-parameters:
        domain: string
      errors:
        - commons.BadRequestError
        - commons.InternalError

    syncToQueryIndex:
      docs: Sync an index with the query index
      path: /{domain}/sync
      method: POST
      audiences:
        - internal
      path-parameters:
        domain: string
      request:
        name: SyncIndexRequest
        query-parameters:
          index_name:
            type: string
            docs: The name of the index to sync
      errors:
        - commons.BadRequestError
        - commons.InternalError
