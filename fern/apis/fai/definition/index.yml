docs: FAI Index API

imports:
  commons: ./commons.yml

service:
  auth: false
  base-path: /index
  endpoints:
    indexDocument:
      docs: Index a document for a given domain
      path: /{domain}
      method: POST
      audiences:
        - customers
      path-parameters:
        domain: string
      request:
        name: IndexRequest
        body:
          properties:
            index_name:
              type: optional<string>
              default: custom
              docs: The name of the index to which the document will be added
            document_id:
              type: string
              docs: A unique identifier for the document
            context:
              type: list<string>
              docs: The context of the document, as a list of strings, that will be indexed.
            document:
              type: string
              docs: The content of the document that will be returned in the tool response
      errors:
        - commons.BadRequestError
        - commons.InternalError

    getDocumentById:
      docs: Get a document for a given domain
      path: /{domain}
      method: GET
      path-parameters:
        domain: string
      request:
        name: GetRequest
        query-parameters:
          document_id:
            type: string
            docs: The unique identifier of the document to get
      errors:
        - commons.BadRequestError
        - commons.InternalError

    updateDocument:
      docs: Update a document for a given domain
      path: /{domain}/update
      method: POST
      audiences:
        - customers
      path-parameters:
        domain: string
      request:
        name: UpdateRequest
        query-parameters:
          document_id:
            type: string
            docs: The unique identifier of the document to update
          is_active:
            type: boolean
            docs: Whether the document is active
          context:
            type: list<string>
            docs: The context of the document, as a list of strings, that will be indexed.
          document:
            type: string
            docs: The content of the document that will be returned in the tool response. If not provided, the document will be removed from the index.
      response: Document
      errors:
        - commons.BadRequestError
        - commons.InternalError

    getDocuments:
      docs: Retrieve all paginated documents for a given domain
      path: /{domain}
      method: GET
      audiences:
        - internal
      path-parameters:
        domain:
          type: string
          docs: The domain to retrieve documents for
      request:
        name: GetDocumentsRequest
        query-parameters:
          page: optional<integer>
          limit: optional<integer>
      response: DocumentList
      errors:
        - commons.BadRequestError
        - commons.InternalError

    syncToQueryIndex:
      docs: Sync an index with the query index
      path: /{domain}/sync
      method: POST
      audiences:
        - internal
      path-parameters:
        domain: string
      request:
        name: SyncIndexRequest
        query-parameters:
          index_name:
            type: string
            docs: The name of the index to sync
      errors:
        - commons.BadRequestError
        - commons.InternalError

types:
  Document:
    properties:
      document_id: string
      is_active: boolean
      context: list<string>
      domain: string
      document: string
      created_at: datetime
      updated_at: datetime

  DocumentList:
    properties:
      documents: list<Document>
      pagination: Pagination

  Pagination:
    properties:
      total: integer
      page: integer
      limit: integer