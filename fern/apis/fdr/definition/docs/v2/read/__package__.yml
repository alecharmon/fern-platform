# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  rootCommons: ../../../commons.yml
  v1DocsRead: ../../v1/read/__package__.yml
  apiReadV1: ../../../api/v1/read/__package__.yml
  apiReadLatest: ../../../api/latest/__package__.yml
  navigationV1: ../../../navigation/v1/__package__.yml

service:
  base-path: /v2/registry/docs
  auth: true
  audiences:
    - read
  endpoints:
    getDocsUrlMetadata:
      method: POST
      path: /metadata-for-url
      audiences:
        - fdr-lambda
      request:
        name: GetMetadataForUrlRequest
        body:
          properties:
            url: rootCommons.Url
            basepath:
              type: optional<string>
              docs: |
                When provided, returns metadata for the specific (domain, basepath) pair.
                Used for basepath-aware docs sites.
      response: DocsUrlMetadata
      errors:
        - DomainNotRegisteredError

    getDocsForUrl:
      method: POST
      path: /load-with-url
      audiences:
        - fdr-lambda
      request:
        name: LoadDocsForUrlRequest
        body:
          properties:
            url: rootCommons.Url
            excludeApis: optional<boolean>
            basepath:
              type: optional<string>
              docs: |
                When provided, resolves docs for the specific (domain, basepath) pair
                instead of using domain-only lookup. Used for basepath-aware docs sites
                where multiple doc sites share a single custom domain.
      response: LoadDocsForUrlResponse
      errors:
        - DomainNotRegisteredError
        - rootCommons.UnauthorizedError

    ensureDocsInS3:
      method: POST
      path: /ensure-docs-in-s3
      audiences:
        - fdr-lambda
      docs: |
        Loads docs from the database and stores them in S3.
        Returns the S3 URL where the docs definition can be accessed.
        This endpoint always writes to S3 idempotently, regardless of whether the docs already exist in S3.
      request:
        name: EnsureDocsInS3Request
        body:
          properties:
            url: rootCommons.Url
            basepath:
              type: optional<string>
              docs: |
                When provided, uses basepath-aware S3 key format and queries
                the database with (domain, basepath) instead of domain-only.
      response: EnsureDocsInS3Response
      errors:
        - DomainNotRegisteredError
        - rootCommons.UnauthorizedError

    getPrivateDocsForUrl:
      availability: deprecated
      method: POST
      auth: true
      path: /private/load-with-url
      request:
        name: LoadPrivateDocsForUrlRequest
        body:
          properties:
            url: rootCommons.Url
            excludeApis: optional<boolean>
      response: LoadDocsForUrlResponse
      errors:
        - DomainNotRegisteredError
        - rootCommons.UnauthorizedError

    listAllDocsUrls:
      method: GET
      path: /urls/list
      request:
        name: ListAllDocsUrlsRequest
        query-parameters:
          page: optional<integer>
          limit: optional<integer>
          custom:
            type: optional<boolean>
            docs: If true, filters to only docs with a custom URL.
          preview:
            type: optional<boolean>
            docs: If true, returns only preview docs. If false or omitted, returns only non-preview docs.
      response: ListAllDocsUrlsResponse
      docs: Returns a list of all public docs.
      errors:
        - rootCommons.UnauthorizedError
      # pagination:
      #   offset: $request.page
      #   results: $response.urls

    getDocsConfigById:
      method: GET
      path: /{docsConfigId}
      docs: |
        Loads the Docs Config and any referenced APIs by ID.
      path-parameters:
        docsConfigId: rootCommons.DocsConfigId
      response: GetDocsConfigByIdResponse
      errors:
        - DocsDefinitionNotFoundError
    
    prepopulateFdrReadS3Bucket:
      method: POST
      path: /prepopulate-s3-bucket
      docs: Prepopulates the FDR read S3 bucket with docs definitions

    getDocsFields:
      method: POST
      path: /load-fields
      audiences:
        - fdr-lambda
      docs: |
        Loads specific fields from the docs definition with proper conversion (e.g., S3 URLs resolved).
        This is more efficient than loading the entire docs definition when you only need specific parts.
      request:
        name: GetDocsFieldsRequest
        body:
          properties:
            domain: string
            basepath:
              type: optional<string>
              docs: |
                When provided, loads fields for the specific (domain, basepath) pair.
            fields: list<DocsDefinitionField>
      response: GetDocsFieldsResponse
      errors:
        - DomainNotRegisteredError
        - rootCommons.UnauthorizedError

types:
  DocsUrlMetadata:
    properties:
      url: rootCommons.Url
      org: rootCommons.OrgId
      isPreviewUrl: boolean
      gitUrl: optional<rootCommons.Url>
      enableAlgoliaOnPreview: boolean

  GetDocsConfigByIdResponse:
    properties:
      docsConfig: v1DocsRead.DocsConfig
      apis: map<rootCommons.ApiDefinitionId, apiReadV1.ApiDefinition>

  LoadDocsForUrlResponse:
    properties:
      orgId: rootCommons.OrgId
      baseUrl: BaseUrl
      definition: v1DocsRead.DocsDefinition
      lightModeEnabled: boolean

  EnsureDocsInS3Response:
    properties:
      s3Url: rootCommons.Url
      orgId: rootCommons.OrgId

  BaseUrl:
    properties:
      domain: string
      basePath: optional<string>

  ListAllDocsUrlsResponse:
    properties:
      urls: list<DocsDomainItem>

  DocsDomainItem:
    extends: BaseUrl
    properties:
      organizationId: rootCommons.OrgId
      # createdAt: datetime
      updatedAt: datetime

  DocsDefinitionField:
    docs: Fields that can be requested from the docs definition
    enum:
      - BASE_URL
      - FILES_V2
      - APIS_V2
      - APIS
      - PAGES
      - JS_FILES
      - CONFIG
      - ROOT

  GetDocsFieldsResponse:
    docs: Partial docs definition response containing only the requested fields
    properties:
      domain: string
      baseUrl: optional<BaseUrl>
      filesV2: optional<map<rootCommons.FileId, v1DocsRead.File>>
      apisV2: optional<map<rootCommons.ApiDefinitionId, apiReadLatest.ApiDefinition>>
      apis: optional<map<rootCommons.ApiDefinitionId, apiReadV1.ApiDefinition>>
      pages: optional<map<rootCommons.PageId, v1DocsRead.PageContent>>
      jsFiles: optional<map<string, string>>
      config: optional<v1DocsRead.DocsConfig>
      root: optional<navigationV1.RootNode>

errors:
  DocsDefinitionNotFoundError:
    status-code: 404

  DomainNotRegisteredError:
    status-code: 404
