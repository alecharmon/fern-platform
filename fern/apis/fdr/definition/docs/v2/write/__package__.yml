# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  rootCommons: ../../../commons.yml
  v1DocsWrite: ../../v1/write/__package__.yml

service:
  base-path: /v2/registry/docs
  auth: false
  audiences:
    - write
  endpoints:
    startDocsRegister:
      auth: true
      path: /v2/init
      request:
        name: StartDocsRegisterRequestV2
        body:
          properties:
            domain:
              type: string
              docs: A `buildwithfern.com` url
            customDomains: list<string>
            authConfig: optional<AuthConfig>
            orgId: rootCommons.OrgId
            apiId:
              type: rootCommons.ApiId
              availability: deprecated
            filepaths:
              type: list<FilePathInput>
              docs: Relative filepath from docs folder with optional content hash.
            images: optional<list<ImageFilePath>>
      response: v1DocsWrite.StartDocsRegisterResponse
      errors:
        - rootCommons.UnauthorizedError
        - rootCommons.UnavailableError
        - rootCommons.UserNotInOrgError
        - InvalidDomainError
        - InvalidCustomDomainError
        - rootCommons.DomainBelongsToAnotherOrgError
        - rootCommons.InvalidURLError

    startDocsPreviewRegister:
      auth: true
      path: /preview/init
      request:
        name: StartDocsPreviewRegisterRequestV2
        body:
          properties:
            basePath: optional<string>
            orgId: rootCommons.OrgId
            authConfig: optional<AuthConfig>
            filepaths:
              type: list<FilePathInput>
              docs: Relative filepath from docs folder with optional content hash.
            images: optional<list<ImageFilePath>>
      response: StartDocsPreviewRegisterResponse
      errors:
        - rootCommons.UnauthorizedError
        - rootCommons.UnavailableError
        - rootCommons.UserNotInOrgError
        - InvalidDomainError

    finishDocsRegister:
      auth: true
      method: POST
      path: /register/{docsRegistrationId}
      path-parameters:
        docsRegistrationId: v1DocsWrite.DocsRegistrationId
      request:
        name: RegisterDocsRequest
        body:
          properties:
            docsDefinition: v1DocsWrite.DocsDefinition
            excludeApis: optional<boolean>
      errors:
        - rootCommons.UnauthorizedError
        - rootCommons.UserNotInOrgError
        - v1DocsWrite.DocsRegistrationIdNotFound

    transferOwnershipOfDomain:
      auth: true
      method: POST
      path: /transfer-ownership
      request:
        name: TransferDomainOwnershipRequest
        body:
          properties:
            domain: string
            toOrgId: string
      errors:
        - DocsNotFoundError
        - rootCommons.UnauthorizedError
  
    setIsArchived:
      auth: true
      method: POST
      path: /set-is-archived
      request:
        name: SetIsArchivedRequest
        body:
          properties:
            url: rootCommons.Url
            isArchived: boolean
      errors:
        - DocsNotFoundError
        - rootCommons.UnauthorizedError 
    
    setDocsUrlMetadata:
      auth: true
      method: POST
      path: /set-metadata-for-url
      request:
        name: SetDocsUrlMetadataRequest
        body:
          properties:
            url: rootCommons.Url
            githubUrl: optional<rootCommons.Url>
      errors:
        - DocsNotFoundError
        - rootCommons.UnauthorizedError

    addAlgoliaPreviewWhitelistEntry:
      auth: true
      method: POST
      path: /algolia-preview-whitelist/add
      docs: Add a domain to the Algolia preview whitelist to enable search on preview URLs
      request:
        name: AddAlgoliaPreviewWhitelistRequest
        body:
          properties:
            domain: string
      errors:
        - rootCommons.UnauthorizedError

    removeAlgoliaPreviewWhitelistEntry:
      auth: true
      method: POST
      path: /algolia-preview-whitelist/remove
      docs: Remove a domain from the Algolia preview whitelist
      request:
        name: RemoveAlgoliaPreviewWhitelistRequest
        body:
          properties:
            domain: string
      errors:
        - rootCommons.UnauthorizedError

    listAlgoliaPreviewWhitelist:
      auth: true
      method: GET
      path: /algolia-preview-whitelist/list
      docs: List all domains in the Algolia preview whitelist
      response: ListAlgoliaPreviewWhitelistResponse
      errors:
        - rootCommons.UnauthorizedError 

    deleteDocsSite:
      auth: true
      method: POST
      path: /delete
      audiences:
        - fdr-lambda
      docs: Delete a docs site and all associated data including S3 assets
      request:
        name: DeleteDocsSiteRequest
        body:
          properties:
            url: rootCommons.Url
      errors:
        - DocsNotFoundError
        - rootCommons.UnauthorizedError

    # Library Documentation Generation Endpoints
    startLibraryDocsGeneration:
      auth: true
      method: POST
      path: /library-docs/generate
      docs: Start async documentation generation for a library from source code.
      request:
        name: StartLibraryDocsGenerationRequest
        body:
          properties:
            orgId: rootCommons.OrgId
            githubUrl: rootCommons.Url
            language: LibraryLanguage
            config: optional<LibraryDocsConfig>
      response: StartLibraryDocsGenerationResponse
      errors:
        - rootCommons.UnauthorizedError
        - rootCommons.UserNotInOrgError
        - InvalidGithubUrlError
        - UnsupportedLanguageError

    getLibraryDocsGenerationStatus:
      auth: true
      method: GET
      path: /library-docs/status/{jobId}
      docs: Get the status of a documentation generation job.
      path-parameters:
        jobId: LibraryDocsJobId
      response: LibraryDocsGenerationStatus
      errors:
        - LibraryDocsJobNotFoundError

    getLibraryDocsResult:
      auth: true
      method: GET
      path: /library-docs/result/{jobId}
      docs: Get the result of a completed documentation generation job.
      path-parameters:
        jobId: LibraryDocsJobId
      response: LibraryDocsResult
      errors:
        - LibraryDocsJobNotFoundError
        - LibraryDocsGenerationNotCompleteError

types:
  FilePathWithHash:
    properties:
      path: v1DocsWrite.FilePath
      fileHash: 
        type: optional<string>
        docs: SHA-256 hash of the file content in hex format. When provided, enables content-addressed storage and deduplication.

  FilePathInput:
    docs: Accepts either a plain file path string or an object with path and optional hash for content-addressed storage.
    discriminated: false
    union:
      - v1DocsWrite.FilePath
      - FilePathWithHash

  ImageFilePath:
    properties:
      filePath: v1DocsWrite.FilePath
      width: double
      height: double
      blurDataUrl: optional<string>
      alt: optional<string>
      fileHash:
        type: optional<string>
        docs: SHA-256 hash of the file content in hex format. When provided, enables content-addressed storage and deduplication.

  StartDocsPreviewRegisterResponse:
    extends: v1DocsWrite.StartDocsRegisterResponse
    properties:
      previewUrl: string

  ListAlgoliaPreviewWhitelistResponse:
    properties:
      domains: list<string>

  InvalidDomainErrorBody:
    properties:
      requiredDomainSuffix:
        type: string
        docs: Value the domain should end with (i.e. docs.buildwithfern.com or dev.docs.buildwithfern.com)

  InvliadCustomDomainErrorBody:
    properties:
      overlappingDomains: list<OverlappingCustomDomains>

  OverlappingCustomDomains: list<string>

  AuthConfig:
    union:
      public: PublicAuthConfig
      private: PrivateAuthConfig

  PublicAuthConfig:
    docs: Allow anyone to access the docs.
    properties: {}

  PrivateAuthConfig:
    docs: Use SSO to authenticate users before they can access the docs.
    properties:
      authType: literal<"sso">

  # Library Documentation Generation Types
  LibraryLanguage:
    enum:
      - PYTHON
      - CPP

  LibraryDocsJobId: string

  LibraryDocsConfig:
    docs: Configuration options for library documentation generation.
    properties:
      branch:
        type: optional<string>
        docs: Git branch to clone. Defaults to default branch.
      packagePath:
        type: optional<string>
        docs: Path to package within repo. For monorepos.
      title:
        type: optional<string>
        docs: Navigation title. Defaults to "Library Reference".
      slug:
        type: optional<string>
        docs: URL slug. Defaults to "library-reference".

  StartLibraryDocsGenerationResponse:
    properties:
      jobId: LibraryDocsJobId

  LibraryDocsGenerationStatusType:
    enum:
      - PENDING
      - PARSING
      - COMPLETED
      - FAILED

  LibraryDocsGenerationStatus:
    properties:
      jobId: LibraryDocsJobId
      status: LibraryDocsGenerationStatusType
      progress: optional<string>
      error: optional<LibraryDocsGenerationError>
      createdAt: datetime
      updatedAt: datetime

  LibraryDocsGenerationError:
    properties:
      code: LibraryDocsErrorCode
      message: string

  LibraryDocsErrorCode:
    enum:
      - CLONE_FAILED
      - PARSE_FAILED
      - GENERATION_FAILED
      - LAMBDA_ERROR
      - LAMBDA_NO_IR
      - LAMBDA_FUNCTION_ERROR
      - LAMBDA_NO_RESPONSE
      - TIMEOUT
      - INVALID_PROJECT

  LibraryDocsResult:
    docs: |
      Result of a completed documentation generation job.
      Use the resultUrl to download the full result (pages + navigation) from S3.
    properties:
      jobId: LibraryDocsJobId
      resultUrl:
        type: string
        docs: Presigned S3 URL to download the full result. Expires in 1 hour.

errors:
  InvalidDomainError:
    status-code: 400
    # type: InvalidDomainErrorBody

  InvalidCustomDomainError:
    status-code: 400
    # type: InvalidCustomDomainErrorBody

  DocsNotFoundError:
    status-code: 404
    docs: Docs not found.

  ReindexNotAllowedError:
    status-code: 403
    docs: Reindexing is not allowed for this domain.

  # Library Documentation Generation Errors
  InvalidGithubUrlError:
    status-code: 400
    type: string

  UnsupportedLanguageError:
    status-code: 400
    type: string

  LibraryDocsJobNotFoundError:
    status-code: 404

  LibraryDocsGenerationNotCompleteError:
    status-code: 400
    type: string

