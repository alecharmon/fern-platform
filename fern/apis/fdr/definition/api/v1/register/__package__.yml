# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  endpoint: endpoint.yml
  type: type.yml
  rootCommons: ../../../commons.yml
  commons: ../commons.yml
  latest: ../../latest/__package__.yml
  graphql: graphql.yml
  webhook: webhook.yml
  websocket: websocket.yml

service:
  auth: true
  base-path: /registry/api
  audiences:
    - write
  endpoints:
    registerApiDefinition:
      path: /register
      method: POST
      request:
        name: RegisterApiDefinitionRequest
        body:
          properties:
            orgId: rootCommons.OrgId
            apiId: rootCommons.ApiId
            definition: optional<ApiDefinition>
            definitionV2: optional<latest.ApiDefinition>
            sources: optional<map<SourceId, Source>>
            dynamicIRs:
              type: optional<map<string, DynamicIR>>
              docs: A mapping of languages to dynamic IR.
      response: RegisterApiDefinitionResponse
      errors:
        - rootCommons.UnauthorizedError
        - rootCommons.UserNotInOrgError
        - rootCommons.UnauthorizedError

    getSdkDynamicIrUploadUrls:
      docs: Get presigned S3 upload URLs for SDK dynamic IR without requiring full API registration. Used for SDK generation.
      path: /sdk-dynamic-ir-upload-urls
      method: POST
      request:
        name: GetSdkDynamicIrUploadUrlsRequest
        body:
          properties:
            orgId: rootCommons.OrgId
            version:
              type: string
              docs: The version of the SDK being generated
            snippetConfiguration:
              type: map<string, string>
              docs: "A mapping of languages to snippet names (e.g., {\"typescript\": \"my-api-ts\", \"python\": \"my-api-py\"})"
      response: GetSdkDynamicIrUploadUrlsResponse
      errors:
        - rootCommons.UnauthorizedError
        - rootCommons.UserNotInOrgError

    checkSdkDynamicIrExists:
      docs: Check if SDK dynamic IR exists in S3 for the given languages/snippets. Returns download URLs for existing dynamic IRs.
      path: /check-sdk-dynamic-ir
      method: POST
      request:
        name: CheckSdkDynamicIrExistsRequest
        body:
          properties:
            orgId: rootCommons.OrgId
            snippetConfiguration:
              type: map<string, SnippetInfo>
              docs: A mapping of languages to snippet info (package name and version)
      response: CheckSdkDynamicIrExistsResponse
      errors:
        - rootCommons.UnauthorizedError
        - rootCommons.UserNotInOrgError

types:
  DynamicIR:
    properties:
      dynamicIR:
        type: unknown
        docs: The dynamic IR for the given language.

  RegisterApiDefinitionResponse:
    properties:
      apiDefinitionId: rootCommons.ApiDefinitionId
      sources: optional<map<SourceId, SourceUpload>>
      dynamicIRs: optional<map<string, DynamicIRUpload>>

  GetSdkDynamicIrUploadUrlsResponse:
    properties:
      uploadUrls:
        type: map<string, DynamicIRUpload>
        docs: A mapping of languages to their upload URLs.

  SnippetInfo:
    docs: Information about a snippet package for a specific language
    properties:
      packageName:
        type: string
        docs: The package name (e.g., "my-api-ts" for TypeScript, "my-api-py" for Python)
      version:
        type: optional<string>
        docs: The version of the SDK. If not specified, the latest version will be used.

  CheckSdkDynamicIrExistsResponse:
    properties:
      existingDynamicIrs:
        type: map<string, SdkDynamicIrDownload>
        docs: A mapping of languages to their download URLs for existing SDK dynamic IRs

  SdkDynamicIrDownload:
    properties:
      downloadUrl:
        type: string
        docs: The presigned URL to download the SDK dynamic IR from S3

  DynamicIRUpload:
    properties:
      uploadUrl:
        docs: The presigned URL to upload the dynamic IR to.
        type: string

  ApiDefinition:
    properties:
      rootPackage: ApiDefinitionPackage
      apiName: optional<string>
      types: map<rootCommons.TypeId, type.TypeDefinition>
      subpackages: map<commons.SubpackageId, ApiDefinitionSubpackage>
      auth: optional<ApiAuth>
      authSchemes: optional<map<rootCommons.AuthSchemeId, ApiAuth>>
      globalHeaders: optional<list<endpoint.Header>>
      snippetsConfiguration: optional<SnippetsConfig>
      navigation:
        type: optional<ApiNavigationConfigRoot>
        availability: deprecated
        docs: Use the docs navigation instead.

  ApiNavigationConfigRoot:
    properties:
      items: list<ApiNavigationConfigItem>

  ApiNavigationConfigItem:
    union:
      subpackage: ApiNavigationConfigSubpackage
      endpointId: rootCommons.EndpointId
      websocketId: rootCommons.WebSocketId
      webhookId: rootCommons.WebhookId
      graphqlOperationId: rootCommons.GraphQlOperationId

  ApiNavigationConfigSubpackage:
    properties:
      subpackageId: commons.SubpackageId
      items: list<ApiNavigationConfigItem>

  SourceId: string

  Source:
    union:
      openapi: {}
      asyncapi: {}
      proto: {}

  SourceUpload:
    properties:
      uploadUrl:
        docs: The presigned URL to upload the source files to.
        type: string
      downloadUrl:
        docs: The presigned URL to download the source files from.
        type: string

  SnippetsConfig:
    properties:
      typescriptSdk: optional<TypescriptPackage>
      pythonSdk: optional<PythonPackage>
      goSdk: optional<GoModule>
      javaSdk: optional<JavaCoordinate>
      rubySdk: optional<RubyGem>
      csharpSdk: optional<NugetPackage>
      phpSdk: optional<ComposerPackage>
      swiftSdk: optional<SwiftPackage>
      rustSdk: optional<CratesPackage>

  TypescriptPackage:
    properties:
      package: string
      version: optional<string>

  PythonPackage:
    properties:
      package: string
      version: optional<string>

  GoModule:
    properties:
      githubRepo: string
      version: optional<string>

  JavaCoordinate:
    properties:
      coordinate: string
      version: optional<string>

  RubyGem:
    properties:
      gem: string
      version: optional<string>

  NugetPackage:
    properties:
      package: string
      version: optional<string>

  ComposerPackage:
    properties:
      package: string
      version: optional<string>

  SwiftPackage:
    properties:
      package: string
      version: optional<string>

  CratesPackage:
    properties:
      package: string
      version: optional<string>

  ApiDefinitionPackage:
    properties:
      endpoints: list<endpoint.EndpointDefinition>
      websockets: optional<list<websocket.WebSocketChannel>>
      webhooks: optional<list<webhook.WebhookDefinition>>
      graphqlOperations: optional<list<graphql.GraphQlOperation>>
      types: list<rootCommons.TypeId>
      subpackages: list<commons.SubpackageId>
      pointsTo:
        docs: |
          if present, this package should be replaced with the provided subpackage
          in the docs navigation.
        type: optional<commons.SubpackageId>

  ApiDefinitionSubpackage:
    extends:
      - ApiDefinitionPackage
      - commons.WithDescription
    properties:
      subpackageId: commons.SubpackageId
      name: string
      displayName: optional<string>

  ApiAuth:
    union:
      bearerAuth: BearerAuth
      basicAuth: BasicAuth
      header: HeaderAuth
      oAuth: OAuth

  BasicAuth:
    extends:
      - commons.WithDescription
    properties:
      usernameName: optional<string>
      passwordName: optional<string>
      passwordAlwaysEmpty:
        type: optional<boolean>
        docs: If true, the password field should not be rendered in the API explorer.

  BearerAuth:
    extends:
      - commons.WithDescription
    properties:
      tokenName: optional<string>

  HeaderAuth:
    extends:
      - commons.WithDescription
    properties:
      nameOverride: optional<string>
      headerWireValue: string
      prefix:
        type: optional<string>
        docs: The prefix that comes before the header

  OAuth:
    union:
      clientCredentials: OAuthClientCredentials

  OAuthClientCredentials:
    union:
      referencedEndpoint: OAuthClientCredentialsReferencedEndpoint

  OAuthClientCredentialsReferencedEndpoint:
    extends:
      - commons.WithDescription
    properties:
      endpointId: rootCommons.EndpointId
      accessTokenLocator: rootCommons.JqString
      headerName: optional<string>
      tokenPrefix: optional<string>

  EndpointExampleGenerationErrorBody:
    properties:
      endpointId: string

errors:
  EndpointExampleGenerationError:
    status-code: 500
    type: EndpointExampleGenerationErrorBody
