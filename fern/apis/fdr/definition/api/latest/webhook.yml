# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  rootCommons: ../../commons.yml
  commons: commons.yml
  type: type.yml
  endpoint: endpoint.yml
  v1Read: ../v1/read/webhook.yml

types:
  WebhookDefinition:
    extends:
      - commons.WithDescription
      - commons.WithAvailability
      - commons.WithNamespace
    properties:
      id: rootCommons.WebhookId
      displayName: optional<string>
      operationId: optional<string>
      method: WebhookHttpMethod
      path: list<string>
      headers: optional<list<type.ObjectProperty>>
      payloads: optional<list<WebhookPayload>>
      responses: optional<list<endpoint.HttpResponse>>
      examples: optional<list<v1Read.ExampleWebhookPayload>>

  WebhookPayload:
    extends: commons.WithDescription
    properties:
      shape: WebhookPayloadShape

  WebhookPayloadShape:
    union:
      object: type.ObjectType
      alias: type.TypeReference
      formData: type.FormDataRequest

  WebhookHttpMethod:
    enum:
      - GET
      - POST
