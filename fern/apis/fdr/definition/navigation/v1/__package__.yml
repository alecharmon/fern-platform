# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

imports:
  commons: ../../commons.yml
  latest: ../latest/__package__.yml
  docsCommons: ../../docs/v1/commons/commons.yml

types:
  Slug:
    type: string
    docs: |
      The full url pathname of the node, excluding leading or trailing slashes.
      e.g. `getting-started` or `api-reference/overview`, but not `/getting-started` or `/api-reference/overview` or `/getting-started/`

  TabId: string
  NodeId: string
  ProductId: string
  VariantId: string

  # discriminated unions

  RootChild:
    discriminated: false
    union:
      - VersionedNode
      - UnversionedNode
      - ProductGroupNode

  ProductChild:
    discriminated: false
    union:
      - VersionedNode
      - UnversionedNode

  VersionChild:
    discriminated: false
    union:
      - TabbedNode
      - SidebarRootNode
      - VariantedNode

  VariantChild:
    discriminated: false
    docs: |
      The child of a variant node. This can contain sidebar-level items or section-level items,
      depending on where the VariantedNode appears in the tree.
    union:
      - ApiReferenceNode
      - SectionNode
      - SidebarGroupNode
      - PageNode
      - LinkNode
      - ChangelogNode

  TabChild:
    discriminated: false
    union:
      - TabNode
      - LinkNode
      - ChangelogNode

  SidebarRootChild:
    discriminated: false
    union:
      - SidebarGroupNode
      - ApiReferenceNode
      - SectionNode
      - VariantedNode

  NavigationChild:
    discriminated: false
    union:
      - ApiReferenceNode
      - SectionNode
      - PageNode
      - LinkNode
      - ChangelogNode
      - VariantedNode

  ApiPackageChild:
    discriminated: false
    union:
      - ApiPackageNode
      - EndpointNode
      - EndpointPairNode
      - WebSocketNode
      - WebhookNode
      - GrpcNode
      - PageNode
      - LinkNode

  # nodes without metadata

  ProductGroupNode:
    extends: WithNodeId
    properties:
      type: literal<"productgroup">
      landingPage: optional<LandingPageNode>
      children:
        type: list<ProductNode>
        docs: The individual products being documented

  VersionedNode:
    extends: WithNodeId
    properties:
      type: literal<"versioned">
      children: list<VersionNode>

  UnversionedNode:
    extends: WithNodeId
    properties:
      type: literal<"unversioned">
      child: VersionChild
      landingPage: optional<LandingPageNode>

  VariantedNode:
    extends: WithNodeId
    properties:
      type: literal<"varianted">
      children: list<VariantNode>

  TabbedNode:
    extends: WithNodeId
    properties:
      type: literal<"tabbed">
      children: list<TabChild>

  SidebarRootNode:
    extends: WithNodeId
    properties:
      type: literal<"sidebarRoot">
      children: list<SidebarRootChild>

  SidebarGroupNode:
    extends: WithNodeId
    properties:
      type: literal<"sidebarGroup">
      children: list<NavigationChild>

  EndpointPairNode:
    extends: WithNodeId
    properties:
      type: literal<"endpointPair">
      stream: EndpointNode
      nonStream: EndpointNode

  LinkNode:
    extends: WithNodeId
    properties:
      type: literal<"link">
      title: string
      icon: optional<string>
      url: commons.Url
      target: optional<commons.LinkTarget>

  # nodes with metadata

  RootNode:
    audiences:
      - navigation
    extends:
      - WithNodeMetadata
      - WithRedirect
    properties:
      type: literal<"root">
      version: literal<"v1">
      child: RootChild
      roles: optional<list<commons.RoleId>>

  ProductNode:
    discriminated: false
    docs: A product can either be internal (with navigation structure) or external (linking to an external URL)
    union:
      - InternalProductNode
      - ExternalProductNode
      
  InternalProductNode:
    extends:
      - WithNodeMetadata
      - WithRedirect
    properties:
      type: literal<"product">
      default: boolean
      productId: ProductId
      child: ProductChild
      subtitle:
        type: string
        docs: Couple words for what the product is
      image:
        type: optional<commons.FileId>
        docs: A URL to an image that will be displayed in the sidebar. Takes precedence over `icon` if both are provided.
      announcement:
        type: optional<docsCommons.AnnouncementConfig>
        docs: Optional announcement banner to display for this product

  ExternalProductNode:
    extends:
      - WithNodeId
      - WithPermissions
    properties:
      type: literal<"productLink">
      default: boolean
      productId: ProductId
      title:
        type: string
        docs: The title that will be displayed in the sidebar for this external product
      href:
        type: commons.Url
        docs: External URL that this product links to
      target:
        type: optional<commons.LinkTarget>
        docs: Target attribute for the link (e.g., blank to open in new tab)
      subtitle:
        type: string
        docs: Couple words for what the product is
      icon: optional<string>
      image:
        type: optional<commons.FileId>
        docs: A URL to an image that will be displayed in the sidebar. Takes precedence over `icon` if both are provided.
      hidden:
        type: optional<boolean>
        docs: If true, this product will not be displayed in the product switcher
      authed:
        type: optional<boolean>
        docs: If true, this product is only visible to authenticated users

  VersionNode:
    extends:
      - WithNodeMetadata
      - WithRedirect
    properties:
      type: literal<"version">
      default: boolean
      versionId: commons.VersionId
      child: VersionChild
      availability: optional<NavigationV1Availability>
      landingPage: optional<LandingPageNode>
      announcement:
        type: optional<docsCommons.AnnouncementConfig>
        docs: Optional announcement banner to display for this version

  VariantNode:
    extends:
      - WithNodeMetadata
      - WithRedirect
    properties:
      type: literal<"variant">
      default: boolean
      variantId: VariantId
      subtitle:
        type: optional<string>
        docs: Couple words for what the variant is
      image:
        type: optional<commons.FileId>
        docs: A URL to an image that will be displayed. Takes precedence over `icon` if both are provided.
      children:
        type: list<VariantChild>
        docs: The navigation items that belong to this variant

  TabNode:
    extends:
      - WithNodeMetadata
      - WithRedirect
    properties:
      type: literal<"tab">
      child: SidebarRootNode

  PageNode:
    extends:
      - WithNodeMetadata
      - WithPage
    properties:
      type: literal<"page">
      availability: optional<NavigationV1Availability>

  LandingPageNode:
    extends:
      - WithNodeMetadata
      - WithPage
    properties:
      type: literal<"landingPage">

  SectionNode:
    extends:
      - WithNodeMetadata
      - WithOverviewPage
      - WithRedirect
    properties:
      type: literal<"section">
      collapsed: optional<boolean>
      children: list<NavigationChild>
      availability: optional<NavigationV1Availability>

  ChangelogNode:
    extends:
      - WithNodeMetadata
      - WithOverviewPage
    properties:
      type: literal<"changelog">
      children: list<ChangelogYearNode>

  ChangelogYearNode:
    extends: WithNodeMetadata
    properties:
      type: literal<"changelogYear">
      year: integer
      children: list<ChangelogMonthNode>

  ChangelogMonthNode:
    extends: WithNodeMetadata
    properties:
      type: literal<"changelogMonth">
      month: integer
      children: list<ChangelogEntryNode>

  ChangelogEntryNode:
    extends:
      - WithNodeMetadata
      - WithPage
    properties:
      type: literal<"changelogEntry">
      date: date
      tags: optional<list<string>>

  ApiReferenceNode:
    extends:
      - WithNodeMetadata
      - WithOverviewPage
      - WithApiDefinitionId
      - WithRedirect
    properties:
      type: literal<"apiReference">
      paginated:
        type: optional<boolean>
        docs: If true, long-scrolling will be disabled.
      showErrors: optional<boolean>
      hideTitle: optional<boolean>
      children: list<ApiPackageChild>
      changelog: optional<ChangelogNode>
      playground:
        # enabled: optional<boolean> (this is currently controlled in feature flags, global boolean)
        type: optional<PlaygroundSettings>
        docs: Settings for the api playground that affects all endpoints.
      postmanCollectionUrl:
        type: optional<string>
        docs: URL to a Postman collection for this API reference.

  PlaygroundSettings:
    properties:
      environments:
        type: optional<list<commons.EnvironmentId>>
        docs: |
          A list of environment IDs that are allowed to be used in the playground.
          If not provided, all environments are allowed. And if the provided list is empty, the playground should be disabled.
      button: optional<PlaygroundButtonSettings>
      limit-websocket-messages-per-connection: optional<integer>
      hidden: 
        type: optional<boolean>
        docs: If true, the endpoint will be hidden from the playground UI.


  PlaygroundButtonSettings:
    properties:
      href: optional<commons.Url>

  EndpointNode:
    extends:
      - WithNodeMetadata
      - WithApiDefinitionId
    properties:
      type: literal<"endpoint">
      method: commons.HttpMethod
      endpointId: commons.EndpointId
      isResponseStream: optional<boolean>
      playground:
        type: optional<PlaygroundSettings>
        docs: Settings for the api playground that affect this endpoint specifically.

  WebSocketNode:
    extends:
      - WithNodeMetadata
      - WithApiDefinitionId
    properties:
      type: literal<"webSocket">
      webSocketId: commons.WebSocketId
      playground:
        type: optional<PlaygroundSettings>
        docs: Settings for the api playground that affect this endpoint specifically.

  WebhookNode:
    extends:
      - WithNodeMetadata
      - WithApiDefinitionId
    properties:
      type: literal<"webhook">
      method: commons.HttpMethod
      webhookId: commons.WebhookId
      # note: webhooks do not have a playground

  GrpcNode:
    extends:
      - WithNodeMetadata
      - WithApiDefinitionId
    properties:
      type: literal<"grpc">
      method: commons.GrpcMethod
      grpcId: commons.GrpcId
      # note: grpc methods do not have a playground

  ApiPackageNode:
    extends:
      - WithNodeMetadata
      - WithOverviewPage
      - WithApiDefinitionId
      - WithRedirect
    properties:
      type: literal<"apiPackage">
      children: list<ApiPackageChild>
      playground:
        type: optional<PlaygroundSettings>
        docs: Settings for the api playground that is applied only to descendants of this api package.

  # utilities

  WithNodeId:
    properties:
      id:
        type: NodeId
        docs: A unique, stable identifier for this node.

  WithPermissions:
    properties:
      viewers: optional<list<commons.RoleId>>
      orphaned: optional<boolean>

  WithNodeMetadata:
    extends:
      - WithNodeId
      - WithPermissions
      - latest.WithFeatureFlags
    properties:
      title: string
      slug: Slug
      icon: optional<string>
      hidden: optional<boolean>
      authed: optional<boolean>

  WithPage:
    properties:
      pageId: commons.PageId
      noindex: optional<boolean>

  WithOverviewPage:
    properties:
      overviewPageId: optional<commons.PageId>
      noindex: optional<boolean>

  WithApiDefinitionId:
    properties:
      apiDefinitionId: commons.ApiDefinitionId
      availability: optional<NavigationV1Availability>

  WithRedirect:
    properties:
      pointsTo: optional<Slug>

  # enums

  NavigationV1Availability:
    availability: deprecated
    enum:
      - stable
      - name: GenerallyAvailable
        value: generally-available
      - name: InDevelopment
        value: in-development
      - name: PreRelease
        value: pre-release
      - beta
      - deprecated
