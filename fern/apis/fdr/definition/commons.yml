# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

types:
  ApiDefinitionId: uuid

  VersionId: string

  OrgId:
    type: string
    docs: Human readable org id (e.g. fern)

  TokenId:
    type: string
    docs: ID for a given token

  ApiId:
    type: string
    docs: Human readable api identifier (e.g. venus)

  DocsConfigId:
    type: string
    docs: The ID of a particular docs config.

  EnvironmentId:
    type: string
    docs: Identifier for an API environment (i.e. "Prod", "Staging", "Dev")

  EndpointId: string

  WebSocketId: string

  WebhookId: string

  GrpcId: string

  GraphQlOperationId: string

  TypeId: string

  PageId: string

  FileId: string

  Url: string

  LinkTarget:
    enum:
      - name: blank
        value: _blank
      - name: self
        value: _self
      - name: parent
        value: _parent
      - name: top
        value: _top

  JqString: string

  PropertyKey: string

  RoleId: string

  AuthSchemeId: string

  MultipleAuthType:
    docs: |
      Represents a set of auth schemes that must ALL be satisfied (AND relationship).
      Used in multiAuth to express OR-of-AND security requirements.
    properties:
      schemes:
        type: list<AuthSchemeId>
        docs: List of auth scheme IDs that must all be satisfied for this auth option.

  EndpointIdentifier:
    properties:
      path: EndpointPathLiteral
      method: HttpMethod
      identifierOverride:
        type: optional<string>
        docs: |
          The ID for the endpoint as declared within the IR, this is a unique name for the endpoint, whereas path and
          method are not (specifically for the fern definition, consider chat and chat stream). This is optional to
          remain backcompat with old snippets of yore.

  EndpointPathLiteral:
    type: string
    docs: The relative path for an endpoint (e.g. `/users/{userId}`)

  HttpMethod:
    enum:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
      # - OPTIONS
      # - TRACE
      # - CONNECT

  GrpcMethod:
    enum:
      - UNARY
      - CLIENT_STREAM
      - SERVER_STREAM
      - BIDIRECTIONAL_STREAM

  Availability:
    enum:
      - Stable
      - GenerallyAvailable
      - InDevelopment
      - PreRelease
      - Deprecated
      - Beta

  InvalidDomainErrorBody:
    properties:
      requiredDomainSuffix:
        type: string
        docs: Value the domain should end with (i.e. docs.buildwithfern.com or dev.docs.buildwithfern.com)
errors:
  BadRequestError:
    status-code: 400
    type: string

  UnauthorizedError:
    status-code: 401
    type: string

  UserNotInOrgError:
    status-code: 403
    type: string

  DomainBelongsToAnotherOrgError:
    status-code: 403
    type: string

  InvalidURLError:
    status-code: 400
    type: string

  InternalError:
    status-code: 500
    type: string

  UnavailableError:
    status-code: 503
    type: string

  UserDoesNotHaveCliPermissionError:
    status-code: 403
    type: string

  InvalidDomainError:
    status-code: 400
    # type: InvalidDomainErrorBody
