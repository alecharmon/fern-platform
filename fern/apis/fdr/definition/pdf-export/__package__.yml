# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

# PDF Export API
# Provides endpoints for creating and managing PDF export tasks for documentation sites.

imports:
  rootCommons: ../commons.yml

service:
  base-path: /pdf-export
  auth: true
  audiences:
    - dashboard
  endpoints:
    createTask:
      method: POST
      path: /task
      docs: Create a new PDF export task for a documentation site.
      request:
        name: CreatePdfExportTaskRequest
        body:
          properties:
            orgId: rootCommons.OrgId
            docsUrl:
              type: string
              docs: The domain of the documentation site (e.g., "docs.example.com").
            options:
              type: optional<PdfExportOptions>
              docs: Options for customizing the PDF export.
      response: PdfExportTask
      errors:
        - rootCommons.UnauthorizedError
        - rootCommons.UserNotInOrgError

    listTasks:
      method: GET
      path: /tasks
      docs: List PDF export tasks for a documentation site.
      request:
        name: ListPdfExportTasksRequest
        query-parameters:
          orgId: rootCommons.OrgId
          docsUrl:
            type: string
            docs: The domain of the documentation site.
          limit:
            type: optional<integer>
            docs: Maximum number of tasks to return. Defaults to 10.
      response: ListPdfExportTasksResponse
      errors:
        - rootCommons.UnauthorizedError
        - rootCommons.UserNotInOrgError

    getTask:
      method: GET
      path: /task/{taskId}
      docs: Get the status and details of a PDF export task.
      path-parameters:
        taskId: PdfExportTaskId
      response: PdfExportTask
      errors:
        - rootCommons.UnauthorizedError
        - PdfExportTaskNotFoundError

    # Internal endpoint called by the Lambda to update task status
    updateTask:
      method: POST
      path: /task/{taskId}
      docs: |
        Internal endpoint for the PDF export Lambda to update task status.
        This endpoint should not be called by external clients.
      audiences:
        - internal
      path-parameters:
        taskId: PdfExportTaskId
      request:
        name: UpdatePdfExportTaskStatusRequest
        body:
          properties:
            status: PdfExportTaskStatus
            startedAt: optional<datetime>
            completedAt: optional<datetime>
            s3Key: optional<string>
            fileName: optional<string>
            sizeBytes: optional<integer>
            errorMessage: optional<string>
      response: PdfExportTask
      errors:
        - PdfExportTaskNotFoundError

    # Get a presigned download URL for a completed PDF export
    getDownloadUrl:
      method: GET
      path: /task/{taskId}/download-url
      docs: Get a presigned URL to download a completed PDF export.
      path-parameters:
        taskId: PdfExportTaskId
      response: PdfExportDownloadResponse
      errors:
        - rootCommons.UnauthorizedError
        - PdfExportTaskNotFoundError
        - PdfExportNotCompletedError

types:
  PdfExportTaskId: string

  PdfExportTaskStatus:
    enum:
      - PENDING
      - RUNNING
      - COMPLETED
      - FAILED

  PdfExportOptions:
    discriminant: version
    union:
      v1: PdfExportOptionsV1

  PdfExportOptionsV1:
    docs: Options for customizing the PDF export.
    properties:
      coverTitle:
        type: optional<string>
        docs: |
          Cover title (center heading). Omit to hide the title.
      coverSubtitle:
        type: optional<string>
        docs: |
          Cover subtitle (center subheading). Omit to hide the subtitle.
      hideCoverFooter:
        type: optional<boolean>
        docs: Hide the "Generated by Fern" footer on the cover page.
      headerLeftTemplate:
        type: optional<string>
        docs: Header (top-left) template. Supports {pageIndex}, {totalPages}.
      headerRightTemplate:
        type: optional<string>
        docs: Header (top-right) template. Supports {pageIndex}, {totalPages}.
      footerLeftTemplate:
        type: optional<string>
        docs: Footer (bottom-left) template. Supports {pageIndex}, {totalPages}.
      footerRightTemplate:
        type: optional<string>
        docs: Footer (bottom-right) template. Supports {pageIndex}, {totalPages}.

  PdfExportTask:
    docs: A PDF export task representing an ongoing or completed export job.
    properties:
      id: PdfExportTaskId
      orgId: rootCommons.OrgId
      docsUrl: string
      status: PdfExportTaskStatus
      options: optional<PdfExportOptions>
      createdAt: datetime
      startedAt: optional<datetime>
      completedAt: optional<datetime>
      fileName: optional<string>
      sizeBytes: optional<integer>
      errorMessage: optional<string>

  ListPdfExportTasksResponse:
    properties:
      tasks: list<PdfExportTask>

  PdfExportDownloadResponse:
    properties:
      downloadUrl:
        type: string
        docs: Presigned URL to download the PDF. Expires in 1 hour.
      fileName: string
      sizeBytes: integer

errors:
  PdfExportTaskNotFoundError:
    status-code: 404
    docs: The PDF export task was not found.

  PdfExportNotCompletedError:
    status-code: 400
    docs: The PDF export task has not completed successfully.
