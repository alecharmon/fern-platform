# yaml-language-server: $schema=https://raw.githubusercontent.com/fern-api/fern/main/fern.schema.json

# Python-specific IR types for library documentation generation.
# These types are complete and self-contained, referencing shared types from ir.yml.

imports:
  ir: ir.yml

types:
  # Root Python IR - ONLY THIS NEEDS audiences tag (transitive inclusion)
  PythonLibraryDocsIR:
    audiences:
      - library-docs
    properties:
      metadata: ir.IRMetadata
      rootModule: PythonModuleIR

  # Python module - complete definition
  PythonModuleIR:
    properties:
      name: string
      path: string
      docstring: optional<ir.DocstringIR>
      classes: list<PythonClassIR>
      functions: list<PythonFunctionIR>
      attributes: list<ir.AttributeIR>
      submodules: list<PythonModuleIR>

  # Reference to a base class with type info for cross-linking
  BaseClassRef:
    properties:
      name: string  # Simple identifier for filtering (e.g., "EnvironmentInterface")
      typeInfo: optional<ir.TypeInfo>  # Full type info when resolvable

  # Python class - complete with all Python-specific fields
  PythonClassIR:
    properties:
      name: string
      path: string
      kind: PythonClassKind
      bases: list<BaseClassRef>
      docstring: optional<ir.DocstringIR>
      constructorParams: list<PythonParameterIR>
      methods: list<PythonFunctionIR>
      attributes: list<ir.AttributeIR>
      decorators: list<string>
      metaclass: optional<string>
      isAbstract: boolean
      hasSlots: boolean
      typedDictFields: optional<list<TypedDictFieldIR>>
      enumMembers: optional<list<EnumMemberIR>>

  PythonClassKind:
    enum:
      - CLASS
      - DATACLASS
      - TYPEDDICT
      - PROTOCOL
      - ENUM
      - EXCEPTION

  # Python function - complete definition
  PythonFunctionIR:
    properties:
      name: string
      path: string
      signature: string
      docstring: optional<ir.DocstringIR>
      parameters: list<PythonParameterIR>
      returnTypeInfo: optional<ir.TypeInfo>
      isAsync: boolean
      decorators: list<string>
      isClassmethod: boolean
      isStaticmethod: boolean
      isProperty: boolean

  # Python parameter - with Python-specific kind
  PythonParameterIR:
    properties:
      name: string
      typeInfo: optional<ir.TypeInfo>
      default: optional<string>
      description: optional<string>
      kind: PythonParameterKind

  PythonParameterKind:
    enum:
      - POSITIONAL
      - KEYWORD
      - VAR_POSITIONAL
      - VAR_KEYWORD
      - KEYWORD_ONLY

  # TypedDict field (Python-specific)
  TypedDictFieldIR:
    properties:
      name: string
      typeInfo: optional<ir.TypeInfo>
      description: optional<string>
      required: boolean

  # Enum member (Python-specific)
  EnumMemberIR:
    properties:
      name: string
      value: string
