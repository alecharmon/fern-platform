default-group: local

groups:
  local:
    generators:
      - name: fernapi/fern-typescript-express
        version: 0.18.8
        output:
          location: local-file-system
          path: ../../../servers/fdr/src/api/generated
        config:
          outputEsm: true
          noSerdeLayer: true
          noOptionalProperties: true
          useBrandedStringAliases: true
      - name: fernapi/fern-typescript-node-sdk
        version: 3.33.0
        output:
          location: local-file-system
          path: ../../../packages/fdr-sdk/src/client/generated
        config:
          outputEsm: true
          noSerdeLayer: true
          noOptionalProperties: true
          useBrandedStringAliases: true
          outputSourceFiles: true
          neverThrowErrors: true
          timeoutInSeconds: infinity
          useLegacyExports: false

  fdr-lambda:
    audiences:
      - fdr-lambda

    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 3.33.0
        output:
          location: local-file-system
          path: ../../../packages/fdr-lambda-sdk/src
        config:
          outputEsm: true
          noSerdeLayer: true
          noOptionalProperties: true
          useBrandedStringAliases: true
          outputSourceFiles: true
          neverThrowErrors: true
          timeoutInSeconds: infinity
          useLegacyExports: false
          namespaceExport: FdrLambda

  fdr-lambda-python-sdk:
    audiences:
      - fdr-lambda
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.32.2
        output:
          location: pypi
          package-name: "fern-fdr-lambda-sdk"
          token: ${PYPI_TOKEN}
        config:
          client_class_name: FdrLambdaClient
          package_name: "fdr_lambda"
          pydantic_config:
            include_union_utils: true

  generators-sdk:
    audiences:
      - generators
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 0.40.5
        output:
          location: npm
          url: npm.buildwithfern.com
          package-name: "@fern-fern/generators-sdk"
        config:
          noSerdeLayer: false
          skipResponseValidation: true
          outputSourceFiles: true
          neverThrowErrors: true
          timeoutInSeconds: infinity

  internal-snippets-sdks:
    audiences:
      - snippets
    generators:
      # Internal, unadulterated for the use of the APIs
      - name: fernapi/fern-python-sdk
        version: 1.4.0
        output:
          location: pypi
          url: pypi.buildwithfern.com
          package-name: "fern-fern-fdr-sdk"
        config:
          package_name: "fdr"
          pydantic_config:
            include_union_utils: true
          client:
            class_name: FdrClient
      - name: fernapi/fern-typescript-node-sdk
        version: 0.12.8-rc0
        output:
          location: npm
          url: npm.buildwithfern.com
          package-name: "@fern-fern/snippet-sdk"
        config:
          namespaceExport: FdrSnippetTemplate
          includeUtilsOnUnionMembers: true

  external-sdk:
    audiences:
      - external
      - snippets
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 0.20.9
        output:
          location: npm
          package-name: "@fern-api/sdk"
          token: ${NPM_TOKEN}
        github:
          repository: fern-api/typescript-sdk
          mode: pull-request
          license: MIT
        config:
          noSerdeLayer: true
          namespaceExport: Fern
          includeApiReference: true
          extraDependencies:
            "@fern-api/template-resolver": "0.7.5"
          allowCustomFetcher: true
