tabs:
  home:
    display-name: Home
    icon: home
  guides:
    display-name: Guides
    icon: book
  rest-api:
    display-name: REST API
    icon: puzzle
  test-api:
    display-name: Test API
    icon: test-tube
  events-api:
    display-name: Events API
    icon: bolt
  grpc-api:
    display-name: gRPC API
    icon: code
  webhook-api:
    display-name: Webhook API
    icon: webhook
  api:
    display-name: Tasks API
    icon: check-square
  collapsible-test:
    display-name: Collapsible Test
    icon: chevron-down
  changelog:
    display-name: Changelog
    icon: clock
    changelog: ../../changelog

navigation:
  - tab: home
    layout:
      - section: Get Started
        contents:
          - page: Welcome
            path: ../../docs/pages/welcome.mdx
          - page: Plaintext Test
            path: ../../docs/pages/plaintext-test.mdx
          - page: External Dependency Test
            path: ../../docs/pages/external-dependency-test.mdx
  - tab: guides
    layout:
      - section: Learn
        contents:
          - page: Concepts
            path: ../../docs/pages/concepts.mdx
          - page: SDKs
            path: ../../docs/pages/sdks.mdx
            slug: sdks
          - page: Error Codes
            path: ../../docs/pages/error-codes.mdx
            slug: error-codes
  - tab: rest-api
    layout:
      - api: Rest API
        api-name: rest-api
  - tab: events-api
    layout:
      - api: Events API
        api-name: events-api
  - tab: grpc-api
    layout:
      - api: gRPC API
        api-name: grpc-api
  - tab: webhook-api
    layout:
      - api: Webhook API
        api-name: webhook-api
  - tab: api
    layout:
      - section: Overview
        contents:
          - page: API Overview
            path: ../../docs/pages/api-overview.mdx
      - api: Tasks API
        api-name: api
  - tab: collapsible-test
    layout:
      # Deprecated: collapsed: true => collapsible + starts collapsed
      - section: "Deprecated: collapsed: true"
        collapsed: true
        contents:
          - link: Fern Overview
            href: https://buildwithfern.com/learn/docs/getting-started/overview
            icon: fa-duotone fa-newspaper
          - link: Fern How it works
            href: https://buildwithfern.com/learn/docs/getting-started/how-it-works
            icon: fa-duotone fa-users
      # Deprecated: collapsed: false => collapsible + starts open
      - section: "Deprecated: collapsed: false"
        collapsed: false
        contents:
          - link: Fern Overview
            href: https://buildwithfern.com/learn/docs/getting-started/overview
            icon: fa-duotone fa-newspaper
          - link: Fern How it works
            href: https://buildwithfern.com/learn/docs/getting-started/how-it-works
            icon: fa-duotone fa-users
      # New: collapsible: true, collapsed-by-default: true => same as collapsed: true
      - section: "Collapsible, Collapsed by Default"
        collapsible: true
        collapsed-by-default: true
        contents:
          - link: Fern Overview
            href: https://buildwithfern.com/learn/docs/getting-started/overview
            icon: fa-duotone fa-newspaper
          - link: Fern How it works
            href: https://buildwithfern.com/learn/docs/getting-started/how-it-works
            icon: fa-duotone fa-users
      # New: collapsible: true, collapsed-by-default: false => collapsible but starts open
      - section: "Collapsible, Open by Default"
        collapsible: true
        collapsed-by-default: false
        contents:
          - link: Fern Overview
            href: https://buildwithfern.com/learn/docs/getting-started/overview
            icon: fa-duotone fa-newspaper
          - link: Fern How it works
            href: https://buildwithfern.com/learn/docs/getting-started/how-it-works
            icon: fa-duotone fa-users
      # New: collapsible: true (no collapsed-by-default) => collapsible, open by default
      - section: "Collapsible Only (no collapsed-by-default)"
        collapsible: true
        contents:
          - link: Fern Overview
            href: https://buildwithfern.com/learn/docs/getting-started/overview
            icon: fa-duotone fa-newspaper
          - link: Fern How it works
            href: https://buildwithfern.com/learn/docs/getting-started/how-it-works
            icon: fa-duotone fa-users
      # New: collapsible: false => not collapsible (always open)
      - section: "Not Collapsible (collapsible: false)"
        collapsible: false
        contents:
          - link: Fern Overview
            href: https://buildwithfern.com/learn/docs/getting-started/overview
            icon: fa-duotone fa-newspaper
          - link: Fern How it works
            href: https://buildwithfern.com/learn/docs/getting-started/how-it-works
            icon: fa-duotone fa-users
      # Default: no collapsed/collapsible settings => not collapsible
      - section: "Default (no settings)"
        contents:
          - link: Fern Overview
            href: https://buildwithfern.com/learn/docs/getting-started/overview
            icon: fa-duotone fa-newspaper
          - link: Fern How it works
            href: https://buildwithfern.com/learn/docs/getting-started/how-it-works
            icon: fa-duotone fa-users
  - tab: changelog
