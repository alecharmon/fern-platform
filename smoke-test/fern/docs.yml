# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: smoke-test.docs.buildwithfern.com # update this to {yourorg}.docs.buildwithfern.com
    # custom-domain: plantstore.dev # specify your custom domain when you are ready to go live

title: Plant Store

layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

products:
  - display-name: Home
    path: ./products/home/home.yml
    icon: home
    slug: home
    subtitle: Main documentation and guides

  - display-name: Second Product
    path: ./products/second-product/second-product.yml
    icon: puzzle
    slug: second-product
    subtitle: A second product for testing product switching

navbar-links:
  - type: minimal
    text: Fork this repo
    url: https://github.com/fern-api/docs-starter
  - type: filled
    text: Get a demo
    url: https://buildwithfern.com/contact?utm_campaign=demo&utm_medium=plantstore&utm_source=navbar
  - type: github
    value: https://github.com/fern-api/fern
      
colors:
  accentPrimary:
    dark: "#81C784"
    light: "#1B5E20"

logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo-light.svg
  height: 20
  href: https://buildwithfern.com/?utm_campaign=demo&utm_medium=plantstore&utm_source=logo

favicon: docs/assets/favicon.svg

redirects:
  # Page redirect test
  - source: /old-welcome
    destination: /home/welcome
  # API redirect test
  - source: /old-api/plant
    destination: /home/rest-api/rest-api/plant/add-plant
  # API redirect test with explorer mode
  - source: /old-api/plant-explorer
    destination: /home/rest-api/rest-api/plant/add-plant?explorer=true

experimental:
  mdx-components:
    - docs/components

footer-links:
  github: https://github.com/your-org/your-repo
  slack: https://your-community.slack.com
  x: https://x.com/yourhandle
  twitter: https://twitter.com/yourhandle
  linkedin: https://www.linkedin.com/company/your-company
  youtube: https://www.youtube.com/@yourchannel
  instagram: https://www.instagram.com/yourhandle
  facebook: https://www.facebook.com/yourpage
  discord: https://discord.gg/yourinvite
  hackernews: https://news.ycombinator.com/user?id=yourusername
  medium: https://medium.com/@yourhandle
  website: https://yourwebsite.com
