# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json

api:
  specs:
    - openapi: openapi.yaml

default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 0.40.0
        output:
          location: local-file-system
          path: ../../../sdks/typescript
      - name: fernapi/fern-go-sdk
        version: 0.30.0
        output:
          location: local-file-system
          path: ../../../sdks/go
        config:
          importPath: github.com/smoke-test/go-sdk
      - name: fernapi/fern-python-sdk
        version: 4.0.0
        output:
          location: local-file-system
          path: ../../../sdks/python
  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.0.0
        output:
          location: local-file-system
          path: ../../../sdks/python
