openapi: 3.1.0
info:
  title: Plant Store Webhook API
  version: 1.0.0
  description: |
    Webhook API for the Plant Store. Configure webhook endpoints in your account settings to receive real-time notifications about events in your store.

    ### Webhook Security
    All webhook requests include a signature header (`X-Webhook-Signature`) that you can use to verify the authenticity of the request.

    ### Retry Policy
    Failed webhook deliveries are retried up to 5 times with exponential backoff.

servers:
  - url: https://api.plantstore.dev/v1
    description: Production server

webhooks:
  orderCreated:
    post:
      tags:
        - orders
      summary: New order created
      description: |
        Triggered when a new order is placed in your store.
        
        **Use Cases**:
        - Send order confirmation emails
        - Update inventory management systems
        - Trigger fulfillment workflows
      operationId: onOrderCreated
      requestBody:
        description: New order event payload
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreatedEvent"
            examples:
              singlePlantOrder:
                summary: Single plant order
                value:
                  event: "order.created"
                  timestamp: "2024-01-15T10:30:00Z"
                  data:
                    orderId: "ord_12345"
                    customerId: "cust_67890"
                    items:
                      - plantId: "plant_001"
                        plantName: "Monstera Deliciosa"
                        quantity: 1
                        unitPrice: 45.99
                    totalAmount: 45.99
                    currency: "USD"
                    shippingAddress:
                      street: "123 Garden Lane"
                      city: "Portland"
                      state: "OR"
                      zipCode: "97201"
                      country: "US"
              multiplePlantsOrder:
                summary: Multiple plants order
                value:
                  event: "order.created"
                  timestamp: "2024-01-15T10:30:00Z"
                  data:
                    orderId: "ord_12346"
                    customerId: "cust_67890"
                    items:
                      - plantId: "plant_001"
                        plantName: "Monstera Deliciosa"
                        quantity: 2
                        unitPrice: 45.99
                      - plantId: "plant_002"
                        plantName: "Snake Plant"
                        quantity: 1
                        unitPrice: 29.99
                    totalAmount: 121.97
                    currency: "USD"
                    shippingAddress:
                      street: "123 Garden Lane"
                      city: "Portland"
                      state: "OR"
                      zipCode: "97201"
                      country: "US"
              bulkOrder:
                summary: Bulk order with many plants
                value:
                  event: "order.created"
                  timestamp: "2024-01-15T10:30:00Z"
                  data:
                    orderId: "ord_12347"
                    customerId: "cust_99999"
                    items:
                      - plantId: "plant_001"
                        plantName: "Monstera Deliciosa"
                        quantity: 10
                        unitPrice: 45.99
                      - plantId: "plant_002"
                        plantName: "Snake Plant"
                        quantity: 5
                        unitPrice: 29.99
                      - plantId: "plant_003"
                        plantName: "Fiddle Leaf Fig"
                        quantity: 3
                        unitPrice: 89.99
                    totalAmount: 879.82
                    currency: "USD"
                    shippingAddress:
                      street: "456 Greenhouse Ave"
                      city: "Seattle"
                      state: "WA"
                      zipCode: "98101"
                      country: "US"
      responses:
        "200":
          description: Webhook received successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcknowledgement"
        "400":
          description: Invalid webhook payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
      security:
        - webhookSignature: []

  plantImageUploaded:
    post:
      tags:
        - plants
      summary: Plant image uploaded
      description: |
        Triggered when a new plant image is uploaded via multipart form data.
        
        **Use Cases**:
        - Process and resize images
        - Run image classification
        - Update plant catalog
      operationId: onPlantImageUploaded
      requestBody:
        description: Plant image upload event with multipart form data
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PlantImageUploadEvent"
            examples:
              singleImage:
                summary: Single image upload
                value:
                  plantId: "plant_001"
                  plantName: "Monstera Deliciosa"
                  image: "(binary)"
                  imageType: "primary"
                  uploadedBy: "user_12345"
              multipleImages:
                summary: Multiple images upload
                value:
                  plantId: "plant_002"
                  plantName: "Snake Plant"
                  image: "(binary)"
                  imageType: "gallery"
                  uploadedBy: "admin_001"
      responses:
        "200":
          description: Webhook received successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcknowledgement"
      security:
        - webhookSignature: []

components:
  securitySchemes:
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC-SHA256 signature of the request body using your webhook secret

  schemas:
    OrderCreatedEvent:
      type: object
      properties:
        event:
          type: string
          enum: ["order.created"]
        timestamp:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/OrderCreatedData"
      required:
        - event
        - timestamp
        - data

    OrderCreatedData:
      type: object
      properties:
        orderId:
          type: string
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totalAmount:
          type: number
          format: double
        currency:
          type: string
        shippingAddress:
          $ref: "#/components/schemas/Address"
      required:
        - orderId
        - customerId
        - items
        - totalAmount
        - currency

    OrderItem:
      type: object
      properties:
        plantId:
          type: string
        plantName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
      required:
        - plantId
        - quantity
        - unitPrice

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
      required:
        - street
        - city
        - country

    WebhookAcknowledgement:
      type: object
      properties:
        received:
          type: boolean
        processedAt:
          type: string
          format: date-time
      required:
        - received

    WebhookError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: string
      required:
        - error
        - code

    PlantImageUploadEvent:
      type: object
      properties:
        plantId:
          type: string
          description: The unique identifier of the plant
        plantName:
          type: string
          description: The name of the plant
        image:
          type: string
          format: binary
          description: The uploaded image file
        imageType:
          type: string
          enum: ["primary", "gallery", "thumbnail"]
          description: The type of image being uploaded
        uploadedBy:
          type: string
          description: The user who uploaded the image
      required:
        - plantId
        - image
        - imageType
        - uploadedBy
