      description: Current state of inventory for an item
      enum:
        - IN_STOCK
        - LOW_STOCK
        - OUT_OF_STOCK
        - BACKORDERED
        - DISCONTINUED
        - PRE_ORDER
        - RESERVED
        - IN_TRANSIT
        - QUARANTINED
        - DAMAGED
        - RETURNED
        - AWAITING_INSPECTION
    SortOrder:
      type: string
      description: Sort order for search results
      enum:
        - PRICE_ASC
        - PRICE_DESC
        - NAME_ASC
        - NAME_DESC
        - CREATED_ASC
        - CREATED_DESC
        - POPULARITY
        - RELEVANCE
    CatalogError:
      type: object
      description: Error response for catalog operations
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/CatalogErrorCode"
        message:
          type: string
          description: Human-readable error message
        field:
          type: string
          description: The field that caused the error, if applicable
        details:
          type: object
          additionalProperties: true
          description: Additional error context
    PlantDetails:
      type: object
      description: Detailed attributes specific to plant items
      properties:
        genus:
          type: string
        species:
          type: string
        commonNames:
          type: array
          items:
            type: string
        careLevel:
          $ref: "#/components/schemas/CareLevel"
        lightRequirement:
          $ref: "#/components/schemas/LightRequirement"
        waterFrequency:
          $ref: "#/components/schemas/WaterFrequency"
        humidityMin:
          type: integer
          description: Minimum humidity percentage
        humidityMax:
          type: integer
          description: Maximum humidity percentage
        temperatureMinC:
          type: integer
          description: Minimum temperature in Celsius
        temperatureMaxC:
          type: integer
          description: Maximum temperature in Celsius
        matureHeightCm:
          type: integer
        matureWidthCm:
          type: integer
        growthRate:
          type: string
          enum: [SLOW, MODERATE, FAST, VERY_FAST]
        toxicity:
          $ref: "#/components/schemas/Toxicity"
        bloomSeason:
          type: string
          enum: [SPRING, SUMMER, FALL, WINTER, YEAR_ROUND, NONE]
        soilType:
          type: string
          enum: [WELL_DRAINING, MOISTURE_RETAINING, SANDY, CLAY, LOAM, PEAT, BARK_MIX, SPHAGNUM]
        propagationMethods:
          type: array
          items:
            type: string
            enum: [SEED, CUTTING, DIVISION, LAYERING, GRAFTING, TISSUE_CULTURE, SPORE, OFFSET]
        isEvergreen:
          type: boolean
        isFragrant:
          type: boolean
        isNative:
          type: boolean
        nativeRegions:
          type: array
          items:
            $ref: "#/components/schemas/Country"
    SeedDetails:
      type: object
      description: Detailed attributes specific to seed items
      properties:
        genus:
          type: string
        species:
          type: string
        seedCount:
          type: integer
        germinationDays:
          type: integer
        germinationRate:
          type: number
          format: float
          description: Expected germination rate (0.0 to 1.0)
        plantingDepthCm:
          type: number
          format: float
        spacingCm:
          type: integer
        daysToMaturity:
          type: integer
        plantingSeasons:
          type: array
          items:
            type: string
            enum: [SPRING, SUMMER, FALL, WINTER]
        hardinessZoneMin:
          type: integer
        hardinessZoneMax:
          type: integer
        isOrganic:
          type: boolean
        isHeirloom:
          type: boolean
        isGMO:
          type: boolean
    ToolDetails:
      type: object
      description: Detailed attributes specific to tool items
      properties:
        material:
          $ref: "#/components/schemas/ToolMaterial"
        weightGrams:
          type: integer
        lengthCm:
          type: number
          format: float
        warrantyMonths:
          type: integer
        isErgonomic:
          type: boolean
        requiresAssembly:
          type: boolean
        powerSource:
          type: string
          enum: [MANUAL, BATTERY, ELECTRIC, GAS, SOLAR]
    AccessoryDetails:
      type: object
      description: Detailed attributes specific to accessory items
      properties:
        material:
          type: string
        color:
          type: string
        sizeCm:
          type: object
          properties:
            length:
              type: number
              format: float
            width:
              type: number
              format: float
            height:
              type: number
              format: float
        weightGrams:
          type: integer
        isIndoor:
          type: boolean
        isOutdoor:
          type: boolean
        hasDrainageHole:
          type: boolean
    CatalogItem:
      type: object
      description: |
        A catalog item representing a product in the plant store. The `type` field
        determines which detail object is populated. This is a discriminated union
        where each item type has its own set of specific properties.
      required:
        - type
        - name
        - category
        - currency
        - priceCents
      properties:
        type:
          $ref: "#/components/schemas/CatalogItemType"
        id:
          type: string
          description: Unique identifier (set by server on creation)
        name:
          type: string
          description: Display name of the item
          maxLength: 200
        description:
          type: string
          description: Detailed description
          maxLength: 5000
        category:
          $ref: "#/components/schemas/CatalogCategory"
        currency:
          $ref: "#/components/schemas/Currency"
        priceCents:
          type: integer
          description: Price in the smallest currency unit (e.g., cents)
          minimum: 0
        comparePriceCents:
          type: integer
          description: Original price before discount
        costCents:
          type: integer
          description: Cost of goods
        country:
          $ref: "#/components/schemas/Country"
        sku:
          type: string
          description: Stock keeping unit
        barcode:
          type: string
        tags:
          type: array
          items:
            type: string
          maxItems: 25
        imageUrls:
          type: array
          items:
            type: string
            format: uri
          maxItems: 10
        isFeatured:
          type: boolean
          default: false
        isActive:
          type: boolean
          default: true
        isTaxable:
          type: boolean
          default: true
        weight:
          type: object
          properties:
            value:
              type: number
              format: float
            unit:
              type: string
              enum: [GRAMS, KILOGRAMS, OUNCES, POUNDS]
        dimensions:
          type: object
          properties:
            lengthCm:
              type: number
              format: float
            widthCm:
              type: number
              format: float
            heightCm:
              type: number
              format: float
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata
        plantDetails:
          $ref: "#/components/schemas/PlantDetails"
        seedDetails:
          $ref: "#/components/schemas/SeedDetails"
        toolDetails:
          $ref: "#/components/schemas/ToolDetails"
        accessoryDetails:
          $ref: "#/components/schemas/AccessoryDetails"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic concurrency version
    CreateCatalogItemRequest:
      type: object
      required:
        - idempotencyKey
        - item
      properties:
        idempotencyKey:
          type: string
          description: Client-generated key to prevent duplicate creation
        item:
          $ref: "#/components/schemas/CatalogItem"
    CatalogItemResponse:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/CatalogItem"
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/InventoryEntry"
        relatedItems:
          type: array
          items:
            type: string
          description: IDs of related catalog items
    SearchCatalogRequest:
      type: object
      properties:
        filter:
          type: object
          properties:
            categories:
              type: array
              items:
                $ref: "#/components/schemas/CatalogCategory"
            countries:
              type: array
              items:
                $ref: "#/components/schemas/Country"
            currencies:
              type: array
              items:
                $ref: "#/components/schemas/Currency"
            priceRange:
              type: object
              properties:
                minCents:
                  type: integer
                maxCents:
                  type: integer
            itemTypes:
              type: array
              items:
                $ref: "#/components/schemas/CatalogItemType"
            tags:
              type: array
              items:
                type: string
            careLevels:
              type: array
              items:
                $ref: "#/components/schemas/CareLevel"
            lightRequirements:
              type: array
              items:
                $ref: "#/components/schemas/LightRequirement"
            inventoryStates:
              type: array
              items:
                $ref: "#/components/schemas/InventoryState"
            isFeatured:
              type: boolean
            isActive:
              type: boolean
            query:
              type: string
              description: Full-text search query
        sortBy:
          $ref: "#/components/schemas/SortOrder"
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        cursor:
          type: string
          description: Pagination cursor from previous response
    SearchCatalogResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItemResponse"
        totalCount:
          type: integer
        cursor:
          type: string
          description: Cursor for next page, null if no more results
        facets:
          type: object
          properties:
            categories:
              type: object
              additionalProperties:
                type: integer
              description: Count of items per category
            countries:
              type: object
              additionalProperties:
                type: integer
            priceRanges:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  minCents:
                    type: integer
                  maxCents:
                    type: integer
                  count:
                    type: integer
    BulkUpsertCatalogRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItem"
          maxItems: 100
    BulkUpsertCatalogResponse:
      type: object
      properties:
        succeeded:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItemResponse"
        failed:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Index of the failed item in the request array
              error:
                $ref: "#/components/schemas/CatalogError"
    InventoryEntry:
      type: object
      description: Inventory record for a single warehouse location
      properties:
        locationId:
          type: string
        locationName:
          type: string
        country:
          $ref: "#/components/schemas/Country"
        state:
          $ref: "#/components/schemas/InventoryState"
        quantityOnHand:
          type: integer
        quantityReserved:
          type: integer
        quantityAvailable:
          type: integer
        reorderPoint:
          type: integer
        reorderQuantity:
          type: integer
        lastCountedAt:
          type: string
          format: date-time
        lastReceivedAt:
          type: string
          format: date-time
    InventoryResponse:
      type: object
      properties:
        itemId:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/InventoryEntry"
        totalOnHand:
          type: integer
        totalAvailable:
          type: integer
        totalReserved:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT bearer token authentication
    basicAuth:
      type: http
      scheme: basic
      description: Basic authentication with Kenny
    webhook_signature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC SHA256 signature of the webhook payload
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication - see https://buildwithfern.com/learn/docs/getting-started/overview to get your API key
