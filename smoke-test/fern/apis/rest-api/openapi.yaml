              success: true
  /plant/search/stream:
    post:
      tags:
        - plant
      summary: Stream plant search results (SSE with stream-condition)
      description: |
        Search for plants and stream the results as they are found.
        This endpoint demonstrates x-fern-streaming with format: sse and stream-condition.
      operationId: searchPlantsStream
      security:
        - bearerAuth: []
      requestBody:
        description: Search parameters
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantSearchRequest"
      x-fern-streaming:
        format: sse
        stream-condition: $request.stream
        stream-description: |
          When stream=true, results are streamed as SSE events.
          Each event contains a partial result as it's found.
        response:
          $ref: "#/components/schemas/PlantSearchBatchResponse"
        response-stream:
          $ref: "#/components/schemas/PlantSearchStreamEvent"
      responses:
        "200":
          description: Search results (batch mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantSearchBatchResponse"
webhooks:
  orderStatusChanged:
    post:
      tags:
        - store
      summary: Order status change notification
      description: |
        Notifies your application when an order's status changes. You must configure a webhook URL in your account settings to receive these notifications.

        **Event Types**:
        - Order placed
        - Order confirmed
        - Order shipped
        - Order delivered
        - Order cancelled
      operationId: onOrderStatusChanged
      requestBody:
        description: Order status change event payload
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusWebhook"
            examples:
              orderShipped:
                summary: Order shipped notification
                value:
                  event: "order.shipped"
                  timestamp: "2024-01-15T14:30:00Z"
                  data:
                    orderId: 12345
                    status: "shipped"
                    trackingNumber: "1Z999AA10123456784"
                    estimatedDelivery: "2024-01-18T12:00:00Z"
      responses:
        "200":
          description: |
            Webhook received and processed successfully. Your server should return this response to acknowledge receipt of the webhook event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcknowledgement"
              examples:
                success:
                  summary: Successful acknowledgement
                  value:
                    received: true
                    processedAt: "2024-01-15T14:30:01Z"
        "400":
          description: |
            The webhook payload was malformed or missing required fields. Check the error details for specific validation failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
              examples:
                invalidPayload:
                  summary: Invalid payload error
                  value:
                    error: "Invalid webhook payload"
                    code: "INVALID_PAYLOAD"
                    details: "Missing required field: orderId"
        "500":
          description: |
            An internal server error occurred while processing the webhook. The webhook delivery will be retried automatically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
              examples:
                serverError:
                  summary: Server error
                  value:
                    error: "Internal server error"
                    code: "INTERNAL_ERROR"
                    details: "Database connection failed"
      security:
        - webhook_signature: []
  plantInventoryLow:
    post:
      tags:
        - plant
      summary: Low inventory alert
      description: |
        Notifies your application when a plant's inventory falls below the configured threshold.
        Configure webhook URL and inventory thresholds in your account settings.
      operationId: onPlantInventoryLow
      requestBody:
        description: Low inventory alert payload
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAlertWebhook"
            examples:
              lowInventory:
                summary: Low inventory alert
                value:
                  event: "inventory.low"
                  timestamp: "2024-01-15T09:00:00Z"
                  data:
                    plantId: 101
                    plantName: "Fern"
                    currentStock: 5
                    threshold: 10
                    recommendedReorder: 50
      responses:
        "200":
          description: |
            Webhook received and processed successfully. Your inventory management system has acknowledged the low stock alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAcknowledgement"
              examples:
                success:
                  summary: Alert acknowledged
                  value:
                    received: true
                    processedAt: "2024-01-15T09:00:01Z"
        "400":
          description: |
            The webhook payload was malformed or missing required fields. Ensure the payload includes plantId, currentStock, and threshold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
              examples:
                invalidPayload:
                  summary: Missing plant ID
                  value:
                    error: "Invalid webhook payload"
                    code: "INVALID_PAYLOAD"
                    details: "Missing required field: plantId"
        "500":
          description: |
            An internal server error occurred while processing the inventory alert. The webhook delivery will be retried automatically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookError"
              examples:
                serverError:
                  summary: Database error
                  value:
                    error: "Internal server error"
                    code: "INTERNAL_ERROR"
                    details: "Failed to update inventory tracking system"
      security:
        - webhook_signature: []
  /catalog/items:
    post:
      tags:
        - catalog
      summary: Create a catalog item
      description: |
        Creates a new item in the plant catalog. Items can be plants, seeds, tools, or accessories.
        Each item type has distinct properties represented as a discriminated union.
        Supports complex nested structures with large enum types for categorization.
      operationId: createCatalogItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogItemRequest"
            examples:
              tropicalPlant:
                summary: Create a tropical plant item
                value:
                  idempotencyKey: "abc-123-def"
                  item:
                    type: "PLANT"
                    name: "Bird of Paradise"
                    description: "Tropical flowering plant with dramatic orange and blue flowers"
                    category: TROPICAL
                    currency: USD
                    priceCents: 4500
                    country: US
                    tags: ["tropical", "flowering", "indoor"]
                    plantDetails:
                      genus: "Strelitzia"
                      species: "reginae"
                      careLevel: INTERMEDIATE
                      lightRequirement: BRIGHT_INDIRECT
                      waterFrequency: WEEKLY
                      matureHeightCm: 150
                      toxicity: MILDLY_TOXIC
              gardenTool:
                summary: Create a garden tool item
                value:
                  idempotencyKey: "xyz-456-ghi"
                  item:
                    type: "TOOL"
                    name: "Precision Pruning Shears"
                    description: "Ergonomic bypass pruners for clean cuts"
                    category: TOOLS
                    currency: USD
                    priceCents: 2999
                    country: US
                    tags: ["tools", "pruning"]
                    toolDetails:
                      material: STAINLESS_STEEL
                      weightGrams: 220
                      warrantyMonths: 24
      responses:
        "200":
          description: Catalog item created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemResponse"
        "400":
          description: Invalid request — validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogError"
        "409":
          description: Idempotency conflict — item already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogError"
  /catalog/items/search:
    post:
      tags:
        - catalog
      summary: Search catalog items
      description: |
        Search for catalog items with complex filters. Supports filtering by category,
        country, currency, price range, and item-type-specific attributes.
        Returns paginated results with full item details.
      operationId: searchCatalogItems
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchCatalogRequest"
            examples:
              searchTropicals:
                summary: Search for tropical plants under $100
                value:
                  filter:
                    categories: [TROPICAL, INDOOR, SUCCULENTS]
                    countries: [US, CA, MX, GB]
                    currencies: [USD, CAD]
                    priceRange:
                      minCents: 1000
                      maxCents: 10000
                    itemTypes: [PLANT, SEED]
                  sortBy: PRICE_ASC
                  limit: 50
                  cursor: null
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchCatalogResponse"
        "400":
          description: Invalid search parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogError"
  /catalog/items/{itemId}:
    get:
      tags:
        - catalog
      summary: Get a catalog item by ID
      description: |
        Retrieves a single catalog item with all its nested details,
        including type-specific properties, pricing in the requested currency,
        and inventory status across all locations.
      operationId: getCatalogItem
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          description: Unique identifier of the catalog item
          schema:
            type: string
        - name: currency
          in: query
          required: false
          description: Currency for price conversion
          schema:
            $ref: "#/components/schemas/Currency"
        - name: includeInventory
          in: query
          required: false
          description: Whether to include inventory data for all locations
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Catalog item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItemResponse"
        "404":
          description: Catalog item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogError"
  /catalog/bulk:
    post:
      tags:
        - catalog
      summary: Bulk upsert catalog items
      description: |
        Create or update multiple catalog items in a single batch operation.
        Supports up to 100 items per request. Each item in the batch can be
        a different type (plant, seed, tool, accessory). Returns per-item
        results including any validation errors.
      operationId: bulkUpsertCatalogItems
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpsertCatalogRequest"
      responses:
        "200":
          description: Bulk operation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpsertCatalogResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogError"
  /catalog/items/{itemId}/inventory:
    get:
      tags:
        - catalog
      summary: Get inventory for a catalog item
      description: |
        Returns inventory counts and status for a catalog item across all
        warehouse locations. Includes adjustment history and reorder recommendations.
      operationId: getCatalogItemInventory
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: locationCountry
          in: query
          required: false
          description: Filter inventory by warehouse country
          schema:
            $ref: "#/components/schemas/Country"
        - name: state
          in: query
          required: false
          description: Filter by inventory state
          schema:
            $ref: "#/components/schemas/InventoryState"
      responses:
        "200":
          description: Inventory details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogError"
components:
  schemas:
    Plant:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [available, pending, sold]
    PlantResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        tags:
          type: array
          items:
            type: string
    UserAuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Authentication token
        expiresIn:
          type: integer
          description: Token expiration time in seconds
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
    WebSocketPlantCreatedEvent:
      type: object
      description: Event sent when a new plant is added to inventory
      properties:
        event:
          type: string
          enum: ["plant.created"]
        timestamp:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/PlantResponse"
    WebSocketPlantUpdatedEvent:
      type: object
      description: Event sent when a plant is updated
      properties:
        event:
          type: string
          enum: ["plant.updated"]
        timestamp:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/PlantResponse"
    WebSocketPlantDeletedEvent:
      type: object
      description: Event sent when a plant is removed from inventory
      properties:
        event:
          type: string
          enum: ["plant.deleted"]
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          properties:
            id:
              type: integer
              description: ID of the deleted plant
    OrderStatusWebhook:
      type: object
      description: Webhook payload for order status changes
      required:
        - event
        - timestamp
        - data
      properties:
        event:
          type: string
          enum: ["order.placed", "order.confirmed", "order.shipped", "order.delivered", "order.cancelled"]
          description: The type of order event
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        data:
          type: object
          properties:
            orderId:
              type: integer
              description: Unique order identifier
            status:
              type: string
              description: Current order status
            trackingNumber:
              type: string
              description: Shipping tracking number (if applicable)
            estimatedDelivery:
              type: string
              format: date-time
              description: Estimated delivery date (if applicable)
    InventoryAlertWebhook:
      type: object
      description: Webhook payload for low inventory alerts
      required:
        - event
        - timestamp
        - data
      properties:
        event:
          type: string
          enum: ["inventory.low"]
          description: The type of inventory event
        timestamp:
          type: string
          format: date-time
          description: When the alert was triggered
        data:
          type: object
          properties:
            plantId:
              type: integer
              description: ID of the plant with low inventory
            plantName:
              type: string
              description: Name of the plant
            currentStock:
              type: integer
              description: Current inventory level
            threshold:
              type: integer
              description: Configured threshold for low inventory alerts
            recommendedReorder:
              type: integer
              description: Recommended reorder quantity
    WebhookAcknowledgement:
      type: object
      description: Standard acknowledgement response for webhook events. Return this response to confirm successful receipt and processing of the webhook.
      required:
        - received
      properties:
        received:
          type: boolean
          description: Indicates whether the webhook was successfully received
        processedAt:
          type: string
          format: date-time
          description: Timestamp when the webhook was processed by your server
        message:
          type: string
          description: Optional message providing additional context about the processing
    WebhookError:
      type: object
      description: Error response returned when webhook processing fails. Includes error details to help diagnose the issue.
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message describing what went wrong
        code:
          type: string
          description: Machine-readable error code for programmatic handling
          enum: ["INVALID_PAYLOAD", "INTERNAL_ERROR", "SIGNATURE_MISMATCH", "RATE_LIMITED"]
        details:
          type: string
          description: Additional details about the error, such as which field failed validation
    SpecificError:
      type: object
      description: Error response for specific status codes (400, 500)
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
    WildcardError:
      type: object
      description: Generic error response for wildcard status codes (4XX/5XX)
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
        statusCode:
          type: integer
          description: The actual HTTP status code
        details:
          type: object
          additionalProperties: true
          description: Additional error details
    RateLimitError:
      type: object
      description: Error response when rate limit is exceeded (429)
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
        retryAfter:
          type: integer
          description: Number of seconds to wait before retrying
    ServiceUnavailableError:
      type: object
      description: Error response when service is temporarily unavailable (503)
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Additional details about the service unavailability
    PlantUpdateEvent:
      type: object
      description: A streaming event for plant updates
      properties:
        event:
          type: string
          enum: ["plant.created", "plant.updated", "plant.deleted"]
          description: Type of plant event
        timestamp:
          type: string
          format: date-time
          description: When the event occurred
        plant:
          $ref: "#/components/schemas/PlantResponse"
    PlantSearchRequest:
      type: object
      description: Request parameters for plant search
      properties:
        query:
          type: string
          description: Search query for plant names or tags
        status:
          type: string
          enum: [available, pending, sold]
          description: Filter by plant status
        stream:
          type: boolean
          default: false
          description: When true, results are streamed as SSE events
      required:
        - query
    PlantSearchBatchResponse:
      type: object
      description: Batch response containing all search results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PlantResponse"
        total:
          type: integer
          description: Total number of results found
    PlantSearchStreamEvent:
      type: object
      description: A single streaming event from plant search
      properties:
        event:
          type: string
          enum: ["search.result", "search.complete"]
          description: Type of search event
        seq:
          type: integer
          description: Sequence number of this event
        data:
          $ref: "#/components/schemas/PlantResponse"
    OneOfDiscriminatedA:
      type: object
      description: First variant for discriminated oneOf
      required:
        - type
        - variantAField
      properties:
        type:
          type: string
        variantAField:
          type: string
    OneOfDiscriminatedB:
      type: object
      description: Second variant for discriminated oneOf
      required:
        - type
        - variantBField
      properties:
        type:
          type: string
        variantBField:
          type: integer
    OneOfVariantA:
      type: object
      description: First variant for oneOf without discriminator
      required:
        - variantAField
      properties:
        variantAField:
          type: string
    OneOfVariantB:
      type: object
      description: Second variant for oneOf without discriminator
      required:
        - variantBField
      properties:
        variantBField:
          type: integer
    OneOfTitledA:
      title: Titled Variant A
      type: object
      description: First variant for oneOf with title
      required:
        - titledFieldA
      properties:
        titledFieldA:
          type: string
    OneOfTitledB:
      title: Titled Variant B
      type: object
      description: Second variant for oneOf with title
      required:
        - titledFieldB
      properties:
        titledFieldB:
          type: integer
    ObjectWithUnionProperty:
      type: object
      description: An object that contains a discriminated union as one of its properties
      required:
        - name
        - plantType
      properties:
        name:
          type: string
          description: Name of the plant
        plantType:
          description: The type of plant (discriminated union)
          oneOf:
            - $ref: "#/components/schemas/FloweringPlant"
            - $ref: "#/components/schemas/SucculentPlant"
          discriminator:
            propertyName: type
            mapping:
              flowering: "#/components/schemas/FloweringPlant"
              succulent: "#/components/schemas/SucculentPlant"
    FloweringPlant:
      type: object
      description: A flowering plant variant
      required:
        - type
        - flowerColor
      properties:
        type:
          type: string
        flowerColor:
          type: string
          description: Color of the flowers
    SucculentPlant:
      type: object
      description: A succulent plant variant
      required:
        - type
        - waterRetention
      properties:
        type:
          type: string
        waterRetention:
          type: integer
          description: Water retention percentage
    AnyOfVariantA:
      type: object
      description: First variant for anyOf without title
      required:
        - optionA
      properties:
        optionA:
          type: string
    AnyOfVariantB:
      type: object
      description: Second variant for anyOf without title
      required:
        - optionB
      properties:
        optionB:
          type: boolean
    AnyOfTitledA:
      title: Option A
      type: object
      description: First variant for anyOf with title
      required:
        - optionA
      properties:
        optionA:
          type: string
    AnyOfTitledB:
      title: Option B
      type: object
      description: Second variant for anyOf with title
      required:
        - optionB
      properties:
        optionB:
          type: boolean
    # Error schemas for oneOf examples (with discriminator)
    ValidationError:
      type: object
      description: Validation error with discriminator
      required:
        - errorType
        - message
        - field
      properties:
        errorType:
          type: string
        message:
          type: string
        field:
          type: string
    InvalidTypeError:
      type: object
      description: Invalid type error with discriminator
      required:
        - errorType
        - message
        - expectedType
      properties:
        errorType:
          type: string
        message:
          type: string
        expectedType:
          type: string
    # Error schemas for oneOf examples (no discriminator)
    ErrorVariantA:
      type: object
      description: Error variant A without discriminator
      required:
        - errorCodeA
      properties:
        errorCodeA:
          type: string
        details:
          type: string
    ErrorVariantB:
      type: object
      description: Error variant B without discriminator
      required:
        - errorCodeB
      properties:
        errorCodeB:
          type: integer
        reason:
          type: string
    # Error schemas for oneOf examples (with titles)
    ErrorTitledA:
      title: Error Type A
      type: object
      description: Error variant A with title
      required:
        - errorA
      properties:
        errorA:
          type: string
    ErrorTitledB:
      title: Error Type B
      type: object
      description: Error variant B with title
      required:
        - errorB
      properties:
        errorB:
          type: integer
    # Error schemas for anyOf examples (no titles)
    AnyOfErrorA:
      type: object
      description: AnyOf error variant A
      required:
        - fieldError
      properties:
        fieldError:
          type: string
    AnyOfErrorB:
      type: object
      description: AnyOf error variant B
      required:
        - formatError
      properties:
        formatError:
          type: boolean
    # Error schemas for anyOf examples (with titles)
    AnyOfErrorTitledA:
      title: Field Error
      type: object
      description: AnyOf error variant A with title
      required:
        - fieldIssue
      properties:
        fieldIssue:
          type: string
    AnyOfErrorTitledB:
      title: Format Error
      type: object
      description: AnyOf error variant B with title
      required:
        - formatIssue
      properties:
        formatIssue:
          type: boolean
