  /anyOf/no-titles:
    post:
      tags:
        - anyOf Examples
      summary: Example endpoint using anyOf without titles
      description: |
        Demonstrates anyOf without title fields.

        <CodeBlock title="OpenAPI Spec">
        ```yaml
        schema:
          anyOf:
            - $ref: "#/components/schemas/AnyOfVariantA"
            - $ref: "#/components/schemas/AnyOfVariantB"

        components:
          schemas:
            AnyOfVariantA:
              type: object
              required:
                - optionA
              properties:
                optionA:
                  type: string
            AnyOfVariantB:
              type: object
              required:
                - optionB
              properties:
                optionB:
                  type: boolean
        ```
        </CodeBlock>
      operationId: anyOfExampleNoTitles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/AnyOfVariantA"
                - $ref: "#/components/schemas/AnyOfVariantB"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          description: Bad request error
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AnyOfErrorA"
                  - $ref: "#/components/schemas/AnyOfErrorB"
      x-fern-examples:
        - name: VariantA
          request:
            optionA: "example string"
          response:
            body:
              success: true
        - name: VariantB
          request:
            optionB: true
          response:
            body:
              success: true
        - name: BothVariants
          request:
            optionA: "combined"
            optionB: false
          response:
            body:
              success: true
  /anyOf/titled:
    post:
      tags:
        - anyOf Examples
      summary: Example endpoint using anyOf with titles
      description: |
        Demonstrates anyOf with title field per OpenAPI spec.

        <CodeBlock title="OpenAPI Spec">
        ```yaml
        schema:
          anyOf:
            - $ref: "#/components/schemas/AnyOfTitledA"
            - $ref: "#/components/schemas/AnyOfTitledB"

        components:
          schemas:
            AnyOfTitledA:
              title: Option A
              type: object
              required:
                - optionA
              properties:
                optionA:
                  type: string
            AnyOfTitledB:
              title: Option B
              type: object
              required:
                - optionB
              properties:
                optionB:
                  type: boolean
        ```
        </CodeBlock>
      operationId: anyOfExample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/AnyOfTitledA"
                - $ref: "#/components/schemas/AnyOfTitledB"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          description: Bad request error
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AnyOfErrorTitledA"
                  - $ref: "#/components/schemas/AnyOfErrorTitledB"
      x-fern-examples:
        - name: VariantA
          request:
            optionA: "example string"
          response:
            body:
              success: true
        - name: VariantB
          request:
            optionB: true
          response:
            body:
              success: true
        - name: BothVariants
          request:
            optionA: "combined"
