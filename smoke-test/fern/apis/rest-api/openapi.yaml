        - POTS
        - TOOLS
        - ACCESSORIES
        - GIFT_SETS
        - SEASONAL
        - RARE_SPECIMENS
        - NATIVE_PLANTS
    CatalogItemType:
      type: string
      description: The type of catalog item
      enum:
