          response:
            body:
              success: true
  /plant/updates/stream:
    get:
      x-fern-examples:
        - request:
            body: {}
          response:
            body:
              - event: plant.created
                timestamp: '2024-04-20T14:45:00Z'
                plant:
                  id: 101
