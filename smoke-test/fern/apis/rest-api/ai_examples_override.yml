    post:
      x-fern-examples:
        - request:
            body:
              variantAField: Greenhouse Model X
          response:
            body:
              success: true
  /oneOf/discriminator:
    post:
      x-fern-examples:
        - request:
            body:
              type: variantA
              variantAField: Sample data for variant A
          response:
            body:
              success: true
  /anyOf/no-titles:
    post:
      x-fern-examples:
        - request:
            body:
