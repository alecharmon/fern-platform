syntax = "proto3";

package comments.v1;

option go_package = "github.com/fern-api/fern-platform/comments/v1";

import "google/api/annotations.proto";
import "fern/options.proto";

service CommentsService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // Create a comment on a resource
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse) {
    option (google.api.http) = {
      post: "/comments/v1/comments"
      response_body: "comment"
      body: "*"
    };
    option (fern.summary) = "Add a Comment";
  }
}

// Request message for creating a new comment on a resource.
// The caller must provide the resource ID, comment text, and author name.
message CreateCommentRequest {
  string resource_id = 1;
  string text = 2;
  string author = 3;
}

// Response message containing the newly created comment.
message CreateCommentResponse {
  Comment comment = 1;
}

// Represents a comment left on a resource.
// Each comment has a unique ID, is associated with a resource, and tracks the author and creation time.
message Comment {
  string id = 1;
  string resource_id = 2;
  string text = 3;
  string author = 4;
  int64 created_at = 5;
}
